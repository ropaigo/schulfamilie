// ============================================================================
// VISTA 5: HORAS Y SINCRONIZACIÓN P2P (WEBRTC EN VIVO + QUICK SHARE SAMSUMG)
// ============================================================================
function StatsAndP2PSyncView({ appData, setAppData, showToast }) {
  const [peerStatus, setPeerStatus] = useState('idle'); // 'idle' | 'connecting' | 'ready' | 'connected' | 'error'
  const [roomCode, setRoomCode] = useState('');
  const [targetCodeInput, setTargetCodeInput] = useState('');
  const [syncLogs, setSyncLogs] = useState([]);
  const fileInputRef = useRef(null);
  const peerInstanceRef = useRef(null);

  const addLog = (msg) => {
    setSyncLogs((prev) => [new Date().toLocaleTimeString().slice(0, 5) + ' · ' + msg, ...prev.slice(0, 5)]);
  };

  const getPeerJS = () => {
    return new Promise((resolve, reject) => {
      if (window.Peer) return resolve(window.Peer);
      reject(new Error('Librería P2P no disponible sin conexión inicial'));
    });
  };

  // 1. MÓVIL DE PAPÁ: ABRIR SALA FAMILIAR EN VIVO
  const startHostRoom = async () => {
    try {
      setPeerStatus('connecting');
      addLog('Iniciando sala P2P para la familia...');
      const PeerClass = await getPeerJS();
      const code = 'FAMILIA-' + Math.floor(1000 + Math.random() * 9000);
      setRoomCode(code);

      if (peerInstanceRef.current) peerInstanceRef.current.destroy();
      const peer = new PeerClass(code);
      peerInstanceRef.current = peer;

      peer.on('open', (id) => {
        setPeerStatus('ready');
        addLog('📡 Sala abierta: ' + id + '. Esperando a Enrique o Fernando...');
      });

      peer.on('connection', (conn) => {
        conn.on('open', () => {
          setPeerStatus('connected');
          addLog('🤝 ¡Dispositivo conectado! Recibiendo datos...');
        });

        conn.on('data', (incoming) => {
          if (incoming && incoming.type === 'SYNC_DATA') {
            setAppData((prev) => {
              const merged = smartMergeState(prev, incoming.payload);
              // Responder con los datos consolidados
              conn.send({ type: 'SYNC_CONFIRM', payload: merged });
              return merged;
            });
            addLog('✅ ¡Datos fusionados sin perder nada!');
            showToast('🔄 Datos fusionados con éxito vía P2P');
          }
        });
      });

      peer.on('error', (err) => {
        setPeerStatus('error');
        addLog('Aviso: ' + err.message);
      });
    } catch (e) {
      setPeerStatus('error');
      addLog('Error: ' + e.message);
    }
  };

  // 2. MÓVIL DEL HIJO: CONECTAR A LA SALA DE PAPÁ
  const connectToHost = async () => {
    const code = targetCodeInput.trim().toUpperCase();
    if (!code) {
      alert('Escribe el código que sale en el móvil de Papá (ej. FAMILIA-4821)');
      return;
    }
    try {
      setPeerStatus('connecting');
      addLog('Conectando con el móvil de Papá (' + code + ')...');
      const PeerClass = await getPeerJS();
      if (peerInstanceRef.current) peerInstanceRef.current.destroy();
      const peer = new PeerClass();
      peerInstanceRef.current = peer;

      peer.on('open', () => {
        const conn = peer.connect(code);
        conn.on('open', () => {
          setPeerStatus('connected');
          addLog('Enviando mis temas y repasos a Papá...');
          conn.send({ type: 'SYNC_DATA', payload: appData });
        });

        conn.on('data', (res) => {
          if (res && res.type === 'SYNC_CONFIRM') {
            setAppData((prev) => smartMergeState(prev, res.payload));
            addLog('✅ ¡Sincronizado con Papá con éxito!');
            showToast('🔄 Sincronizado con Papá correctamente');
          }
        });
      });

      peer.on('error', (err) => {
        setPeerStatus('error');
        addLog('No se pudo conectar: ' + err.message);
      });
    } catch (e) {
      setPeerStatus('error');
      addLog('Error: ' + e.message);
    }
  };

  // 3. SAMSUNG QUICK SHARE / COMPARTIR NATIVO
  const handleNativeShare = async () => {
    const jsonStr = JSON.stringify(appData, null, 2);
    const fileName = 'schulfamilie_datos.json';

    // En móviles Android (Samsung), navigator.share abre Quick Share
    if (navigator.share && navigator.canShare) {
      try {
        const file = new File([jsonStr], fileName, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: 'SchulFamilie Datos',
            text: 'Paquete de estudio de SchulFamilie para Papá',
            files: [file],
          });
          showToast('📤 Enviado por Quick Share');
          return;
        }
      } catch (err) {
        // Fallback si el usuario canceló o el navegador no soporta enviar archivos
      }
    }

    // Fallback: descarga directa del archivo .json
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(url);
    showToast('📥 Archivo guardado');
  };

  // 4. IMPORTAR Y FUSIONAR ARCHIVO EN EL MÓVIL DE PAPÁ
  const handleFileImport = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const importedData = JSON.parse(ev.target.result);
        if (!importedData.students) {
          alert('El archivo no parece ser una copia de SchulFamilie válida.');
          return;
        }
        setAppData((prev) => smartMergeState(prev, importedData));
        showToast('✅ ¡Datos importados y fusionados con éxito!');
        addLog('✅ Archivo importado: datos combinados (Smart Merge)');
      } catch (err) {
        alert('Error al leer el archivo JSON.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  return (
    <div className="space-y-4">
      {/* =====================================================================
          ESTADÍSTICAS DE PARTICIPACIÓN EN CLASE (MÜNDLICHE MITARBEIT) Y VERTRETUNG
         ===================================================================== */}
      {(() => {
        const studentSubjects = appData.subjects.filter((s) => s.student_id === currentStudent.id);
        const globalStats = computeParticipationStats(appData.class_sessions || [], currentStudent.id);
        const totalLost = globalStats.vertretungCount + globalStats.entfallCount;
        const lostPct =
          globalStats.totalSessions > 0
            ? Math.round((totalLost / globalStats.totalSessions) * 100)
            : 0;

        return (
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-slate-100">
              <div>
                <span className="text-[11px] font-extrabold uppercase text-indigo-600">
                  🙋‍♂️ Mündliche Mitarbeit &amp; Clases • {currentStudent.avatar} {currentStudent.name}
                </span>
                <h3 className="font-black text-base text-slate-900 mt-0.5">
                  Estadísticas de Participación en Clase y Vertretung
                </h3>
              </div>

              <div className="flex items-center gap-2">

            {/* Tarjetas resumen global de sesiones */}

              <div className="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200">
                <div className="text-base font-black text-emerald-800">{globalStats.normalCount}</div>
                <div className="text-[11px] font-bold text-emerald-700">📖 Clases Normales</div>

            {/* Desglose por Asignatura */}

                Media de Participación (1 = Muy alta, 5 = Baja) y Vertretungen por Asignatura:
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                {studentSubjects.map((subj) => {
                  const st = computeParticipationStats(

                      {/* Barra visual de porcentaje de participación */}

  appData,
  studentId,
  onClose,
  upsertTopicAndSubtopic,
  recordClassSessionOnly,
}) {
  const student = appData.students.find((s) => s.id === studentId) || appData.students[0];
  const jsDay = new Date().getDay();
  const defaultWeekday = jsDay >= 1 && jsDay <= 5 ? jsDay : 1;
  const [weekday, setWeekday] = useState(defaultWeekday);

  const scheduledSubjectIds =
    (appData.schedules[student.id] && appData.schedules[student.id][weekday]) || [];
  const studentSubjects = appData.subjects.filter((s) => s.student_id === student.id);

  // Construimos la cola de asignaturas del día según su horario escolar
  const dayQueue = useMemo(() => {
    if (scheduledSubjectIds.length > 0) {
      return scheduledSubjectIds
        .map((id, idx) => {
          const subj = studentSubjects.find((s) => s.id === id);
          return subj ? { ...subj, period_idx: idx } : null;
        })
        .filter(Boolean);
    }
    return studentSubjects.map((s, idx) => ({ ...s, period_idx: idx }));
  }, [scheduledSubjectIds, studentSubjects]);

  const [queueIdx, setQueueIdx] = useState(0);
  const currentSlot = dayQueue[queueIdx] || dayQueue[0];

  // Estado del formulario para la asignatura actual
  // sessionType: 'normal' | 'vertretung' | 'entfall'
  const [sessionType, setSessionType] = useState('normal');
  const [participation, setParticipation] = useState('2'); // '1' Muy alta, '2' Alta, '3' Normal, '5' Baja, 'na' No aplica

  const existingTopicsForSubject = appData.topics.filter(
    (t) => t.student_id === student.id && t.subject_id === currentSlot?.id
  );

  const [selectedTopicId, setSelectedTopicId] = useState(
    existingTopicsForSubject[0]?.id || 'NEW'
  );
  const [newTopicTitle, setNewTopicTitle] = useState('');
  const [subtopicTitle, setSubtopicTitle] = useState('');
  const [comp, setComp] = useState(3);
  const [mins, setMins] = useState(20);
  const [notes, setNotes] = useState('');

  useEffect(() => {
    const topics = appData.topics.filter(
      (t) => t.student_id === student.id && t.subject_id === currentSlot?.id
    );
    setSelectedTopicId(topics[0]?.id || 'NEW');
    setNewTopicTitle('');
    setSubtopicTitle('');
    setSessionType('normal');
    setParticipation('2');
    setComp(3);
    setMins(20);
    setNotes('');
  }, [queueIdx, weekday, currentSlot?.id]);

  const advanceOrClose = () => {
    if (queueIdx < dayQueue.length - 1) {
      setQueueIdx(queueIdx + 1);
    } else {
      onClose();
    }
  };

  // Tachado rápido en 1 toque cuando es Vertretung o Entfall
  const handleQuickVertretungOrEntfall = (statusType) => {
    if (!currentSlot) return;
    if (recordClassSessionOnly) {
      recordClassSessionOnly({
        student_id: student.id,
        subject_id: currentSlot.id,
        date: toDateStr(),
        period_idx: currentSlot.period_idx || queueIdx,
        status: statusType,
        participation: statusType === 'entfall' ? 'na' : participation === '2' ? 'na' : participation,
        note: notes.trim(),
      });
    }
    advanceOrClose();
  };

  const handleSaveNormal = () => {
    if (!currentSlot) return;
    if (sessionType === 'vertretung' || sessionType === 'entfall') {
      handleQuickVertretungOrEntfall(sessionType);
      return;
    }
    if (selectedTopicId === 'NEW' && !newTopicTitle.trim()) {
      alert('Escribe el nombre del Tema Principal nuevo (o marca arriba Vertretung si no dieron materia).');
      return;
    }
    if (!subtopicTitle.trim()) {
      alert('Escribe qué subtema habéis visto hoy en clase (o marca arriba Vertretung si no dieron temario).');
      return;
    }

    upsertTopicAndSubtopic({
      student_id: student.id,
      subject_id: currentSlot.id,
      topicIdOrNew: selectedTopicId,
      newTopicTitle: newTopicTitle.trim() || 'Tema General',
      subtopicTitle,
      comprehension: comp,
      participation,
      period_idx: currentSlot.period_idx || queueIdx,
      minutes: mins,
      notes,
      date: toDateStr(),
    });
    advanceOrClose();
  };

  return (
    <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-3">
      <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl shadow-2xl max-h-[92vh] flex flex-col overflow-hidden">
        {/* Cabecera */}
        <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
          <div>
            <span className="text-[10px] font-bold uppercase tracking-wider text-indigo-300">
              ✨ Recap Diario Guiado • {student.avatar} {student.name}
            </span>
            <h3 className="font-bold text-base">
              {currentSlot ? `${queueIdx + 1}ª Hora: ${currentSlot.icon} ${currentSlot.name}` : 'Recap'}
            </h3>
          </div>
          <button onClick={onClose} className="p-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white">
            <X className="w-5 h-5" />
          </button>
        </div>

        <div className="p-4 space-y-4 overflow-y-auto">
          {/* Selector de día y barra de asignaturas del horario */}
          <div>
            <div className="flex items-center justify-between text-xs text-slate-500 mb-1.5">
              <span>Asignaturas del horario escolar:</span>
              <select
                value={weekday}
                onChange={(e) => {
                  setWeekday(Number(e.target.value));
                  setQueueIdx(0);
                }}
                className="bg-slate-100 border border-slate-300 rounded-lg px-2 py-0.5 text-xs font-bold text-slate-800"
              >
                {WEEKDAYS.map((w) => (
                  <option key={w.key} value={w.key}>
                    {w.name} ({w.de})
                  </option>
                ))}
              </select>
            </div>

            <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
              {dayQueue.map((slot, idx) => (
                <button
                  key={`${slot.id}_${idx}`}
                  type="button"
                  onClick={() => setQueueIdx(idx)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 flex items-center gap-1 border transition ${
                    idx === queueIdx
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                      : 'bg-slate-100 text-slate-600 border-slate-200'
                  }`}
                >
                  <span>{idx + 1}. {slot.icon}</span>
                  <span>{slot.name}</span>
                </button>
              ))}
            </div>
          </div>

          {/* BOTONES DE ESTADO DE LA CLASE: NORMAL VS VERTRETUNG VS ENTFALL */}
          <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2">
            <div className="text-[11px] font-extrabold uppercase text-slate-600">
              1. ¿Hubo clase normal hoy o fue Vertretung / Cancelada?
            </div>
            <div className="grid grid-cols-3 gap-1.5">
              <button
                type="button"
                onClick={() => setSessionType('normal')}
                className={`py-2 px-2 rounded-xl text-xs font-bold border transition ${
                  sessionType === 'normal'
                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                    : 'bg-white text-slate-700 border-slate-200'
                }`}
              >
                📖 Clase Normal
              </button>
              <button
                type="button"
                onClick={() => setSessionType('vertretung')}
                className={`py-2 px-2 rounded-xl text-xs font-bold border transition ${
                  sessionType === 'vertretung'
                    ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-sm'
                    : 'bg-white text-amber-900 border-amber-300 hover:bg-amber-50'
                }`}
              >
                🔄 Vertretung
              </button>
              <button
                type="button"
                onClick={() => setSessionType('entfall')}
                className={`py-2 px-2 rounded-xl text-xs font-bold border transition ${
                  sessionType === 'entfall'
                    ? 'bg-slate-800 text-white border-slate-900 shadow-sm'
                    : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                }`}
              >
                🚫 Entfall
              </button>
            </div>

            {/* Si elige Vertretung o Entfall: permite tachar directamente sin pedir temas */}
            {(sessionType === 'vertretung' || sessionType === 'entfall') && (
              <div className="p-3 rounded-xl bg-amber-50 border border-amber-300 space-y-2.5 mt-2">
                <div className="text-xs font-bold text-amber-950">
                  {sessionType === 'vertretung'
                    ? '🔄 Sustitución (Vertretung): Quedará tachada en el horario de hoy sin tener que poner temas ni subtemas.'
                    : '🚫 Clase cancelada (Entfall): Quedará tachada como hora libre y contará en las estadísticas.'}
                </div>
                <input
                  type="text"
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  placeholder="Nota opcional (ej. Hicimos deberes con el profe de guardia)..."
                  className="w-full rounded-xl border border-amber-300 bg-white px-3 py-1.5 text-xs"
                />
                <button
                  type="button"
                  onClick={() => handleQuickVertretungOrEntfall(sessionType)}
                  className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shadow"
                >
                  {sessionType === 'vertretung'
                    ? '✓ Tachar como Vertretung y Pasar a Siguiente'
                    : '✓ Tachar como Entfall y Pasar a Siguiente'}
                </button>
              </div>
            )}
          </div>

          {sessionType === 'normal' && (
            <>
              {/* PARTICIPACIÓN EN CLASE (MÜNDLICHE MITARBEIT: 1 A 5 + NO APLICA DISCRETO) */}
              <div className="bg-emerald-50/50 border border-emerald-200 rounded-2xl p-3.5 space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-extrabold uppercase text-emerald-950">
                    2. 🙋‍♂️ Participación en clase hoy (Mündliche Mitarbeit):
                  </span>
                  <button
                    type="button"
                    onClick={() => setParticipation('na')}
                    className={`text-[10px] px-2 py-0.5 rounded-md border font-semibold transition ${
                      participation === 'na'
                        ? 'bg-slate-700 text-white border-slate-700'
                        : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-100'
                    }`}
                  >
                    ⚪ No aplica hoy
                  </button>
                </div>

                <div className="grid grid-cols-4 gap-1.5">
                  {PARTICIPATION_LEVELS.filter((p) => p.id !== 'na').map((p) => {
                    const active = participation === p.id;
                    return (
                      <button
                        key={p.id}
                        type="button"
                        onClick={() => setParticipation(p.id)}
                        className={`p-2 rounded-xl border text-center transition active:scale-95 ${
                          active ? p.activeClass : 'bg-white border-slate-200 text-slate-800 hover:bg-slate-50'
                        }`}
                      >
                        <div className="text-lg leading-none">{p.emoji}</div>
                        <div className="font-extrabold text-xs mt-1">{p.label}</div>
                        <div className={`text-[10px] ${active ? 'opacity-90' : 'text-slate-500'}`}>
                          Nota {p.id} ({p.pct}%)
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* TEMA PRINCIPAL Y SUBTEMA VISTO HOY */}
              <div className="bg-indigo-50/60 border border-indigo-200 rounded-2xl p-3.5 space-y-2.5">
                <div className="text-xs font-extrabold uppercase text-indigo-900">
                  3. 📚 ¿Qué tema y subtema habéis visto hoy?
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    Tema Principal (Unidad):
                  </label>
                  <select
                    value={selectedTopicId}
                    onChange={(e) => setSelectedTopicId(e.target.value)}
                    className="w-full rounded-xl border border-slate-300 bg-white p-2 text-xs font-bold"
                  >
                    {existingTopicsForSubject.map((t) => (
                      <option key={t.id} value={t.id}>
                        📂 {t.title} ({t.subtopics.length} subtemas)
                      </option>
                    ))}
                    <option value="NEW">➕ Crear un Tema Principal nuevo...</option>
                  </select>
                </div>

                {selectedTopicId === 'NEW' && (
                  <div>
                    <label className="block text-xs font-bold text-indigo-800 mb-1">
                      Título del nuevo Tema Principal:
                    </label>
                    <input
                      type="text"
                      value={newTopicTitle}
                      onChange={(e) => setNewTopicTitle(e.target.value)}
                      placeholder="Ej. Fracciones (Bruchrechnung) o Fotosíntesis"
                      className="w-full rounded-xl border border-indigo-300 bg-white p-2 text-xs"
                    />
                  </div>
                )}

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    Subtema concreto visto hoy:
                  </label>
                  <input
                    type="text"
                    value={subtopicTitle}
                    onChange={(e) => setSubtopicTitle(e.target.value)}
                    placeholder="Ej. Suma de fracciones con distinto denominador"
                    className="w-full rounded-xl border border-slate-300 bg-white p-2 text-xs"
                  />
                </div>
              </div>

              {/* NIVEL DE COMPRENSIÓN */}
              <div>
                <label className="block text-xs font-extrabold uppercase text-slate-700 mb-1.5">
                  4. 🧠 ¿Cómo de bien lo has entendido hoy?
                </label>
                <div className="grid grid-cols-2 gap-1.5">
                  {COMPREHENSION_LEVELS.map((lvl) => (
                    <button
                      key={lvl.id}
                      type="button"
                      onClick={() => setComp(lvl.id)}
                      className={`p-2 rounded-xl border text-xs font-bold text-left flex items-center justify-between ${
                        comp === lvl.id
                          ? 'ring-2 ring-indigo-600 bg-indigo-50 border-indigo-500'
                          : 'bg-slate-50 border-slate-200'
                      }`}
                    >
                      <span>
                        {lvl.emoji} {lvl.short}
                      </span>
                      <span className="text-[10px] text-slate-400">{lvl.days}d</span>
                    </button>
                  ))}
                </div>
              </div>

              {/* TIEMPO Y NOTA CLAVE */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    ⏱️ Tiempo de repaso hoy:
                  </label>
                  <div className="flex items-center gap-1">
                    {[0, 15, 30, 45].map((m) => (
                      <button
                        key={m}
                        type="button"
                        onClick={() => setMins(m)}
                        className={`flex-1 py-1.5 rounded-lg text-xs font-bold border ${
                          mins === m
                            ? 'bg-slate-900 text-white border-slate-900'
                            : 'bg-slate-100 text-slate-700 border-slate-200'
                        }`}
                      >
                        {m === 0 ? '0m' : `+${m}m`}
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    💡 Pista o nota del profesor:
                  </label>
                  <input
                    type="text"
                    value={notes}
                    onChange={(e) => setNotes(e.target.value)}
                    placeholder="Fórmula o clave dicha en clase"
                    className="w-full rounded-xl border border-slate-300 p-1.5 text-xs"
                  />
                </div>
              </div>
            </>
          )}
        </div>

        {/* Botonera inferior */}
        <div className="p-4 border-t border-slate-200 bg-slate-50 flex items-center justify-between gap-2">
          {queueIdx < dayQueue.length - 1 ? (
            <button
              type="button"
              onClick={() => setQueueIdx(queueIdx + 1)}
              className="px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-600 text-xs font-bold"
            >
              Saltar hora →
            </button>
          ) : (
            <button
              type="button"
              onClick={onClose}
              className="px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-600 text-xs font-bold"
            >
              Cerrar
            </button>
          )}

          <button
            type="button"
            onClick={handleSaveNormal}
            className="flex-1 py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow"
          >
            {sessionType === 'normal'
              ? queueIdx < dayQueue.length - 1
                ? 'Guardar y Siguiente Hora →'
                : 'Guardar y Terminar Recap'
              : '✓ Confirmar Tachado'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// MODAL +TIEMPO
// ============================================================================
function QuickAddTimeModal({ target, onClose, onSave }) {
  const [mins, setMins] = useState(30);
  return (
    <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="bg-white w-full max-w-sm rounded-2xl p-4 shadow-xl space-y-3">
        <h3 className="font-bold text-sm">⏱️ +Tiempo en {target.title}</h3>
        <div className="grid grid-cols-4 gap-1.5">
          {[15, 30, 45, 60].map((m) => (
            <button key={m} onClick={() => setMins(m)} className={`py-2 rounded-xl text-xs font-bold border ${mins === m ? 'bg-slate-900 text-white' : 'bg-slate-100'}`}>+{m}m</button>
          ))}
        </div>
        <button onClick={() => onSave({ student_id: target.student_id, subject_id: target.subject_id, topic_id: target.topic_id, minutes: mins })} className="w-full py-2 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow">
          Guardar +{mins}m
        </button>
      </div>
    </div>
  );
}

// Montar aplicación en DOM
const rootEl = document.getElementById("root");
if (rootEl) {
  const root = ReactDOM.createRoot(rootEl);
  root.render(React.createElement(App));
}
  </script>
</body>
</html>
