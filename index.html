// ============================================================================
// VISTA 5: HORAS Y SINCRONIZACIÓN P2P (WEBRTC EN VIVO + QUICK SHARE SAMSUMG)
// ============================================================================
function StatsAndP2PSyncView({ appData, currentStudent, setAppData, showToast }) {
  const [peerStatus, setPeerStatus] = useState('idle'); // 'idle' | 'connecting' | 'ready' | 'connected' | 'error'
  const [roomCode, setRoomCode] = useState('');
  const [targetCodeInput, setTargetCodeInput] = useState('');
  const [syncLogs, setSyncLogs] = useState([]);
  const fileInputRef = useRef(null);
  const peerInstanceRef = useRef(null);

  const addLog = (msg) => {
    setSyncLogs((prev) => [new Date().toLocaleTimeString().slice(0, 5) + ' · ' + msg, ...prev.slice(0, 5)]);
  };

  const getPeerJS = () => {
    return new Promise((resolve, reject) => {
      if (window.Peer) return resolve(window.Peer);
      reject(new Error('Librería P2P no disponible sin conexión inicial'));
    });
  };

  // 1. MÓVIL DE PAPÁ: ABRIR SALA FAMILIAR EN VIVO
  const startHostRoom = async () => {
    try {
      setPeerStatus('connecting');
      addLog('Iniciando sala P2P para la familia...');
      const PeerClass = await getPeerJS();
      const code = 'FAMILIA-' + Math.floor(1000 + Math.random() * 9000);
      setRoomCode(code);

      if (peerInstanceRef.current) peerInstanceRef.current.destroy();
      const peer = new PeerClass(code);
      peerInstanceRef.current = peer;

      peer.on('open', (id) => {
        setPeerStatus('ready');
        addLog('📡 Sala abierta: ' + id + '. Esperando a Enrique o Fernando...');
      });

      peer.on('connection', (conn) => {
        conn.on('open', () => {
          setPeerStatus('connected');
          addLog('🤝 ¡Dispositivo conectado! Recibiendo datos...');
        });

        conn.on('data', (incoming) => {
          if (incoming && incoming.type === 'SYNC_DATA') {
            setAppData((prev) => {
              const merged = smartMergeState(prev, incoming.payload);
              // Responder con los datos consolidados
              conn.send({ type: 'SYNC_CONFIRM', payload: merged });
              return merged;
            });
            addLog('✅ ¡Datos fusionados sin perder nada!');
            showToast('🔄 Datos fusionados con éxito vía P2P');
          }
        });
      });

      peer.on('error', (err) => {
        setPeerStatus('error');
        addLog('Aviso: ' + err.message);
      });
    } catch (e) {
      setPeerStatus('error');
      addLog('Error: ' + e.message);
    }
  };

  // 2. MÓVIL DEL HIJO: CONECTAR A LA SALA DE PAPÁ
  const connectToHost = async () => {
    const code = targetCodeInput.trim().toUpperCase();
    if (!code) {
      alert('Escribe el código que sale en el móvil de Papá (ej. FAMILIA-4821)');
      return;
    }
    try {
      setPeerStatus('connecting');
      addLog('Conectando con el móvil de Papá (' + code + ')...');
      const PeerClass = await getPeerJS();
      if (peerInstanceRef.current) peerInstanceRef.current.destroy();
      const peer = new PeerClass();
      peerInstanceRef.current = peer;

      peer.on('open', () => {
        const conn = peer.connect(code);
        conn.on('open', () => {
          setPeerStatus('connected');
          addLog('Enviando mis temas y repasos a Papá...');
          conn.send({ type: 'SYNC_DATA', payload: appData });
        });

        conn.on('data', (res) => {
          if (res && res.type === 'SYNC_CONFIRM') {
            setAppData((prev) => smartMergeState(prev, res.payload));
            addLog('✅ ¡Sincronizado con Papá con éxito!');
            showToast('🔄 Sincronizado con Papá correctamente');
          }
        });
      });

      peer.on('error', (err) => {
        setPeerStatus('error');
        addLog('No se pudo conectar: ' + err.message);
      });
    } catch (e) {
      setPeerStatus('error');
      addLog('Error: ' + e.message);
    }
  };

  // 3. SAMSUNG QUICK SHARE / COMPARTIR NATIVO
  const handleNativeShare = async () => {
    const jsonStr = JSON.stringify(appData, null, 2);
    const fileName = 'schulfamilie_datos.json';

    // En móviles Android (Samsung), navigator.share abre Quick Share
    if (navigator.share && navigator.canShare) {
      try {
        const file = new File([jsonStr], fileName, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: 'SchulFamilie Datos',
            text: 'Paquete de estudio de SchulFamilie para Papá',
            files: [file],
          });
          showToast('📤 Enviado por Quick Share');
          return;
        }
      } catch (err) {
        // Fallback si el usuario canceló o el navegador no soporta enviar archivos
      }
    }

    // Fallback: descarga directa del archivo .json
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(url);
    showToast('📥 Archivo guardado');
  };

  // 4. IMPORTAR Y FUSIONAR ARCHIVO EN EL MÓVIL DE PAPÁ
  const handleFileImport = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const importedData = JSON.parse(ev.target.result);
        if (!importedData.students) {
          alert('El archivo no parece ser una copia de SchulFamilie válida.');
          return;
        }
        setAppData((prev) => smartMergeState(prev, importedData));
        showToast('✅ ¡Datos importados y fusionados con éxito!');
        addLog('✅ Archivo importado: datos combinados (Smart Merge)');
      } catch (err) {
        alert('Error al leer el archivo JSON.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  return (
    <div className="space-y-4">
      {/* =====================================================================
          ESTADÍSTICAS DE PARTICIPACIÓN EN CLASE (MÜNDLICHE MITARBEIT) Y VERTRETUNG
         ===================================================================== */}
      {(() => {
        const studentSubjects = appData.subjects.filter((s) => s.student_id === currentStudent.id);
        const globalStats = computeParticipationStats(appData.class_sessions || [], currentStudent.id);
        const totalLost = globalStats.vertretungCount + globalStats.entfallCount;
        const lostPct =
          globalStats.totalSessions > 0
            ? Math.round((totalLost / globalStats.totalSessions) * 100)
            : 0;

        return (
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-slate-100">
              <div>
                <span className="text-[11px] font-extrabold uppercase text-indigo-600">
                  🙋‍♂️ Mündliche Mitarbeit &amp; Clases • {currentStudent.avatar} {currentStudent.name}
                </span>
                <h3 className="font-black text-base text-slate-900 mt-0.5">
                  Estadísticas de Participación en Clase y Vertretung
                </h3>
              </div>

              <div className="flex items-center gap-2">
                <div className="px-3 py-1.5 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-950 text-xs font-black">

            {/* Tarjetas resumen global de sesiones */}

              <div className="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200">
                <div className="text-base font-black text-emerald-800">{globalStats.normalCount}</div>
                <div className="text-[11px] font-bold text-emerald-700">📖 Clases Normales</div>
              </div>
              <div className="p-2.5 rounded-xl bg-amber-50 border border-amber-200">
                <div className="text-base font-black text-amber-800">{globalStats.vertretungCount}</div>
                <div className="text-[11px] font-bold text-amber-700">🔄 Vertretungen</div>

            {/* Desglose por Asignatura */}

              <div className="text-xs font-extrabold uppercase text-slate-500">
                Media de Participación (1 = Muy alta, 5 = Baja) y Vertretungen por Asignatura:
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                {studentSubjects.map((subj) => {
                  const st = computeParticipationStats(
                    appData.class_sessions || [],
                    currentStudent.id,
                    subj.id
                  );
                  return (
                    <div
                      key={subj.id}
                      className="p-3 rounded-xl border border-slate-200 bg-slate-50/70 space-y-2"

                        <span className="font-extrabold text-xs sm:text-sm text-slate-900 flex items-center gap-1.5">
                          <span>{subj.icon}</span>
                          <span>{subj.name}</span>
                        </span>
                        <span className="px-2.5 py-0.5 rounded-lg bg-white border border-slate-200 text-xs font-black text-indigo-700 shadow-2xs">
                          {st.avgEmoji} Ø {st.avgGradeStr}{' '}
                          <span className="font-semibold text-slate-500">
                            ({st.avgLabel})
                          </span>
                        </span>
                      </div>

                      {/* Barra visual de porcentaje de participación */}
                      <div className="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                        <div
                          className={`h-full transition-all ${
                            (st.avgPct || 0) >= 80
                              ? 'bg-emerald-500'
                              : (st.avgPct || 0) >= 55
                              ? 'bg-amber-500'
                              : 'bg-rose-500'
                          }`}
                          style={{ width: `${st.avgPct !== null ? st.avgPct : 0}%` }}
                        />
                      </div>

                      <div className="flex items-center justify-between text-[11px] text-slate-600 pt-0.5">
                        <div className="flex items-center gap-2">
                          <span title="Clases con materia normal">📖 <strong>{st.normalCount}</strong> norm.</span>
                          <span title="Sustituciones sin temario" className="text-amber-800">🔄 <strong>{st.vertretungCount}</strong> Vertr.</span>
                          <span title="Clases canceladas" className="text-slate-500">🚫 <strong>{st.entfallCount}</strong> Entf.</span>
                        </div>
                        <span className="font-bold text-slate-700">
                          {st.avgPct !== null ? `${st.avgPct}%` : 'Sin nota'}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      })()}

      {/* EXPLICACIÓN INFORMATIVA P2P */}
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <h3 className="font-extrabold text-sm text-slate-900 flex items-center gap-1.5 mb-1">
          <RefreshCw className="w-4 h-4 text-indigo-600" />
          Sincronización P2P entre Móviles (Sin Servidor)
        </h3>
        <p className="text-xs text-slate-600 leading-relaxed">
          Tus datos no pasan por ninguna empresa ni servidor central. Tienes dos formas de sincronizar los móviles de <strong>Enrique</strong> y <strong>Fernando</strong> con el de <strong>Papá</strong>:
        </p>
      </div>

      {/* MÉTODO 1: EN VIVO POR WIFI (WEBRTC) */}
      <div className="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 text-white rounded-2xl p-4 shadow-md space-y-3">
        <div className="flex items-center justify-between">
          <div>
            <span className="text-[10px] uppercase font-bold text-amber-400 flex items-center gap-1">
              <Wifi className="w-3.5 h-3.5" /> Método 1: En Vivo por WiFi (Automático)
            </span>
            <h4 className="font-bold text-sm mt-0.5">Conectar Móviles en Casa</h4>
          </div>
          <span className="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/30 text-indigo-200 font-semibold">
            WebRTC Directo
          </span>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
          {/* PANEL PAPÁ */}
          <div className="p-3 rounded-xl bg-white/10 border border-white/15 space-y-2">
            <div className="text-xs font-bold text-amber-300">👨‍👦‍👦 1. En el móvil de Papá:</div>
            <button
              onClick={startHostRoom}
              className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shadow active:scale-95 transition"
            >
              📡 Abrir Sala Familiar
            </button>
            {roomCode && (
              <div className="p-2 rounded-lg bg-black/50 border border-amber-400/40 text-center">
                <div className="text-[10px] text-slate-400">Código para Enrique y Fernando:</div>

              </div>

          {/* PANEL HIJO */}
          <div className="p-3 rounded-xl bg-white/10 border border-white/15 space-y-2">
            <div className="text-xs font-bold text-indigo-300">👦 2. En el móvil del hijo:</div>
            <input
              type="text"
              value={targetCodeInput}
              onChange={(e) => setTargetCodeInput(e.target.value)}
              placeholder="Ej. FAMILIA-4821"

            />
            <button

              className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs shadow active:scale-95 transition"
            >
              🔄 Sincronizar con Papá
            </button>
          </div>
        </div>

        {/* LOG DE ESTADO DE LA CONEXIÓN */}
        {syncLogs.length > 0 && (
          <div className="p-2.5 rounded-xl bg-black/40 border border-white/10 space-y-1">
            <div className="text-[10px] font-bold text-slate-400 uppercase">Estado en vivo:</div>
            {syncLogs.map((logItem, i) => (
              <div key={i} className="text-xs text-emerald-300 font-mono">{logItem}</div>
            ))}

      </div>

      {/* MÉTODO 2: OFFLINE O POR QUICK SHARE (SAMSUNG / BLUETOOTH) */}
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
        <div className="flex items-center justify-between">
          <div>
            <span className="text-[10px] uppercase font-bold text-indigo-600 flex items-center gap-1">
              <Smartphone className="w-3.5 h-3.5" /> Método 2: Quick Share de Samsung / Sin Internet
            </span>
            <h4 className="font-bold text-sm text-slate-900 mt-0.5">Pasar datos por cercanía física</h4>
          </div>
        </div>

        <p className="text-xs text-slate-600">
          Ideal si los teléfonos no tienen WiFi o están fuera de casa. Enrique o Fernando tocan <strong>"Compartir Datos"</strong> y su móvil Samsung abre <strong>Quick Share</strong> para enviárselo al móvil de Papá. Luego Papá toca <strong>"Importar"</strong> y la app une las materias y horas automáticamente.
        </p>

        <div className="grid grid-cols-2 gap-2 pt-1">
          <button
            onClick={handleNativeShare}
            className="py-3 px-3 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-900 border border-indigo-200 font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition"
          >
            <Share2 className="w-4 h-4 text-indigo-600" />

          <button
            onClick={() => fileInputRef.current && fileInputRef.current.click()}

          <input
            ref={fileInputRef}
            type="file"
            accept=".json"
            onChange={handleFileImport}
            className="hidden"
          />
        </div>
      </div>
    </div>
  );
}


// ============================================================================
// MODAL RECAP DIARIO Y DE DÍAS PASADOS (VINCULADO AL CALENDARIO Y EDITABLE)
// ============================================================================
function DailyRecapWizardModal({
  appData,
  studentId,
  initialDate,
  initialPeriodIdx = 0,
  initialSubjectId = null,
  onClose,
  upsertTopicAndSubtopic,
  recordClassSessionOnly,
}) {
  const student = appData.students.find((s) => s.id === studentId) || appData.students[0];
  const todayStr = toDateStr();
  const yesterdayStr = addDaysStr(todayStr, -1);

  // Fecha de la que se está haciendo o editando el Recap
  const [recapDate, setRecapDate] = useState(initialDate || todayStr);
  // Día de la semana (1=Lunes..5=Viernes) calculado automáticamente a partir de recapDate
  const [weekday, setWeekday] = useState(() => getWeekdayFromDateStr(initialDate || todayStr));

  // Cuando cambia recapDate, actualizar automáticamente el día de la semana del horario
  const handleDateChange = (newDateStr) => {
    if (!newDateStr) return;
    setRecapDate(newDateStr);
    setWeekday(getWeekdayFromDateStr(newDateStr));
    setQueueIdx(0);
  };

  const scheduledSubjectIds =
    (appData.schedules[student.id] && appData.schedules[student.id][weekday]) || [];
  const studentSubjects = appData.subjects.filter((s) => s.student_id === student.id);

  // Cola de asignaturas del día según su horario escolar
  const dayQueue = useMemo(() => {
    if (scheduledSubjectIds.length > 0) {
      return scheduledSubjectIds
        .map((id, idx) => {
          const subj = studentSubjects.find((s) => s.id === id);
          return subj ? { ...subj, period_idx: idx } : null;
        })
        .filter(Boolean);
    }
    return studentSubjects.map((s, idx) => ({ ...s, period_idx: idx }));
  }, [scheduledSubjectIds, studentSubjects]);

  const [queueIdx, setQueueIdx] = useState(() => {
    if (initialPeriodIdx !== undefined && initialPeriodIdx !== null) return initialPeriodIdx;
    return 0;
  });

  // Permitir también cambiar manualmente qué asignatura se registra en esta hora
  const currentSlot = dayQueue[queueIdx] || dayQueue[0];
  const [overrideSubjectId, setOverrideSubjectId] = useState(initialSubjectId || null);
  const activeSubjectId = overrideSubjectId || currentSlot?.id || studentSubjects[0]?.id;
  const activeSubjectObj =
    studentSubjects.find((s) => s.id === activeSubjectId) || currentSlot;

  // Buscar si ya existe un Recap guardado para este alumno + fecha + hora/asignatura
  const existingSession = useMemo(() => {
    const pIdx = currentSlot?.period_idx !== undefined ? currentSlot.period_idx : queueIdx;
    return (
      (appData.class_sessions || []).find(
        (s) =>
          s.student_id === student.id &&
          s.date === recapDate &&
          s.period_idx === pIdx &&
          s.subject_id === activeSubjectId
      ) ||
      (appData.class_sessions || []).find(
        (s) =>
          s.student_id === student.id &&
          s.date === recapDate &&
          s.period_idx === pIdx
      )
    );
  }, [appData.class_sessions, student.id, recapDate, currentSlot, queueIdx, activeSubjectId]);

  const existingTopicsForSubject = appData.topics.filter(
    (t) => t.student_id === student.id && t.subject_id === activeSubjectId
  );

  const [sessionType, setSessionType] = useState('normal');
  const [participation, setParticipation] = useState('2');
  const [selectedTopicId, setSelectedTopicId] = useState(
    existingTopicsForSubject[0]?.id || 'NEW'
  );
  const [newTopicTitle, setNewTopicTitle] = useState('');
  const [selectedSubtopicId, setSelectedSubtopicId] = useState('NEW');
  const [subtopicTitle, setSubtopicTitle] = useState('');
  const [comp, setComp] = useState(3);
  const [mins, setMins] = useState(20);
  const [notes, setNotes] = useState('');

  // Cargar datos si ya existía un Recap en esa fecha y hora, o limpiar al cambiar de hora/fecha
  useEffect(() => {
    const topics = appData.topics.filter(
      (t) => t.student_id === student.id && t.subject_id === activeSubjectId
    );
    if (existingSession) {
      setSessionType(existingSession.status || 'normal');
      setParticipation(String(existingSession.participation || '2'));
      if (existingSession.topic_id && topics.some((t) => t.id === existingSession.topic_id)) {
        setSelectedTopicId(existingSession.topic_id);
        const topObj = topics.find((t) => t.id === existingSession.topic_id);
        const subObj = topObj?.subtopics.find((st) => st.id === existingSession.subtopic_id);
        if (subObj) {
          setSelectedSubtopicId(subObj.id);
          setSubtopicTitle(subObj.title);
          setComp(subObj.comprehension || 3);
          setNotes(existingSession.note || subObj.notes || '');
        } else {
          setSelectedSubtopicId('NEW');
          setSubtopicTitle(existingSession.subtopic_title || '');
          setNotes(existingSession.note || '');
        }
      } else {
        setSelectedTopicId(topics[0]?.id || 'NEW');
        setNewTopicTitle(existingSession.topic_title || '');
        setSelectedSubtopicId('NEW');
        setSubtopicTitle(existingSession.subtopic_title || '');
        setNotes(existingSession.note || '');
      }
      setMins(existingSession.minutes !== undefined ? existingSession.minutes : 20);
    } else {
      setSessionType('normal');
      setParticipation('2');
      setSelectedTopicId(topics[0]?.id || 'NEW');
      setNewTopicTitle('');
      setSelectedSubtopicId('NEW');
      setSubtopicTitle('');
      setComp(3);
      setMins(20);
      setNotes('');
    }
  }, [queueIdx, weekday, recapDate, activeSubjectId, existingSession?.id]);

  // Subtemas disponibles dentro del Tema Principal seleccionado
  const currentTopicObj = existingTopicsForSubject.find((t) => t.id === selectedTopicId);
  const subtopicsOfSelectedTopic = currentTopicObj?.subtopics || [];

  const handleSelectSubtopicOption = (subId) => {
    setSelectedSubtopicId(subId);
    if (subId === 'NEW') {
      setSubtopicTitle('');
      setNotes('');
    } else {
      const found = subtopicsOfSelectedTopic.find((s) => s.id === subId);
      if (found) {
        setSubtopicTitle(found.title);
        setComp(found.comprehension || 3);
        setNotes(found.notes || '');
      }
    }
  };

  const advanceOrClose = () => {
    setOverrideSubjectId(null);
    if (queueIdx < dayQueue.length - 1) {
      setQueueIdx(queueIdx + 1);
    } else {
      onClose();
    }
  };

  const handleQuickVertretungOrEntfall = (statusType) => {
    if (!activeSubjectObj) return;
    if (recordClassSessionOnly) {
      recordClassSessionOnly({
        student_id: student.id,
        subject_id: activeSubjectObj.id,
        date: recapDate,
        period_idx: currentSlot?.period_idx !== undefined ? currentSlot.period_idx : queueIdx,
        status: statusType,
        participation: statusType === 'entfall' ? 'na' : participation === '2' ? 'na' : participation,
        note: notes.trim(),
      });
    }
    advanceOrClose();
  };

  const handleSaveNormal = () => {
    if (!activeSubjectObj) return;
    if (sessionType === 'vertretung' || sessionType === 'entfall') {
      handleQuickVertretungOrEntfall(sessionType);
      return;
    }
    if (selectedTopicId === 'NEW' && !newTopicTitle.trim()) {
      alert('Escribe el nombre del Tema Principal nuevo (o marca arriba Vertretung si no dieron materia).');
      return;
    }
    if (!subtopicTitle.trim()) {
      alert('Escribe o selecciona qué Subtema habéis visto en esta clase.');
      return;
    }

    upsertTopicAndSubtopic({
      student_id: student.id,
      subject_id: activeSubjectObj.id,
      topicIdOrNew: selectedTopicId,
      newTopicTitle: newTopicTitle.trim() || 'Tema General',
      subtopicIdOrNew: selectedSubtopicId,
      subtopicTitle,
      comprehension: comp,
      participation,
      period_idx: currentSlot?.period_idx !== undefined ? currentSlot.period_idx : queueIdx,
      minutes: mins,
      notes,
      date: recapDate,
      session_id: existingSession?.id || null,
    });
    advanceOrClose();
  };

  return (
    <div className="bg-white w-full rounded-2xl shadow-md border border-slate-200 overflow-hidden">
      {/* CABECERA CON DÍA Y FECHA BIEN VISIBLES Y BOTÓN VOLVER */}
      <div className="p-4 bg-slate-900 text-white space-y-2">
        <div className="flex items-center justify-between gap-2">
          <div>
            <span className="text-[10px] font-bold uppercase tracking-wider text-amber-400 block">
              📅 Haciendo Recap del: {getFullDayNameEs(recapDate)} ({formatHumanDate(recapDate)})
            </span>
            <h3 className="font-extrabold text-base mt-0.5">
              {student.avatar} {student.name} •{' '}
              {activeSubjectObj
                ? `${queueIdx + 1}ª Hora: ${activeSubjectObj.icon} ${activeSubjectObj.name}`
                : 'Recap'}
            </h3>
          </div>
          <button
            onClick={() => {
              onClose();
              window.scrollTo(0, 0);
            }}
            className="px-3.5 py-2 rounded-xl bg-amber-500 text-slate-950 text-xs font-black shadow shrink-0"
          >
            ← Volver
          </button>
        </div>

          {/* SELECTOR DE FECHA (HOY / AYER / CUALQUIER DÍA PASADO) */}
          <div className="flex flex-wrap items-center justify-between gap-1.5 pt-2 border-t border-slate-800">
            <div className="flex items-center gap-1">
              <button
                type="button"
                onClick={() => handleDateChange(todayStr)}
                className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                  recapDate === todayStr
                    ? 'bg-indigo-600 text-white shadow'
                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`}
              >
                📅 Hoy
              </button>
              <button
                type="button"
                onClick={() => handleDateChange(yesterdayStr)}
                className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                  recapDate === yesterdayStr
                    ? 'bg-indigo-600 text-white shadow'
                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`}
              >
                ⏪ Ayer
              </button>
            </div>

            <div className="flex items-center gap-1.5">
              <span className="text-[11px] text-slate-400">Otro día pasado:</span>
              <input
                type="date"
                value={recapDate}
                onChange={(e) => handleDateChange(e.target.value)}
                className="rounded-lg bg-slate-800 border border-slate-700 text-white px-2 py-1 text-xs font-bold"
              />
            </div>
          </div>
        </div>

        <div className="p-4 space-y-4">
          {/* Aviso si estamos editando una clase que ya fue registrada */}
          {existingSession && (
            <div className="p-2.5 rounded-xl bg-indigo-50 border border-indigo-300 text-indigo-950 text-xs font-bold flex items-center justify-between">
              <span>✏️ Editando clase ya registrada el {formatHumanDate(recapDate)}</span>
              <span className="text-[10px] px-2 py-0.5 rounded bg-indigo-200 text-indigo-900">
                Modo Edición
              </span>
            </div>
          )}

          {/* Barra de horas del horario de ese día + opción de cambiar asignatura */}
          <div className="space-y-2">
            <div className="flex items-center justify-between text-xs text-slate-500">
              <span>
                Horario del <strong>{WEEKDAYS.find((w) => w.key === weekday)?.name}</strong>:
              </span>
              <select
                value={activeSubjectId}
                onChange={(e) => setOverrideSubjectId(e.target.value)}
                className="bg-slate-100 border border-slate-300 rounded-lg px-2 py-0.5 text-xs font-bold text-slate-800"
                title="Cambiar asignatura de esta hora"
              >
                {studentSubjects.map((s) => (
                  <option key={s.id} value={s.id}>
                    Asignatura: {s.icon} {s.name}
                  </option>
                ))}
              </select>
            </div>

            <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
              {dayQueue.map((slot, idx) => {
                const slotDone = (appData.class_sessions || []).some(
                  (s) =>
                    s.student_id === student.id &&
                    s.date === recapDate &&
                    s.period_idx === idx
                );
                return (
                  <button
                    key={`${slot.id}_${idx}`}
                    type="button"
                    onClick={() => {
                      setOverrideSubjectId(null);
                      setQueueIdx(idx);
                    }}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 flex items-center gap-1 border transition ${
                      idx === queueIdx
                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                        : slotDone
                        ? 'bg-emerald-50 text-emerald-800 border-emerald-300'
                        : 'bg-slate-100 text-slate-600 border-slate-200'
                    }`}
                  >
                    <span>
                      {slotDone ? '✓ ' : `${idx + 1}. `}
                      {slot.icon}
                    </span>
                    <span>{slot.name}</span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* 1. TIPO DE CLASE: NORMAL VS VERTRETUNG VS ENTFALL */}
          <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2">
            <div className="text-[11px] font-extrabold uppercase text-slate-600">
              1. ¿Hubo clase normal el {formatHumanDate(recapDate)} o fue Vertretung / Cancelada?
            </div>
            <div className="grid grid-cols-3 gap-1.5">
              <button
                type="button"
                onClick={() => setSessionType('normal')}
                className={`py-2 px-2 rounded-xl text-xs font-bold border transition ${
                  sessionType === 'normal'
                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                    : 'bg-white text-slate-700 border-slate-200'
                }`}
              >
                📖 Clase Normal
              </button>
              <button
                type="button"
                onClick={() => setSessionType('vertretung')}
                className={`py-2 px-2 rounded-xl text-xs font-bold border transition ${
                  sessionType === 'vertretung'
                    ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-sm'
                    : 'bg-white text-amber-900 border-amber-300 hover:bg-amber-50'
                }`}
              >
                🔄 Vertretung
              </button>
              <button
                type="button"
                onClick={() => setSessionType('entfall')}
                className={`py-2 px-2 rounded-xl text-xs font-bold border transition ${
                  sessionType === 'entfall'
                    ? 'bg-slate-800 text-white border-slate-900 shadow-sm'
                    : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                }`}
              >
                🚫 Entfall
              </button>
            </div>

            {(sessionType === 'vertretung' || sessionType === 'entfall') && (
              <div className="p-3 rounded-xl bg-amber-50 border border-amber-300 space-y-2.5 mt-2">
                <div className="text-xs font-bold text-amber-950">
                  {sessionType === 'vertretung'
                    ? '🔄 Sustitución (Vertretung): Quedará tachada en esta fecha sin tener que poner temas ni subtemas.'
                    : '🚫 Clase cancelada (Entfall): Quedará tachada como hora libre y contará en las estadísticas.'}
                </div>
                <input
                  type="text"
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  placeholder="Nota opcional (ej. Hicimos deberes con el profe de guardia)..."
                  className="w-full rounded-xl border border-amber-300 bg-white px-3 py-1.5 text-xs"
                />
                <button
                  type="button"
                  onClick={() => handleQuickVertretungOrEntfall(sessionType)}
                  className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shadow"
                >
                  {sessionType === 'vertretung'
                    ? '✓ Guardar Vertretung y Pasar a Siguiente'
                    : '✓ Guardar Entfall y Pasar a Siguiente'}
                </button>
              </div>
            )}
          </div>

          {sessionType === 'normal' && (
            <>
              {/* 2. PARTICIPACIÓN EN CLASE (1 A 5 + NO APLICA) */}
              <div className="bg-emerald-50/50 border border-emerald-200 rounded-2xl p-3.5 space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-extrabold uppercase text-emerald-950">
                    2. 🙋‍♂️ Participación en clase (Mündliche Mitarbeit):
                  </span>
                  <button
                    type="button"
                    onClick={() => setParticipation('na')}
                    className={`text-[10px] px-2 py-0.5 rounded-md border font-semibold transition ${
                      participation === 'na'
                        ? 'bg-slate-700 text-white border-slate-700'
                        : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-100'
                    }`}
                  >
                    ⚪ No aplica
                  </button>
                </div>

                <div className="grid grid-cols-4 gap-1.5">
                  {PARTICIPATION_LEVELS.filter((p) => p.id !== 'na').map((p) => {
                    const active = participation === p.id;
                    return (
                      <button
                        key={p.id}
                        type="button"
                        onClick={() => setParticipation(p.id)}
                        className={`p-2 rounded-xl border text-center transition active:scale-95 ${
                          active
                            ? p.activeClass
                            : 'bg-white border-slate-200 text-slate-800 hover:bg-slate-50'
                        }`}
                      >
                        <div className="text-lg leading-none">{p.emoji}</div>
                        <div className="font-extrabold text-xs mt-1">{p.label}</div>
                        <div className={`text-[10px] ${active ? 'opacity-90' : 'text-slate-500'}`}>
                          Nota {p.id} ({p.pct}%)
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* 3. ÁRBOL TEMA PRINCIPAL -> SUBTEMA -> DESCRIPCIÓN */}
              <div className="bg-indigo-50/60 border border-indigo-200 rounded-2xl p-3.5 space-y-2.5">
                <div className="text-xs font-extrabold uppercase text-indigo-900">
                  3. 📚 Tema ➔ Subtema ➔ Descripción vistos en clase:
                </div>

                {/* Nivel 1: Tema Principal */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    📂 Tema Principal (Nivel 1):
                  </label>
                  <select
                    value={selectedTopicId}
                    onChange={(e) => {
                      setSelectedTopicId(e.target.value);
                      setSelectedSubtopicId('NEW');
                      setSubtopicTitle('');
                    }}
                    className="w-full rounded-xl border border-slate-300 bg-white p-2 text-xs font-bold"
                  >
                    {existingTopicsForSubject.map((t) => (
                      <option key={t.id} value={t.id}>
                        📂 {t.title} ({t.subtopics.length} subtemas)
                      </option>
                    ))}
                    <option value="NEW">➕ Crear un Tema Principal nuevo...</option>
                  </select>
                </div>

                {selectedTopicId === 'NEW' && (
                  <div>
                    <label className="block text-xs font-bold text-indigo-800 mb-1">
                      Título del nuevo Tema Principal:
                    </label>
                    <input
                      type="text"
                      value={newTopicTitle}
                      onChange={(e) => setNewTopicTitle(e.target.value)}
                      placeholder="Ej. Fracciones (Bruchrechnung) o Fotosíntesis"
                      className="w-full rounded-xl border border-indigo-300 bg-white p-2 text-xs font-bold"
                    />
                  </div>
                )}

                {/* Nivel 2: Subtema (elegir existente o crear nuevo) */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    📄 Subtema (Nivel 2):
                  </label>
                  {selectedTopicId !== 'NEW' && subtopicsOfSelectedTopic.length > 0 && (
                    <select
                      value={selectedSubtopicId}
                      onChange={(e) => handleSelectSubtopicOption(e.target.value)}
                      className="w-full rounded-xl border border-slate-300 bg-white p-2 text-xs font-semibold mb-1.5"
                    >
                      <option value="NEW">➕ Añadir un Subtema nuevo a este tema...</option>
                      {subtopicsOfSelectedTopic.map((st) => (
                        <option key={st.id} value={st.id}>
                          ✏️ Existente: {st.title}
                        </option>
                      ))}
                    </select>
                  )}
                  <input
                    type="text"
                    value={subtopicTitle}
                    onChange={(e) => setSubtopicTitle(e.target.value)}
                    placeholder="Nombre del subtema visto (ej. División por el Kehrwert)"
                    className="w-full rounded-xl border border-slate-300 bg-white p-2 text-xs font-bold"
                  />
                </div>

                {/* Nivel 3: Descripción / Explicación / Apuntes */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    📝 Descripción / Explicación / Fórmulas (Nivel 3):
                  </label>
                  <textarea
                    value={notes}
                    onChange={(e) => setNotes(e.target.value)}
                    rows={2}
                    placeholder="Explicación de clase, fórmulas, ejemplos o pistas para el examen..."
                    className="w-full rounded-xl border border-slate-300 bg-white p-2 text-xs"
                  />
                </div>
              </div>

              {/* 4. COMPRENSIÓN Y TIEMPO */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-extrabold uppercase text-slate-700 mb-1.5">
                    4. 🧠 Nivel de comprensión:
                  </label>
                  <div className="grid grid-cols-2 gap-1.5">
                    {COMPREHENSION_LEVELS.map((lvl) => (
                      <button
                        key={lvl.id}
                        type="button"
                        onClick={() => setComp(lvl.id)}
                        className={`p-2 rounded-xl border text-xs font-bold text-left flex items-center justify-between ${
                          comp === lvl.id
                            ? 'ring-2 ring-indigo-600 bg-indigo-50 border-indigo-500'
                            : 'bg-slate-50 border-slate-200'
                        }`}
                      >
                        <span>
                          {lvl.emoji} {lvl.short}
                        </span>
                        <span className="text-[10px] text-slate-400">{lvl.days}d</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-extrabold uppercase text-slate-700 mb-1.5">
                    ⏱️ Tiempo de estudio ese día:
                  </label>
                  <div className="grid grid-cols-4 gap-1">
                    {[0, 15, 30, 45].map((m) => (
                      <button
                        key={m}
                        type="button"
                        onClick={() => setMins(m)}
                        className={`py-2 rounded-xl text-xs font-bold border ${
                          mins === m
                            ? 'bg-slate-900 text-white border-slate-900'
                            : 'bg-slate-100 text-slate-700 border-slate-200'
                        }`}
                      >
                        {m === 0 ? '0m' : `+${m}m`}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </>
          )}
        </div>

        {/* Botonera inferior */}
        <div className="p-4 border-t border-slate-200 bg-slate-50 flex items-center justify-between gap-2">
          {queueIdx < dayQueue.length - 1 ? (
            <button
              type="button"
              onClick={() => {
                setOverrideSubjectId(null);
                setQueueIdx(queueIdx + 1);
              }}
              className="px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-600 text-xs font-bold"
            >
              Saltar hora →
            </button>
          ) : (
            <button
              type="button"
              onClick={onClose}
              className="px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-600 text-xs font-bold"
            >
              Cerrar
            </button>
          )}

          <button
            type="button"
            onClick={handleSaveNormal}
            className="flex-1 py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow"
          >
            {sessionType === 'normal'
              ? queueIdx < dayQueue.length - 1
                ? `Guardar (${formatHumanDate(recapDate)}) y Siguiente Hora →`
                : `Guardar Recap (${formatHumanDate(recapDate)})`
              : '✓ Confirmar Tachado'}
          </button>
        </div>
    </div>
  );
}

// ============================================================================
// MODAL +TIEMPO (CON SELECTOR DE FECHA PARA HOY, AYER O DÍAS PASADOS)
// ============================================================================
function QuickAddTimeModal({ target, onClose, onSave }) {
  const today = toDateStr();
  const yesterday = addDaysStr(today, -1);
  const [mins, setMins] = useState(30);
  const [dateStr, setDateStr] = useState(today);
  const [note, setNote] = useState('');

  return (
    <div className="bg-white w-full max-w-lg mx-auto rounded-2xl p-5 shadow-md border border-slate-200 space-y-4">
      <div className="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 className="font-extrabold text-base truncate pr-2">⏱️ +Tiempo en {target.title}</h3>
        <button onClick={onClose} className="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold">
          ← Volver
        </button>
      </div>

        <div>
          <label className="block text-xs font-bold text-slate-700 mb-1">Fecha del estudio:</label>
          <div className="flex items-center gap-1.5 mb-1.5">
            <button
              type="button"
              onClick={() => setDateStr(today)}
              className={`px-2.5 py-1 rounded-lg text-xs font-bold border ${
                dateStr === today ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-100'
              }`}
            >
              Hoy
            </button>
            <button
              type="button"
              onClick={() => setDateStr(yesterday)}
              className={`px-2.5 py-1 rounded-lg text-xs font-bold border ${
                dateStr === yesterday ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-100'
              }`}
            >
              Ayer
            </button>
            <input
              type="date"
              value={dateStr}
              onChange={(e) => setDateStr(e.target.value)}
              className="flex-1 rounded-lg border border-slate-300 px-2 py-1 text-xs font-bold"
            />
          </div>
        </div>

        <div className="grid grid-cols-4 gap-1.5">
          {[15, 30, 45, 60].map((m) => (
            <button
              key={m}
              type="button"
              onClick={() => setMins(m)}
              className={`py-2 rounded-xl text-xs font-bold border ${
                mins === m ? 'bg-slate-900 text-white' : 'bg-slate-100'
              }`}
            >
              +{m}m
            </button>
          ))}
        </div>

        <input
          type="text"
          value={note}
          onChange={(e) => setNote(e.target.value)}
          placeholder="Nota opcional (ej. Repaso de ejercicios)..."
          className="w-full rounded-xl border border-slate-300 p-2 text-xs"
        />

        <button
          type="button"
          onClick={() =>
            onSave({
              student_id: target.student_id,
              subject_id: target.subject_id,
              topic_id: target.topic_id,
              subtopic_id: target.subtopic_id || null,
              date: dateStr,
              minutes: mins,
              note,
            })
          }
          className="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow"
        >
          Guardar +{mins}m ({formatHumanDate(dateStr)})
        </button>
    </div>
  );
}

// Montar aplicación en DOM
const rootEl = document.getElementById("root");
if (rootEl) {
  const root = ReactDOM.createRoot(rootEl);
  root.render(React.createElement(App));
}
  </script>
</body>
