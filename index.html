      e.preventDefault();
      deferredPrompt = e;
      if (banner) banner.style.display = "flex";
    });

    if (installBtn) {
      installBtn.addEventListener("click", async function() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (banner) banner.style.display = "none";
      });
    }

        if (banner) banner.style.display = "none";

// Helper para calcular estadísticas de participación y Vertretung
const computeParticipationStats = (sessions = [], studentId, subjectId = null) => {
  const filtered = (sessions || []).filter(
    (s) => s.student_id === studentId && (subjectId ? s.subject_id === subjectId : true)
  );
  const normalCount = filtered.filter((s) => s.status === 'normal').length;
  const vertretungCount = filtered.filter((s) => s.status === 'vertretung').length;
  const entfallCount = filtered.filter((s) => s.status === 'entfall').length;

  const graded = filtered
    .map((s) => PARTICIPATION_LEVELS.find((p) => p.id === String(s.participation)))
    .filter((p) => p && p.grade !== null);

  let avgGrade = null;
  let avgPct = null;
  let avgLabel = 'Sin datos';
  let avgEmoji = '⚪';

  if (graded.length > 0) {
    const sumGrade = graded.reduce((a, b) => a + b.grade, 0);
    const sumPct = graded.reduce((a, b) => a + b.pct, 0);
    avgGrade = sumGrade / graded.length;
    avgPct = Math.round(sumPct / graded.length);
    if (avgGrade <= 1.5) { avgLabel = 'Muy alta'; avgEmoji = '🌟'; }
    else if (avgGrade <= 2.5) { avgLabel = 'Alta'; avgEmoji = '🙋‍♂️'; }
    else if (avgGrade <= 3.6) { avgLabel = 'Normal'; avgEmoji = '🙂'; }
    else { avgLabel = 'Baja'; avgEmoji = '😶'; }
  }

  // Calcular racha de clases con participación Alta o Muy alta (1 o 2)
  const sortedByDate = [...filtered]
    .filter((s) => s.participation && s.participation !== 'na')
    .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.updated_at || 0) - (a.updated_at || 0));
  let highStreak = 0;
  for (const s of sortedByDate) {
    if (s.participation === '1' || s.participation === '2') highStreak++;
    else break;
  }

  return {
    totalSessions: filtered.length,
    normalCount,
    vertretungCount,
    entfallCount,
    gradedCount: graded.length,
    avgGrade,
    avgGradeStr: avgGrade !== null ? avgGrade.toFixed(1).replace('.', ',') : '—',
    avgPct,
    avgLabel,
    avgEmoji,
    highStreak,
  };
};

const toDateStr = (dateObj = new Date()) => {
  const year = dateObj.getFullYear();
  const month = String(dateObj.getMonth() + 1).padStart(2, '0');
  const day = String(dateObj.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
};

const addDaysStr = (baseDateStr, days) => {
  const [y, m, d] = baseDateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  return toDateStr(dt);
};

const diffDaysFromToday = (targetDateStr) => {
  const todayStr = toDateStr(new Date());
  const [ty, tm, td] = todayStr.split('-').map(Number);
  const [ey, em, ed] = targetDateStr.split('-').map(Number);
  const tDate = new Date(ty, tm - 1, td);
  const eDate = new Date(ey, em - 1, ed);
  return Math.round((eDate - tDate) / (1000 * 60 * 60 * 24));
};

const formatHumanDate = (dateStr) => {
  if (!dateStr) return '';
  const diff = diffDaysFromToday(dateStr);
  if (diff === 0) return 'Hoy';
  if (diff === -1) return 'Ayer';
  if (diff === 1) return 'Mañana';
  const [y, m, d] = dateStr.split('-');
  return `${d}.${m}.${y}`;
};

const formatMinutes = (mins = 0) => {
  if (!mins || mins <= 0) return '0m';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h > 0 && m > 0) return `${h}h ${m}m`;
  if (h > 0) return `${h}h`;
  return `${m}m`;
};

        post_exam_feeling: null,
        post_exam_comment: '',
        grade_label: null,
        grade_value: null,
        updated_at: Date.now() - 40000000,
      },
    ],
  };
};

const mergeArraysById = (localArr = [], remoteArr = []) => {
  const map = new Map();
  localArr.forEach((item) => map.set(item.id, item));
  remoteArr.forEach((rem) => {
    const existing = map.get(rem.id);
    if (!existing || (rem.updated_at || 0) >= (existing.updated_at || 0)) {
      map.set(rem.id, rem);
    }
  });
  return Array.from(map.values());
};

const smartMergeTopics = (localTopics = [], remoteTopics = []) => {
  const map = new Map();
  localTopics.forEach((t) => map.set(t.id, { ...t, subtopics: [...(t.subtopics || [])] }));
  remoteTopics.forEach((remT) => {
    const existing = map.get(remT.id);
    if (!existing) {
      map.set(remT.id, remT);
    } else {
      const mergedSubtopics = mergeArraysById(existing.subtopics || [], remT.subtopics || []);
      const newerTopic = (remT.updated_at || 0) >= (existing.updated_at || 0) ? remT : existing;
      map.set(remT.id, {
        ...newerTopic,
        subtopics: mergedSubtopics,
        updated_at: Math.max(existing.updated_at || 0, remT.updated_at || 0),
      });
    }
  });
  return Array.from(map.values());
};

const smartMergeState = (localState, remoteState) => {
  if (!remoteState || !remoteState.students) return localState;
  return {
    lastUpdated: Date.now(),
    students: mergeArraysById(localState.students, remoteState.students),
    subjects: mergeArraysById(localState.subjects, remoteState.subjects),
    schedules: {
      ...localState.schedules,
      ...(remoteState.schedules || {}),
    },
    topics: smartMergeTopics(localState.topics, remoteState.topics),
    work_logs: mergeArraysById(localState.work_logs, remoteState.work_logs),
    class_sessions: mergeArraysById(localState.class_sessions || [], remoteState.class_sessions || []),
    tasks: mergeArraysById(localState.tasks, remoteState.tasks),
    exams: mergeArraysById(localState.exams, remoteState.exams),
  };
};

function App() {

        const parsed = JSON.parse(saved);
        const init = createInitialData();
        return {
          ...init,
          ...parsed,
          class_sessions: parsed.class_sessions || init.class_sessions || [],
        };
      }
    } catch (e) {
      console.error(e);
    }
    return createInitialData();
  });

  useEffect(() => {

    } catch (e) {
      console.error(e);
    }

  );

  const [recapStudentId, setRecapStudentId] = useState('stu_1');
  const [scheduleModalOpen, setScheduleModalOpen] = useState(false);
  const [quickTimeModal, setQuickTimeModal] = useState(null);
  const [editProfileModal, setEditProfileModal] = useState(false);
  const [toastMessage, setToastMessage] = useState(null);

  const showToast = (msg) => {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 3200);
  };

  const openRecapForStudent = (stuId) => {
    setRecapStudentId(stuId);
    setRecapWizardOpen(true);
  };

  const addWorkLog = ({ student_id, subject_id, topic_id, subtopic_id = null, date, minutes, note }) => {
    const newLog = {
      id: uid('log'),
      student_id,
      subject_id,
      topic_id,
      subtopic_id,
      date: date || toDateStr(),
      minutes: Number(minutes) || 15,
      note: note || '',
      updated_at: Date.now(),
    };
    setAppData((prev) => ({
      ...prev,
      lastUpdated: Date.now(),
      work_logs: [newLog, ...prev.work_logs],
    }));
    showToast(`⏱️ +${minutes}m registrados (${formatHumanDate(date || toDateStr())})`);
  };

  const recordClassSessionOnly = ({
    student_id,
    subject_id,
    date,
    period_idx = 0,
    status = 'vertretung',
    participation = 'na',
    note = '',
  }) => {
    const now = Date.now();
    const sessDate = date || toDateStr();
    const newSess = {
      id: `sess_${student_id}_${subject_id}_${sessDate}_${period_idx}`,
      student_id,
      subject_id,
      date: sessDate,
      period_idx,
      status,
      participation,
      topic_title: '',
      subtopic_title: '',
      note: note || (status === 'vertretung' ? 'Vertretung (Sustitución sin temario)' : 'Entfall (Clase cancelada)'),
      updated_at: now,
    };
    setAppData((prev) => ({
      ...prev,
      lastUpdated: now,
      class_sessions: [
        newSess,
        ...(prev.class_sessions || []).filter((s) => s.id !== newSess.id),
      ],
    }));
    showToast(status === 'vertretung' ? '🔄 Hora marcada como Vertretung (tachada)' : '🚫 Hora marcada como Entfall (cancelada)');

  const upsertTopicAndSubtopic = ({
    student_id,
    subject_id,
    topicIdOrNew,
    newTopicTitle,
    subtopicTitle,
    comprehension,
    participation = '2',
    period_idx = 0,
    minutes,
    notes,
    date,
  }) => {

    const now = Date.now();
    let targetTopicId = topicIdOrNew;

      id: newSubId,
      title: subtopicTitle.trim(),

      next_recall_date: nextRecallDate,
      interval_days: compObj.days,
      notes: notes || '',

      review_count: 0,
      updated_at: now,
    };

      let updatedTopics = [...prev.topics];

          student_id,
          subject_id,
          title: newTopicTitle.trim(),
          updated_at: now,
          subtopics: [newSubtopic],
        });

        updatedTopics = updatedTopics.map((t) => {
          if (t.id !== topicIdOrNew) return t;
          return {
            ...t,
            updated_at: now,
            subtopics: [...t.subtopics, newSubtopic],
          };
        });
      }

      const updatedLogs = [...prev.work_logs];
      if (Number(minutes) > 0) {
        updatedLogs.unshift({
          id: uid('log'),
          student_id,
          subject_id,
          topic_id: targetTopicId,
          subtopic_id: newSubId,
          date: date || toDateStr(),
          minutes: Number(minutes),
          note: notes ? `Recap: ${subtopicTitle}` : 'Estudio / Recap diario',
          updated_at: now,
        });

        subject_id,

        period_idx,

        participation: participation || '2',

        topic_title: resolvedTopicObj ? resolvedTopicObj.title : (newTopicTitle || ''),
        subtopic_title: subtopicTitle.trim(),
        note: notes || '',
        updated_at: now,

        ...prev,
        lastUpdated: now,
        topics: updatedTopics,
        work_logs: updatedLogs,

          ...(prev.class_sessions || []).filter((s) => s.id !== newSess.id),

    const today = toDateStr();
    const now = Date.now();

    setAppData((prev) => {
      let subjectIdForLog = null;

          updated_at: now,
          subtopics: t.subtopics.map((st) => {

            if (rating === 1) nextDays = 1;
            if (rating === 2) nextDays = Math.max(2, Math.round(prevInterval * 1.2));
            if (rating === 3) nextDays = Math.max(4, Math.round(prevInterval * 1.8));
            if (rating === 4) nextDays = Math.max(7, Math.round(prevInterval * 2.5));

            return {

              comprehension: rating,
              interval_days: nextDays,
              next_recall_date: addDaysStr(today, nextDays),

              updated_at: now,

          student_id,
          subject_id: subjectIdForLog,
          topic_id,
          subtopic_id,
          date: today,
          minutes: Number(minutesSpent),
          note: 'Sesión de Active Recall con Papá',
          updated_at: now,

      return {
        ...prev,
        lastUpdated: now,
        topics: updatedTopics,

        <div className="p-4 border-t border-slate-200 bg-slate-50 flex justify-between items-center">

  );
}

// MODAL: AJUSTES DE PERFILES, CURSOS Y ASIGNATURAS (PARA FUTUROS CURSOS)
// ============================================================================
function EditProfilesAndSubjectsModal({ appData, setAppData, onClose, showToast }) {
  const [stu1Name, setStu1Name] = useState(appData.students[0]?.name || 'Enrique');
  const [stu1Grade, setStu1Grade] = useState(appData.students[0]?.gradeLevel || '7. Klasse (Gymnasium)');
  const [stu2Name, setStu2Name] = useState(appData.students[1]?.name || 'Fernando');
  const [stu2Grade, setStu2Grade] = useState(appData.students[1]?.gradeLevel || '5. Klasse (Realschule)');

  const [newSubjStudent, setNewSubjStudent] = useState('stu_1');
  const [newSubjName, setNewSubjName] = useState('');
  const [newSubjIcon, setNewSubjIcon] = useState('📘');

  const saveProfiles = () => {
    setAppData((prev) => ({
      ...prev,
      lastUpdated: Date.now(),
      students: prev.students.map((s, idx) =>
        idx === 0
          ? { ...s, name: stu1Name.trim() || 'Enrique', gradeLevel: stu1Grade, updated_at: Date.now() }
          : { ...s, name: stu2Name.trim() || 'Fernando', gradeLevel: stu2Grade, updated_at: Date.now() }
      ),
    }));
    showToast('👥 Perfiles y cursos actualizados');
    onClose();
  };

  const handleAddSubject = () => {
    if (!newSubjName.trim()) return;
    const newSub = {
      id: uid('sub'),
      student_id: newSubjStudent,
      name: newSubjName.trim(),
      icon: newSubjIcon || '📘',
      color: 'bg-indigo-600',
      updated_at: Date.now(),
    };
    setAppData((prev) => ({
      ...prev,
      lastUpdated: Date.now(),
      subjects: [...prev.subjects, newSub],
    }));
    setNewSubjName('');
    showToast(`📚 Asignatura ${newSub.name} creada`);
  };

  const handleDeleteSubject = (subjId) => {
    setAppData((prev) => ({
      ...prev,
      lastUpdated: Date.now(),
      subjects: prev.subjects.filter((s) => s.id !== subjId),
    }));
    showToast('Asignatura eliminada');
  };

  return (
    <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-3">
      <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden max-h-[92vh] flex flex-col">
        <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
          <div>
            <span className="text-[10px] uppercase font-bold text-amber-400">⚙️ Cursos &amp; Asignaturas</span>
            <h3 className="font-bold text-base">Adaptar para Nuevos Cursos</h3>
          </div>
          <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-800 text-slate-300">
            <X className="w-5 h-5" />
          </button>
        </div>

        <div className="p-4 space-y-4 overflow-y-auto">
          {/* HIJO 1: ENRIQUE */}
          <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
            <div className="text-xs font-bold text-indigo-700 flex items-center gap-1">
              👦🏻 Alumno 1 (Nombre y Curso):
            </div>
            <div className="grid grid-cols-2 gap-2">
              <input
                type="text"
                value={stu1Name}
                onChange={(e) => setStu1Name(e.target.value)}
                placeholder="Nombre"
                className="rounded-xl border border-slate-300 px-3 py-1.5 text-xs font-bold"
              />
              <input
                type="text"
                value={stu1Grade}
                onChange={(e) => setStu1Grade(e.target.value)}
                placeholder="Ej. 7. Klasse o 8. Klasse"
                className="rounded-xl border border-slate-300 px-3 py-1.5 text-xs font-semibold"
              />
            </div>
          </div>

          {/* HIJO 2: FERNANDO */}
          <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
            <div className="text-xs font-bold text-emerald-700 flex items-center gap-1">
              👦🏼 Alumno 2 (Nombre y Curso):
            </div>
            <div className="grid grid-cols-2 gap-2">
              <input
                type="text"
                value={stu2Name}
                onChange={(e) => setStu2Name(e.target.value)}
                placeholder="Nombre"
                className="rounded-xl border border-slate-300 px-3 py-1.5 text-xs font-bold"
              />
              <input
                type="text"
                value={stu2Grade}
                onChange={(e) => setStu2Grade(e.target.value)}
                placeholder="Ej. 5. Klasse o 6. Klasse"
                className="rounded-xl border border-slate-300 px-3 py-1.5 text-xs font-semibold"
              />
            </div>
          </div>

          {/* AÑADIR NUEVA ASIGNATURA PARA CURSOS SUPERIORES */}
          <div className="p-3 rounded-xl bg-indigo-50/60 border border-indigo-200 space-y-2">
            <div className="text-xs font-bold text-indigo-900">
              ➕ Añadir Nueva Asignatura (ej. Physik, Chemie, Französisch...):
            </div>
            <div className="grid grid-cols-3 gap-1.5">
              <select
                value={newSubjStudent}
                onChange={(e) => setNewSubjStudent(e.target.value)}
                className="rounded-xl border border-indigo-200 px-2 py-1.5 text-xs font-bold bg-white"
              >
                {appData.students.map((s) => (
                  <option key={s.id} value={s.id}>Para {s.name}</option>
                ))}
              </select>
              <input
                type="text"
                value={newSubjIcon}
                onChange={(e) => setNewSubjIcon(e.target.value)}
                placeholder="Emoji ⚗️"
                className="rounded-xl border border-indigo-200 px-2 py-1.5 text-xs text-center bg-white"
              />
              <input
                type="text"
                value={newSubjName}
                onChange={(e) => setNewSubjName(e.target.value)}
                placeholder="Ej. Physik"
                className="rounded-xl border border-indigo-200 px-2 py-1.5 text-xs bg-white font-semibold"
              />
            </div>
            <button
              type="button"
              onClick={handleAddSubject}
              className="w-full py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-sm"
            >
              + Crear Asignatura
            </button>
          </div>

          {/* LISTA ACTUAL DE ASIGNATURAS */}
          <div>
            <div className="text-xs font-bold text-slate-600 mb-2">Asignaturas actuales:</div>
            <div className="space-y-1 max-h-36 overflow-y-auto">
              {appData.subjects.map((subj) => {
                const owner = appData.students.find((s) => s.id === subj.student_id);
                return (
                  <div key={subj.id} className="flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-200 text-xs">
                    <span>{subj.icon} <strong>{subj.name}</strong> <span className="text-slate-400">({owner?.name})</span></span>
                    <button onClick={() => handleDeleteSubject(subj.id)} className="text-red-500 hover:text-red-700 px-2 font-bold">✕</button>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        <div className="p-4 border-t border-slate-200 bg-slate-50 flex items-center justify-between gap-2">
          <button
            type="button"
            onClick={async () => {
              if ("serviceWorker" in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                for (const r of regs) await r.unregister();
              }
              if ("caches" in window) {
                const keys = await caches.keys();
                for (const k of keys) await caches.delete(k);
              }
              window.location.reload(true);
            }}
            className="px-3 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 text-[11px] font-bold"
            title="Descarga los últimos cambios visuales manteniendo todos tus datos guardados"
          >
            🔄 Refrescar App (sin borrar datos)
          </button>
          <div className="flex items-center gap-2">
            <button onClick={onClose} className="px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-bold">Cancelar</button>
            <button onClick={saveProfiles} className="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow">Guardar Cambios</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// VISTA 1: HOY / RECAP DIARIO Y SUPERVISOR PADRE (CON VERTRETUNG Y PARTICIPACIÓN)
// ============================================================================
function TodayAndParentDashboard({
  appData,
  activeProfile,
  currentStudent,
  setParentSelectedStudent,
  openRecapForStudent,
  setScheduleModalOpen,
  setActiveTab,
  setQuickTimeModal,
  getExamUrgencyInfo,
  setAppData,
  showToast,
}) {
  const todayStr = toDateStr();
  const yesterdayStr = addDaysStr(todayStr, -1);
  const jsDay = new Date().getDay();
  const activeWeekday = jsDay >= 1 && jsDay <= 5 ? jsDay : 1;
  const [selectedDayKey, setSelectedDayKey] = useState(activeWeekday);

  const studentScheduleIds = (appData.schedules[currentStudent.id] && appData.schedules[currentStudent.id][selectedDayKey]) || [];
  const todaySubjects = studentScheduleIds.map((id) => appData.subjects.find((s) => s.id === id)).filter(Boolean);

  const upcomingExams = appData.exams
    .filter((ex) => ex.student_id === currentStudent.id && diffDaysFromToday(ex.exam_date) >= 0)
    .sort((a, b) => a.exam_date.localeCompare(b.exam_date));

  const getStudentQuickStats = (stuId) => {
    const todayMins = appData.work_logs.filter((l) => l.student_id === stuId && l.date === todayStr).reduce((a, b) => a + b.minutes, 0);
    const yesterdayMins = appData.work_logs.filter((l) => l.student_id === stuId && l.date === yesterdayStr).reduce((a, b) => a + b.minutes, 0);
    const allSubs = appData.topics.filter((t) => t.student_id === stuId).flatMap((t) => t.subtopics);
    const dueRecall = allSubs.filter((st) => st.next_recall_date <= todayStr).length;
    const weakCount = allSubs.filter((st) => st.comprehension <= 2).length;
    const nextExam = appData.exams.filter((e) => e.student_id === stuId && diffDaysFromToday(e.exam_date) >= 0).sort((a, b) => a.exam_date.localeCompare(b.exam_date))[0];
    const partStats = computeParticipationStats(appData.class_sessions || [], stuId);
    const todaySessions = (appData.class_sessions || []).filter((s) => s.student_id === stuId && s.date === todayStr);
    const todayVertretungen = todaySessions.filter((s) => s.status === 'vertretung' || s.status === 'entfall').length;
    return { todayMins, yesterdayMins, dueRecall, weakCount, nextExam, partStats, todayVertretungen };
  };

  // Sesiones registradas hoy para el alumno actual
  const studentTodaySessions = (appData.class_sessions || []).filter(
    (s) => s.student_id === currentStudent.id && s.date === todayStr
  );

  return (
    <div className="space-y-4">
      {/* MODO PADRE: COMPARATIVA ENRIQUE VS FERNANDO (CON PARTICIPACIÓN ORAL) */}
      {activeProfile === 'parent' && (
        <div className="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 text-white rounded-2xl p-4 shadow-md border border-slate-700">
          <div className="flex items-center justify-between mb-3">
            <div>
              <span className="text-[11px] uppercase tracking-wider font-bold text-amber-400 flex items-center gap-1">
                <Users className="w-3.5 h-3.5" /> Panel Familiar del Padre
              </span>
              <h2 className="text-base sm:text-lg font-bold">
                Seguimiento Hoy ({formatHumanDate(todayStr)})
              </h2>
            </div>
            <button
              onClick={() => setActiveTab('recall')}
              className="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs flex items-center gap-1 shadow"
            >
              <Brain className="w-4 h-4" /> Preguntar
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {appData.students.map((stu) => {
              const st = getStudentQuickStats(stu.id);
              const isFocused = currentStudent.id === stu.id;
              return (
                <div
                  key={stu.id}
                  onClick={() => setParentSelectedStudent(stu.id)}
                  className={`cursor-pointer rounded-xl p-3 transition border ${
                    isFocused ? 'bg-white/15 border-amber-400 ring-1 ring-amber-400/50' : 'bg-white/5 border-white/10 hover:bg-white/10'
                  }`}
                >
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">{stu.avatar}</span>
                      <div>
                        <h3 className="font-bold text-sm leading-tight">{stu.name}</h3>
                        <p className="text-[11px] text-slate-300">{stu.gradeLevel}</p>
                      </div>
                    </div>
                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        openRecapForStudent(stu.id);
                      }}
                      className="px-2.5 py-1 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-white text-[11px] font-semibold flex items-center gap-1"
                    >
                      <Sparkles className="w-3 h-3" /> Recap
                    </button>
                  </div>

                  <div className="grid grid-cols-4 gap-1 text-center my-2">
                    <div className="bg-slate-900/60 rounded-lg p-1.5">
                      <div className="text-xs font-bold text-emerald-400">{formatMinutes(st.todayMins)}</div>
                      <div className="text-[9px] text-slate-400">Hoy</div>
                    </div>
                    <div className="bg-slate-900/60 rounded-lg p-1.5">
                      <div className="text-xs font-bold text-amber-400">{st.dueRecall}</div>
                      <div className="text-[9px] text-slate-400">Recall</div>
                    </div>
                    <div className="bg-slate-900/60 rounded-lg p-1.5">
                      <div className="text-xs font-bold text-rose-400">{st.weakCount}</div>
                      <div className="text-[9px] text-slate-400">Flojos 🔴</div>
                    </div>
                    <div className="bg-slate-900/60 rounded-lg p-1.5" title="Media de Participación en clase (1=Muy alta, 5=Baja)">
                      <div className="text-xs font-bold text-sky-300">
                        {st.partStats.avgEmoji} Ø {st.partStats.avgGradeStr}
                      </div>
                      <div className="text-[9px] text-slate-400">Particip.</div>
                    </div>
                  </div>

                  <div className="flex items-center justify-between gap-1 text-[11px]">
                    {st.nextExam ? (
                      <div className="flex-1 bg-amber-500/20 border border-amber-400/30 text-amber-200 px-2 py-1 rounded-lg flex items-center justify-between truncate">
                        <span className="truncate">🎓 {st.nextExam.title}</span>
                        <span className="font-bold ml-1 shrink-0">en {diffDaysFromToday(st.nextExam.exam_date)}d</span>
                      </div>
                    ) : (
                      <div className="text-slate-400 italic">Sin exámenes próximos</div>
                    )}
                    {st.partStats.highStreak > 0 && (
                      <span className="px-2 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 font-bold shrink-0">
                        🔥 {st.partStats.highStreak} clases alta
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* RUTINA DE TARDE: RECAP GUIADO SEGÚN EL HORARIO (CON TACHADO DE VERTRETUNG) */}
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-indigo-100">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
          <div>
            <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 text-xs font-bold mb-1">
              <Sparkles className="w-3.5 h-3.5" /> Recap Diario • {currentStudent.avatar} {currentStudent.name}
            </div>
            <h2 className="text-base sm:text-lg font-extrabold text-slate-900">
              ¿Qué habéis visto hoy en el colegio?
            </h2>
            <p className="text-xs text-slate-500">
              Registra temario, tu <strong>participación en clase (1 a 5)</strong> o tacha si hubo <strong>Vertretung / Entfall</strong>.
            </p>
          </div>

          <button
            onClick={() => openRecapForStudent(currentStudent.id)}
            className="w-full sm:w-auto px-4 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow flex items-center justify-center gap-2 active:scale-95 transition"
          >
            <Sparkles className="w-4 h-4" />
            <span>✨ Hacer Recap de Hoy</span>
          </button>
        </div>

        {/* SELECTOR DE DÍA Y CLASES DEL HORARIO (CON TACHADO SI FUE VERTRETUNG / ENTFALL) */}
        <div className="mt-3">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-bold text-slate-600 flex items-center gap-1">
              <Calendar className="w-3.5 h-3.5 text-indigo-600" />
              Clases de {currentStudent.name} ({WEEKDAYS.find((w) => w.key === selectedDayKey)?.name}):
            </span>
            <button
              onClick={() => setScheduleModalOpen(true)}
              className="text-xs text-indigo-600 hover:underline font-bold flex items-center gap-0.5"
            >
              Editar Horario ✏️
            </button>
          </div>

          <div className="grid grid-cols-5 gap-1 mb-3 bg-slate-100 p-1 rounded-xl">
            {WEEKDAYS.map((day) => (
              <button
                key={day.key}
                onClick={() => setSelectedDayKey(day.key)}
                className={`py-1.5 rounded-lg text-xs font-bold transition ${
                  selectedDayKey === day.key ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'
                }`}
              >
                {day.short}
              </button>
            ))}
          </div>

          {todaySubjects.length === 0 ? (
            <div className="text-center py-4 bg-slate-50 rounded-xl border border-dashed border-slate-200">
              <p className="text-xs text-slate-500 mb-2">No hay asignaturas en este día.</p>
              <button
                onClick={() => setScheduleModalOpen(true)}
                className="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold"
              >
                Configurar Horario (Stundenplan)
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
              {todaySubjects.map((subj, idx) => {
                // Buscar si ya se registró sesión hoy para esta hora o asignatura
                const session =
                  studentTodaySessions.find((s) => s.period_idx === idx && s.subject_id === subj.id) ||
                  studentTodaySessions.find((s) => s.subject_id === subj.id);

                const isVertretung = session?.status === 'vertretung';
                const isEntfall = session?.status === 'entfall';
                const isStruckOut = isVertretung || isEntfall;
                const partObj = session
                  ? PARTICIPATION_LEVELS.find((p) => p.id === String(session.participation))
                  : null;

                return (
                  <div
                    key={`${subj.id}_${idx}`}
                    onClick={() => openRecapForStudent(currentStudent.id)}
                    className={`p-3 rounded-xl border cursor-pointer transition flex flex-col justify-between gap-2 ${
                      isStruckOut
                        ? 'bg-slate-100/90 border-dashed border-slate-300 opacity-80'
                        : session
                        ? 'bg-emerald-50/60 border-emerald-300'
                        : 'bg-slate-50/70 border-slate-200 hover:border-indigo-300'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-1">
                      <div className="flex items-center gap-1.5 min-w-0">
                        <span className="text-base shrink-0">{subj.icon}</span>
                        <span
                          className={`font-bold text-xs truncate ${
                            isStruckOut ? 'line-through text-slate-500' : 'text-slate-800'
                          }`}
                        >
                          {subj.name}
                        </span>
                      </div>
                      <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-200 text-slate-600 shrink-0">

                    {session ? (
                      <div className="space-y-1">
                        {isVertretung && (
                          <div className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-amber-100 text-amber-900 border border-amber-300 text-[10px] font-extrabold">
                            🔄 Vertretung (Tachada · Sin temario)
                          </div>
                        )}
                        {isEntfall && (
                          <div className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-slate-200 text-slate-700 border border-slate-300 text-[10px] font-extrabold">
                            🚫 Entfall (Clase cancelada)
                          </div>
                        )}
                        {session.status === 'normal' && (
                          <div className="text-[11px] text-emerald-900 font-semibold truncate">
                            ✅ {session.subtopic_title || session.topic_title || 'Recap completado'}
                          </div>
                        )}
                        {partObj && partObj.id !== 'na' && (
                          <div className="flex items-center justify-between text-[10px] pt-1 border-t border-slate-200/60">
                            <span className="text-slate-500">Participación:</span>
                            <span className={`px-1.5 py-0.2 rounded font-bold border ${partObj.badgeClass}`}>
                              {partObj.emoji} {partObj.label} (Nota {partObj.grade})
                            </span>
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="text-[11px] text-indigo-600 font-semibold flex items-center justify-between pt-1 border-t border-slate-200/60">
                        <span>Pendiente de Recap</span>
                        <span>Registrar →</span>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      {/* RADAR DE EXÁMENES */}
      {upcomingExams.length > 0 && (
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2">
          <div className="flex items-center justify-between">
            <h3 className="font-bold text-sm text-slate-800 flex items-center gap-1.5">
              <AlertCircle className="w-4 h-4 text-amber-500" />
              Radar de Exámenes ({currentStudent.name})
            </h3>
            <button onClick={() => setActiveTab('exams')} className="text-xs font-bold text-indigo-600 hover:underline">
              Ver calendario
            </button>
          </div>
          {upcomingExams.map((ex) => {
            const urgency = getExamUrgencyInfo(ex.exam_date);
            const subj = appData.subjects.find((s) => s.id === ex.subject_id);
            return (
              <div key={ex.id} className={`p-3 rounded-xl border flex items-center justify-between gap-2 ${urgency.bannerColor}`}>
                <div>
                  <div className="font-bold text-xs uppercase opacity-90">{urgency.badge}</div>
                  <div className="font-extrabold text-sm">{subj?.icon} {subj?.name}: {ex.title}</div>
                </div>
                <button
                  onClick={() => setActiveTab('recall')}
                  className="px-2.5 py-1.5 rounded-lg bg-slate-900 text-white text-xs font-bold shrink-0"
                >
                  Repasar
                </button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// VISTA 4: CALENDARIO TIPO TABLA (MENSUAL) + EXÁMENES Y NOTAS ALEMANAS (1+ A 6)

const MONTH_NAMES_ES = [
  'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
  'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
];

function ExamsAndGermanGradesView({
  appData,
  activeProfile,
  currentStudent,
  setAppData,
  getExamUrgencyInfo,
  showToast,
  setActiveTab,
}) {
  // Vista activa: 'calendar' (Tabla mensual) | 'list' (Lista y expediente)
  const [viewMode, setViewMode] = useState('calendar');

  // En Modo Padre permite ver ambos hijos ('ALL') o filtrar por uno ('stu_1' | 'stu_2')
  const [parentFilter, setParentFilter] = useState('ALL');

  // Mes visible en el calendario (año y mes 0-11)
  const todayDateObj = new Date();
  const todayStr = toDateStr(todayDateObj);
  const [calYear, setCalYear] = useState(todayDateObj.getFullYear());
  const [calMonth, setCalMonth] = useState(todayDateObj.getMonth());

  // Día seleccionado al tocar una casilla de la tabla
  const [selectedDate, setSelectedDate] = useState(todayStr);

  // Modales de Crear Examen y Calificar Nota Alemana
  const [createExamModalDate, setCreateExamModalDate] = useState(null); // string YYYY-MM-DD o null
  const [gradingExamId, setGradingExamId] = useState(null);

  // Filtrado de exámenes y tareas según perfil (Hijo individual o Modo Padre con filtro)
  const visibleStudentIds = useMemo(() => {
    if (activeProfile !== 'parent') return [currentStudent.id];
    if (parentFilter === 'ALL') return appData.students.map((s) => s.id);
    return [parentFilter];
  }, [activeProfile, currentStudent.id, parentFilter, appData.students]);

  const filteredExams = useMemo(() => {
    return appData.exams
      .filter((e) => visibleStudentIds.includes(e.student_id))
      .sort((a, b) => a.exam_date.localeCompare(b.exam_date));
  }, [appData.exams, visibleStudentIds]);

  const filteredTasks = useMemo(() => {
    return (appData.tasks || []).filter((t) => visibleStudentIds.includes(t.student_id));
  }, [appData.tasks, visibleStudentIds]);

  // Navegación de meses
  const goPrevMonth = () => {
    if (calMonth === 0) {
      setCalMonth(11);
      setCalYear((y) => y - 1);
    } else {
      setCalMonth((m) => m - 1);
    }
  };

  const goNextMonth = () => {
    if (calMonth === 11) {
      setCalMonth(0);
      setCalYear((y) => y + 1);
    } else {
      setCalMonth((m) => m + 1);
    }
  };

  const goToday = () => {
    const now = new Date();
    setCalYear(now.getFullYear());
    setCalMonth(now.getMonth());
    setSelectedDate(toDateStr(now));
  };

  // Construcción de las celdas de la tabla mensual (Lunes = col 0 ... Domingo = col 6)
  const calendarCells = useMemo(() => {
    const firstDayOfMonth = new Date(calYear, calMonth, 1);
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    // getDay(): 0 es Domingo, 1 es Lunes... Convertimos a Lunes=0 .. Domingo=6
    const startOffset = (firstDayOfMonth.getDay() + 6) % 7;

    const cells = [];
    // Días de relleno del mes anterior
    const prevMonthDays = new Date(calYear, calMonth, 0).getDate();
    for (let i = startOffset - 1; i >= 0; i--) {
      const dNum = prevMonthDays - i;
      const dt = new Date(calYear, calMonth - 1, dNum);
      cells.push({
        dateStr: toDateStr(dt),
        dayNum: dNum,
        isCurrentMonth: false,
      });
    }

    // Días del mes actual
    for (let dNum = 1; dNum <= daysInMonth; dNum++) {
      const dt = new Date(calYear, calMonth, dNum);
      cells.push({
        dateStr: toDateStr(dt),
        dayNum: dNum,
        isCurrentMonth: true,
      });
    }

    // Relleno final hasta completar múltiplo de 7 (35 o 42 celdas)
    const remaining = (7 - (cells.length % 7)) % 7;
    for (let i = 1; i <= remaining; i++) {
      const dt = new Date(calYear, calMonth + 1, i);
      cells.push({
        dateStr: toDateStr(dt),
        dayNum: i,
        isCurrentMonth: false,
      });
    }
    return cells;
  }, [calYear, calMonth]);

  // Estilo visual de la píldora de examen según su urgencia o si ya tiene nota
  const getExamPillStyle = (exam) => {
    if (exam.grade_label) {
      return {
        dot: '🏅',
        pillClass: 'bg-emerald-50 border-emerald-400 text-emerald-950',
        dotColor: 'bg-emerald-500',
      };
    }
    const d = diffDaysFromToday(exam.exam_date);
    if (d < 0) {
      return {
        dot: '⏳',
        pillClass: 'bg-slate-100 border-slate-300 text-slate-700',
        dotColor: 'bg-slate-400',
      };
    }
    if (d <= 1) {
      return {
        dot: '🔴',
        pillClass: 'bg-red-50 border-red-400 text-red-950 font-extrabold ring-1 ring-red-400/50',
        dotColor: 'bg-red-600',
      };
    }
    if (d <= 3) {
      return {
        dot: '🟠',
        pillClass: 'bg-orange-50 border-orange-400 text-orange-950 font-bold',
        dotColor: 'bg-orange-500',
      };
    }
    if (d <= 7) {
      return {
        dot: '🟡',
        pillClass: 'bg-amber-50 border-amber-400 text-amber-950 font-semibold',
        dotColor: 'bg-amber-500',
      };
    }
    return {
      dot: '🟢',
      pillClass: 'bg-emerald-50/70 border-emerald-300 text-emerald-900',
      dotColor: 'bg-emerald-500',
    };
  };

  // Cálculo de Nota Media Alemana (Notendurchschnitt) del alumno actual
  const studentExamsForAvg = appData.exams.filter((e) => e.student_id === currentStudent.id);
  const gradedExams = studentExamsForAvg.filter((e) => e.grade_value !== null && e.grade_value !== undefined);
  const overallAverage =
    gradedExams.length > 0
      ? (gradedExams.reduce((acc, e) => acc + Number(e.grade_value), 0) / gradedExams.length)
          .toFixed(2)
          .replace('.', ',')
      : '—';

  // Exámenes y deberes del día seleccionado en la tabla
  const selectedDayExams = filteredExams.filter((e) => e.exam_date === selectedDate);
  const selectedDayTasks = filteredTasks.filter((t) => t.due_date === selectedDate);

  const handleDeleteExam = (examId) => {
    setAppData((prev) => ({
      ...prev,
      lastUpdated: Date.now(),
      exams: prev.exams.filter((e) => e.id !== examId),
    }));
    showToast('🗑️ Examen eliminado');
  };

  return (
    <div className="space-y-4">
      {/* CABECERA: NOTENDURCHSCHNITT + CONMUTADOR TABLA VS LISTA */}
      <div className="bg-slate-900 text-white rounded-2xl p-4 shadow-md space-y-3">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-400">
              🇩🇪 Exámenes y Notas (1+ bis 6) • {currentStudent.avatar} {currentStudent.name}
            </span>
            <h2 className="text-base sm:text-lg font-extrabold mt-0.5 flex items-center gap-2">
              <span>Media Global (Notendurchschnitt):</span>
              <span className="px-2.5 py-0.5 rounded-lg bg-amber-500 text-slate-950 font-black">
                Ø {overallAverage}
              </span>
            </h2>
          </div>

          <button
            onClick={() => setCreateExamModalDate(selectedDate || todayStr)}
            className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow active:scale-95 transition shrink-0"
          >
            <Plus className="w-4 h-4" /> Nuevo Examen
          </button>
        </div>

        {/* BARRA DE ALTERNAR VISTA (CALENDARIO TABLA VS LISTA) + FILTRO MODO PADRE */}
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pt-2 border-t border-slate-800">
          <div className="grid grid-cols-2 gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
            <button
              onClick={() => setViewMode('calendar')}
              className={`py-1.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                viewMode === 'calendar'
                  ? 'bg-indigo-600 text-white shadow'
                  : 'text-slate-400 hover:text-white'
              }`}
            >
              <Calendar className="w-3.5 h-3.5" />
              <span>🗓️ Calendario (Tabla)</span>
            </button>
            <button
              onClick={() => setViewMode('list')}
              className={`py-1.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                viewMode === 'list'
                  ? 'bg-indigo-600 text-white shadow'
                  : 'text-slate-400 hover:text-white'
              }`}
            >
              <FileText className="w-3.5 h-3.5" />
              <span>📋 Lista / Notas ({filteredExams.length})</span>
            </button>
          </div>

          {activeProfile === 'parent' && (
            <div className="flex items-center gap-1 bg-slate-950/60 p-1 rounded-xl border border-slate-800">
              <button
                onClick={() => setParentFilter('ALL')}
                className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                  parentFilter === 'ALL'
                    ? 'bg-amber-500 text-slate-950'
                    : 'text-slate-300 hover:bg-slate-800'
                }`}
              >
                👨‍👦‍👦 Ambos
              </button>
              {appData.students.map((stu) => (
                <button
                  key={stu.id}
                  onClick={() => setParentFilter(stu.id)}
                  className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                    parentFilter === stu.id
                      ? 'bg-amber-500 text-slate-950'
                      : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  {stu.avatar} {stu.name}
                </button>
              ))}
            </div>
          )}
        </div>
      </div>

      {viewMode === 'calendar' ? (
        <>
          {/* =================================================================
              TABLA DE CALENDARIO MENSUAL (LUNES A DOMINGO)
             ================================================================= */}
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            {/* Barra de navegación del mes */}
            <div className="p-3 sm:p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between gap-2">
              <div className="flex items-center gap-1.5">
                <button
                  onClick={goPrevMonth}
                  className="p-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold text-xs active:scale-95 transition"
                  title="Mes anterior"
                >
                  ◀
                </button>
                <button
                  onClick={goNextMonth}
                  className="p-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold text-xs active:scale-95 transition"
                  title="Mes siguiente"
                >
                  ▶
                </button>
                <h3 className="font-extrabold text-sm sm:text-base text-slate-900 ml-1">
                  {MONTH_NAMES_ES[calMonth]} {calYear}
                </h3>
              </div>

              <div className="flex items-center gap-2">
                {/* Leyenda rápida de colores de urgencia */}
                <div className="hidden md:flex items-center gap-2 text-[11px] text-slate-500 mr-2">
                  <span>🔴 ≤1d</span>
                  <span>🟠 ≤3d</span>
                  <span>🟡 ≤7d</span>
                  <span>🟢 +7d</span>
                  <span>📌 Deberes</span>
                </div>
                <button
                  onClick={goToday}
                  className="px-3 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold text-xs active:scale-95 transition"
                >
                  Ir a Hoy
                </button>
              </div>
            </div>

            {/* Cabecera de columnas Lunes a Domingo */}
            <div className="grid grid-cols-7 bg-slate-100 border-b border-slate-200 text-center">
              {['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map((dName, idx) => (
                <div
                  key={dName}
                  className={`py-2 text-[11px] font-extrabold uppercase tracking-wider ${
                    idx >= 5 ? 'text-slate-400 bg-slate-100/70' : 'text-slate-600'
                  }`}
                >
                  {dName}
                </div>
              ))}
            </div>

            {/* Cuadrícula de días del mes */}
            <div className="grid grid-cols-7 divide-x divide-y divide-slate-200 border-b border-slate-200">
              {calendarCells.map((cell, idx) => {
                const isToday = cell.dateStr === todayStr;
                const isSelected = cell.dateStr === selectedDate;
                const isWeekend = idx % 7 === 5 || idx % 7 === 6;

                const dayExams = filteredExams.filter((e) => e.exam_date === cell.dateStr);
                const dayPendingTasks = filteredTasks.filter(
                  (t) => t.due_date === cell.dateStr && !t.completed
                );

                return (
                  <div
                    key={cell.dateStr}
                    onClick={() => setSelectedDate(cell.dateStr)}
                    className={`min-h-[74px] sm:min-h-[96px] p-1 sm:p-1.5 cursor-pointer transition flex flex-col justify-between relative ${
                      !cell.isCurrentMonth
                        ? 'bg-slate-50/60 text-slate-300'
                        : isWeekend
                        ? 'bg-slate-50/40'
                        : 'bg-white'
                    } ${
                      isSelected
                        ? 'ring-2 ring-inset ring-indigo-600 bg-indigo-50/25 z-10'
                        : 'hover:bg-slate-50'
                    }`}
                  >
                    {/* Fila superior de la casilla: Número de día + Icono de deberes 📌 */}
                    <div className="flex items-center justify-between gap-0.5">
                      <span
                        className={`w-6 h-6 rounded-full text-xs font-extrabold flex items-center justify-center ${
                          isToday
                            ? 'bg-indigo-600 text-white shadow-sm'
                            : isSelected
                            ? 'text-indigo-700 font-black'
                            : cell.isCurrentMonth
                            ? 'text-slate-700'
                            : 'text-slate-300'
                        }`}
                      >
                        {cell.dayNum}
                      </span>

                      {dayPendingTasks.length > 0 && (
                        <span
                          className="text-[10px] font-bold px-1 py-0.2 rounded bg-amber-100 text-amber-800 border border-amber-300"
                          title={`${dayPendingTasks.length} deber(es) para entregar`}
                        >
                          📌{dayPendingTasks.length > 1 ? dayPendingTasks.length : ''}
                        </span>
                      )}
                    </div>

                    {/* Píldoras de Exámenes dentro de la casilla */}
                    <div className="space-y-1 mt-1 overflow-hidden">
                      {dayExams.map((ex) => {
                        const subj = appData.subjects.find((s) => s.id === ex.subject_id);
                        const stu = appData.students.find((s) => s.id === ex.student_id);
                        const style = getExamPillStyle(ex);
                        const showStuTag =
                          activeProfile === 'parent' && parentFilter === 'ALL';

                        return (
                          <div
                            key={ex.id}
                            className={`px-1.5 py-0.5 rounded-md border text-[10px] leading-tight flex items-center justify-between gap-1 truncate shadow-2xs ${style.pillClass}`}
                            title={`${stu?.name}: ${subj?.name} - ${ex.title}`}
                          >
                            <div className="flex items-center gap-0.5 min-w-0 truncate">
                              <span className="shrink-0">{style.dot}</span>
                              {showStuTag && (
                                <span
                                  className={`px-1 rounded text-[9px] font-black text-white shrink-0 ${
                                    stu?.id === 'stu_1' ? 'bg-indigo-600' : 'bg-emerald-600'
                                  }`}
                                >
                                  {stu?.name.slice(0, 1)}
                                </span>
                              )}
                              <span className="shrink-0">{subj?.icon}</span>
                              <span className="truncate font-bold">
                                {subj?.name}
                              </span>
                            </div>

                            {ex.grade_label && (
                              <span className="px-1 rounded bg-emerald-600 text-white font-black text-[9px] shrink-0">
                                {ex.grade_label}
                              </span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Leyenda inferior móvil */}
            <div className="px-3 py-2 bg-slate-50 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500">
              <div className="flex items-center gap-2 flex-wrap">
                <span>🔴 Hoy/Mañana</span>
                <span>🟠 ≤3 días</span>
                <span>🟡 ≤7 días</span>
                <span>🟢 +7 días</span>
                <span>🏅 Con nota</span>
              </div>
              <span className="text-indigo-600 font-bold">
                👆 Toca cualquier día para ver o añadir examen
              </span>
            </div>
          </div>

          {/* =================================================================
              PANEL DE DETALLE DEL DÍA SELECCIONADO ABAJO DE LA TABLA
             ================================================================= */}
          <div className="bg-white rounded-2xl p-4 shadow-sm border-2 border-indigo-200 space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2.5 border-b border-slate-100">
              <div>
                <span className="text-[11px] font-extrabold uppercase text-indigo-600">
                  📅 Día seleccionado en el calendario
                </span>
                <h4 className="font-black text-base text-slate-900">
                  {formatHumanDate(selectedDate)}{' '}
                  <span className="text-xs font-normal text-slate-500">
                    ({selectedDate.split('-').reverse().join('.')})
                  </span>
                </h4>
              </div>

              <button
                onClick={() => setCreateExamModalDate(selectedDate)}
                className="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition"
              >
                <Plus className="w-4 h-4" />
                <span>+ Añadir Examen este día</span>
              </button>
            </div>

            {/* Exámenes de ese día */}
            {selectedDayExams.length === 0 ? (
              <div className="text-center py-4 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                <p className="text-xs text-slate-500">
                  No hay exámenes programados para el{' '}
                  <strong>{selectedDate.split('-').reverse().join('.')}</strong>.
                </p>
              </div>
            ) : (
              <div className="space-y-2.5">
                {selectedDayExams.map((exam) => {
                  const subj = appData.subjects.find((s) => s.id === exam.subject_id);
                  const stu = appData.students.find((s) => s.id === exam.student_id);
                  const urgency = getExamUrgencyInfo(exam.exam_date);
                  const gradeObj = GERMAN_GRADES.find((g) => g.label === exam.grade_label);
                  const feelingObj = POST_EXAM_FEELINGS.find(
                    (f) => f.id === exam.post_exam_feeling
                  );

                  const allSubtopics = appData.topics
                    .filter((t) => t.student_id === exam.student_id)
                    .flatMap((t) => t.subtopics);
                  const examSubtopics = allSubtopics.filter((st) =>
                    (exam.subtopic_ids || []).includes(st.id)
                  );

                  return (
                    <div
                      key={exam.id}
                      className="rounded-xl border border-slate-200 overflow-hidden bg-slate-50/60"
                    >
                      <div
                        className={`px-3 py-1.5 text-xs font-bold flex items-center justify-between ${urgency.bannerColor}`}
                      >
                        <span>
                          {stu?.avatar} {stu?.name} • {urgency.badge}
                        </span>
                        <button
                          onClick={() => handleDeleteExam(exam.id)}
                          className="text-xs opacity-75 hover:opacity-100 px-1"
                          title="Eliminar examen"
                        >
                          🗑️
                        </button>
                      </div>

                      <div className="p-3 space-y-2.5">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                          <div>
                            <span className="text-xs font-bold text-indigo-600">
                              {subj?.icon} {subj?.name}
                            </span>
                            <h5 className="font-extrabold text-sm sm:text-base text-slate-900">
                              {exam.title}
                            </h5>
                          </div>

                          <div className="flex items-center gap-2">
                            <button
                              onClick={() => setActiveTab('recall')}
                              className="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold"
                            >
                              ⚡ Preguntar en Recall
                            </button>

                            {exam.grade_label ? (
                              <button
                                onClick={() => setGradingExamId(exam.id)}
                                className={`px-3 py-1.5 rounded-xl font-black text-xs shadow-sm ${
                                  gradeObj?.color || 'bg-emerald-600 text-white'
                                }`}
                              >
                                Nota: {exam.grade_label} (
                                {String(exam.grade_value).replace('.', ',')})
                              </button>
                            ) : (
                              <button
                                onClick={() => setGradingExamId(exam.id)}
                                className="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs shadow-sm"
                              >
                                🏅 Poner Nota (1+ a 6)
                              </button>
                            )}
                          </div>
                        </div>

                        {examSubtopics.length > 0 && (
                          <div className="bg-white p-2.5 rounded-xl border border-slate-200/80">
                            <div className="text-[11px] font-bold text-slate-500 mb-1">
                              Subtemas que entran en este examen ({examSubtopics.length}):
                            </div>
                            <div className="flex flex-wrap gap-1.5">
                              {examSubtopics.map((st) => {
                                const comp = COMPREHENSION_LEVELS.find(
                                  (c) => c.id === st.comprehension
                                );
                                return (
                                  <span
                                    key={st.id}
                                    className={`text-[11px] font-semibold px-2 py-0.5 rounded-lg border ${comp?.badgeClass}`}
                                  >
                                    {comp?.emoji} {st.title}
                                  </span>
                                );
                              })}
                            </div>
                          </div>
                        )}

                        {exam.post_exam_feeling && (
                          <div className="bg-indigo-50/70 border border-indigo-200 rounded-xl p-2.5 text-xs">
                            <span className="font-bold text-indigo-950">
                              Sensación post-examen: {feelingObj?.emoji} {feelingObj?.label}
                            </span>
                            {exam.post_exam_comment && (
                              <p className="text-slate-700 italic mt-0.5">
                                "{exam.post_exam_comment}"
                              </p>
                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* Deberes / Tareas que se entregan en el día seleccionado */}
            {selectedDayTasks.length > 0 && (
              <div className="pt-2 border-t border-slate-100 space-y-1.5">
                <div className="text-xs font-extrabold text-amber-800 flex items-center gap-1">
                  📌 Deberes con fecha de entrega este día ({selectedDayTasks.length}):
                </div>
                {selectedDayTasks.map((tsk) => {
                  const subj = appData.subjects.find((s) => s.id === tsk.subject_id);
                  const stu = appData.students.find((s) => s.id === tsk.student_id);
                  return (
                    <div
                      key={tsk.id}
                      className="flex items-center justify-between p-2.5 rounded-xl bg-amber-50/60 border border-amber-200 text-xs"
                    >
                      <button
                        onClick={() =>
                          setAppData((prev) => ({
                            ...prev,
                            lastUpdated: Date.now(),
                            tasks: prev.tasks.map((item) =>
                              item.id === tsk.id
                                ? { ...item, completed: !item.completed, updated_at: Date.now() }
                                : item
                            ),
                          }))
                        }
                        className="flex items-center gap-2 text-left"
                      >
                        {tsk.completed ? (
                          <CheckSquare className="w-4 h-4 text-emerald-600 shrink-0" />
                        ) : (
                          <Square className="w-4 h-4 text-amber-700 shrink-0" />
                        )}
                        <span className={tsk.completed ? 'line-through text-slate-400' : 'font-bold text-slate-800'}>
                          {stu?.avatar} {subj?.icon} {subj?.name}: {tsk.title}
                        </span>
                      </button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </>
      ) : (
        /* ===================================================================
           VISTA ALTERNATIVA: LISTA Y EXPEDIENTE DE NOTAS POR ASIGNATURA
           =================================================================== */
        <div className="space-y-4">
          {/* Medias por asignatura */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
            {appData.subjects
              .filter((s) => s.student_id === currentStudent.id)
              .map((subj) => {
                const subjGraded = gradedExams.filter((e) => e.subject_id === subj.id);
                const avg =
                  subjGraded.length > 0
                    ? (
                        subjGraded.reduce((acc, e) => acc + Number(e.grade_value), 0) /
                        subjGraded.length
                      )
                        .toFixed(1)
                        .replace('.', ',')
                    : '—';
                return (
                  <div
                    key={subj.id}
                    className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between"
                  >
                    <div>
                      <div className="text-xs font-bold text-slate-700">
                        {subj.icon} {subj.name}
                      </div>
                      <div className="text-[10px] text-slate-400">
                        {subjGraded.length} nota(s)
                      </div>
                    </div>
                    <div className="text-sm font-black text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-lg">
                      Ø {avg}
                    </div>
                  </div>
                );
              })}
          </div>

          <div className="space-y-3">
            {filteredExams.map((exam) => {
              const subj = appData.subjects.find((s) => s.id === exam.subject_id);
              const stu = appData.students.find((s) => s.id === exam.student_id);
              const urgency = getExamUrgencyInfo(exam.exam_date);
              const gradeObj = GERMAN_GRADES.find((g) => g.label === exam.grade_label);

              return (
                <div
                  key={exam.id}
                  className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden"
                >
                  <div
                    className={`px-4 py-2 border-b flex items-center justify-between text-xs font-bold ${urgency.bannerColor}`}
                  >
                    <span>
                      {stu?.avatar} {stu?.name} • {urgency.badge}
                    </span>
                    <span>Fecha: {formatHumanDate(exam.exam_date)}</span>
                  </div>
                  <div className="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div>
                      <span className="text-xs font-bold text-indigo-600">
                        {subj?.icon} {subj?.name}
                      </span>
                      <h3 className="text-base font-extrabold text-slate-900">{exam.title}</h3>
                    </div>

                    <div className="flex items-center gap-2">
                      {exam.grade_label ? (
                        <button
                          onClick={() => setGradingExamId(exam.id)}
                          className={`px-3 py-1.5 rounded-xl font-black text-sm shadow-sm ${
                            gradeObj?.color || 'bg-emerald-600 text-white'
                          }`}
                        >
                          Nota: {exam.grade_label} ({String(exam.grade_value).replace('.', ',')})
                        </button>
                      ) : (
                        <button
                          onClick={() => setGradingExamId(exam.id)}
                          className="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs shadow-sm"
                        >
                          🏅 Registrar Nota (1+ a 6)
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* MODAL CREAR NUEVO EXAMEN (CON FECHA PRE-RELLENADA DEL CALENDARIO) */}
      {createExamModalDate && (
        <CreateExamModal
          appData={appData}
          activeProfile={activeProfile}
          currentStudent={currentStudent}
          initialDate={createExamModalDate}
          onClose={() => setCreateExamModalDate(null)}
          onSave={(newExam) => {
            setAppData((prev) => ({
              ...prev,
              lastUpdated: Date.now(),
              exams: [newExam, ...prev.exams],
            }));
            setSelectedDate(newExam.exam_date);
            setCreateExamModalDate(null);
            showToast('🎓 Examen añadido al calendario');
          }}
        />
      )}

      {/* MODAL CALIFICAR CON NOTA ALEMANA (1+ A 6) Y COMENTARIO POST-EXAMEN */}
      {gradingExamId && (
        <GermanGradePickerModal
          exam={appData.exams.find((e) => e.id === gradingExamId)}
          onClose={() => setGradingExamId(null)}
          onSave={({ grade_label, grade_value, post_exam_feeling, post_exam_comment }) => {
            setAppData((prev) => ({
              ...prev,
              lastUpdated: Date.now(),
              exams: prev.exams.map((e) =>
                e.id === gradingExamId
                  ? {
                      ...e,
                      grade_label,
                      grade_value,
                      post_exam_feeling,
                      post_exam_comment,
                      updated_at: Date.now(),
                    }
                  : e
              ),
            }));
            setGradingExamId(null);
            showToast(`🏅 Nota ${grade_label} guardada`);
          }}
        />
      )}
    </div>
  );
}

// ============================================================================
// MODAL CREAR EXAMEN VINCULANDO TEMAS Y SUBTEMAS
// ============================================================================
function CreateExamModal({ appData, activeProfile, currentStudent, initialDate, onClose, onSave }) {
  const [studentId, setStudentId] = useState(currentStudent.id);
  const studentSubjects = appData.subjects.filter((s) => s.student_id === studentId);
  const [subjectId, setSubjectId] = useState(studentSubjects[0]?.id || '');
  const [title, setTitle] = useState('');
  const [examDate, setExamDate] = useState(initialDate || toDateStr());
  const [selectedSubtopics, setSelectedSubtopics] = useState([]);

  useEffect(() => {
    const subs = appData.subjects.filter((s) => s.student_id === studentId);
    setSubjectId(subs[0]?.id || '');
    setSelectedSubtopics([]);
  }, [studentId]);

  const subjectTopics = appData.topics.filter(
    (t) => t.student_id === studentId && t.subject_id === subjectId
  );

  const toggleSubtopic = (subId) => {
    setSelectedSubtopics((prev) =>
      prev.includes(subId) ? prev.filter((id) => id !== subId) : [...prev, subId]
    );
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!title.trim()) {
      alert('Escribe el título del examen (ej. 2. Klassenarbeit Bruchrechnung)');
      return;
    }
    const topicIds = subjectTopics
      .filter((t) => t.subtopics.some((st) => selectedSubtopics.includes(st.id)))
      .map((t) => t.id);

    onSave({
      id: uid('ex'),
      student_id: studentId,
      subject_id: subjectId,
      title: title.trim(),
      exam_date: examDate,
      topic_ids: topicIds,
      subtopic_ids: selectedSubtopics,
      post_exam_feeling: null,
      post_exam_comment: '',
      grade_label: null,
      grade_value: null,
      updated_at: Date.now(),
    });
  };

  return (
    <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-3">
      <div
        className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col"
      >
        <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
          <div>
            <span className="text-[10px] uppercase font-bold text-indigo-300">
              🗓️ Programar Examen en Calendario
            </span>
            <h3 className="font-bold text-sm">Nueva Klassenarbeit / Test</h3>
          </div>
          <button type="button" onClick={onClose}>
            <X className="w-5 h-5 text-slate-400" />
          </button>
        </div>

        <div className="p-4 space-y-3 overflow-y-auto">
          {/* Selector de hijo */}
          <div>
            <label className="block text-xs font-bold text-slate-700 mb-1">Alumno:</label>
            <div className="grid grid-cols-2 gap-2">
              {appData.students.map((stu) => (
                <button
                  key={stu.id}
                  type="button"
                  onClick={() => setStudentId(stu.id)}
                  className={`py-2 rounded-xl text-xs font-bold border ${
                    studentId === stu.id
                      ? 'bg-indigo-600 text-white border-indigo-600'
                      : 'bg-slate-50 text-slate-700 border-slate-200'
                  }`}
                >
                  {stu.avatar} {stu.name}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">Asignatura:</label>
              <select
                value={subjectId}
                onChange={(e) => {
                  setSubjectId(e.target.value);
                  setSelectedSubtopics([]);
                }}
                className="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-bold"
              >
                {studentSubjects.map((s) => (
                  <option key={s.id} value={s.id}>
                    {s.icon} {s.name}
                  </option>
                ))}
              </select>
            </div>
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">
                Fecha del examen:
              </label>
              <input
                type="date"
                value={examDate}
                onChange={(e) => setExamDate(e.target.value)}
                className="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-bold"
              />
            </div>
          </div>

          <div>
            <label className="block text-xs font-bold text-slate-700 mb-1">
              Título del examen:
            </label>
            <input
              type="text"
              value={title}
              onChange={(e) => setTitle(e.target.value)}
