            <div>
              <label className="block text-xs font-bold text-slate-600 mb-1">Icono:</label>
              <input
                type="text"
                value={editingSubject.icon}
                onChange={(e) => setEditingSubject({ ...editingSubject, icon: e.target.value })}
                className="w-full rounded-xl border border-slate-300 p-2.5 text-center text-base"
              />
            </div>
            <div className="col-span-3">
              <label className="block text-xs font-bold text-slate-600 mb-1">
                Nombre de la Asignatura:
              </label>
              <input
                type="text"
                value={editingSubject.name}
                onChange={(e) => setEditingSubject({ ...editingSubject, name: e.target.value })}
                placeholder="Ej. Mathematik, Physik..."
                className="w-full rounded-xl border border-slate-300 p-2.5 text-sm font-bold"
              />
            </div>
          </div>
          <div className="flex justify-between pt-2">
            <button
              onClick={() => setEditingSubject(null)}
              className="px-4 py-2.5 rounded-xl border border-slate-300 text-xs font-bold"
            >
              ← Volver
            </button>
            <button
              onClick={handleSaveSubject}
              className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow"
            >
              Guardar Asignatura
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (editingTopic) {
    return (
      <div className="bg-white w-full rounded-2xl shadow-md border border-slate-200 overflow-hidden">
        <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
          <h3 className="font-bold text-base">
            {editingTopic.id === 'NEW' ? '📂 Nuevo Tema Principal' : '✏️ Editar Tema Principal'}
          </h3>
          <button
            onClick={() => setEditingTopic(null)}
            className="px-3 py-1.5 rounded-xl bg-slate-800 text-white text-xs font-bold"
          >
            ← Volver a Temas
          </button>
        </div>
        <div className="p-4 space-y-4">
          <div>
            <label className="block text-xs font-bold text-slate-700 mb-1">Asignatura:</label>
            <select
              value={editingTopic.subject_id}
              onChange={(e) => setEditingTopic({ ...editingTopic, subject_id: e.target.value })}
              className="w-full rounded-xl border border-slate-300 p-2.5 text-xs font-bold"
            >
              {studentSubjects.map((s) => (
                <option key={s.id} value={s.id}>
                  {s.icon} {s.name}
                </option>
              ))}
            </select>
          </div>
          <div>
            <label className="block text-xs font-bold text-slate-700 mb-1">
              Título del Tema Principal:
            </label>
            <input
              type="text"
              value={editingTopic.title}
              onChange={(e) => setEditingTopic({ ...editingTopic, title: e.target.value })}
              placeholder="Ej. Bruchrechnung (Fracciones)"
              className="w-full rounded-xl border border-slate-300 p-2.5 text-sm font-bold"
            />
          </div>
          <div className="flex justify-between pt-2">
            <button
              onClick={() => setEditingTopic(null)}
              className="px-4 py-2.5 rounded-xl border border-slate-300 text-xs font-bold"
            >
              ← Volver
            </button>
            <button
              onClick={handleSaveTopic}
              className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow"
            >
              Guardar Tema
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (editingSubtopic) {
    return (
      <div className="bg-white w-full rounded-2xl shadow-md border border-slate-200 overflow-hidden">
        <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
          <h3 className="font-bold text-base">
            {editingSubtopic.id === 'NEW'
              ? '➕ Añadir Subtema y Descripción'
              : '✏️ Editar Subtema y Descripción'}
          </h3>
          <button
            onClick={() => setEditingSubtopic(null)}
            className="px-3 py-1.5 rounded-xl bg-slate-800 text-white text-xs font-bold"
          >
            ← Volver a Temas
          </button>
        </div>
        <div className="p-4 space-y-4">
          <div>
            <label className="block text-xs font-bold text-slate-700 mb-1">
              Título del Subtema (Nivel 2):
            </label>
            <input
              type="text"
              value={editingSubtopic.title}
              onChange={(e) => setEditingSubtopic({ ...editingSubtopic, title: e.target.value })}
              placeholder="Ej. Suma de fracciones con distinto denominador"
              className="w-full rounded-xl border border-slate-300 p-2.5 text-sm font-bold"
            />
          </div>
          <div>
            <label className="block text-xs font-bold text-slate-700 mb-1">
              Nivel de comprensión actual:
            </label>
            <div className="grid grid-cols-2 gap-1.5">
              {COMPREHENSION_LEVELS.map((lvl) => (
                <button
                  key={lvl.id}
                  type="button"
                  onClick={() => setEditingSubtopic({ ...editingSubtopic, comprehension: lvl.id })}
                  className={`p-2.5 rounded-xl border text-xs font-bold text-left ${
                    Number(editingSubtopic.comprehension) === lvl.id
                      ? 'ring-2 ring-indigo-600 bg-indigo-50 border-indigo-500'
                      : 'bg-slate-50 border-slate-200'
                  }`}
                >
                  {lvl.emoji} {lvl.short}
                </button>
              ))}
            </div>
          </div>
          <div>
            <label className="block text-xs font-bold text-slate-700 mb-1">
              📝 Descripción / Explicación / Fórmulas (Nivel 3):
            </label>
            <textarea
              value={editingSubtopic.notes}
              onChange={(e) => setEditingSubtopic({ ...editingSubtopic, notes: e.target.value })}
              rows={5}
              placeholder="Apuntes, explicación del profesor, trucos o ejemplos..."
              className="w-full rounded-xl border border-slate-300 p-3 text-xs"
            />
          </div>
          <div className="flex justify-between pt-2">
            <button
              onClick={() => setEditingSubtopic(null)}
              className="px-4 py-2.5 rounded-xl border border-slate-300 text-xs font-bold"
            >
              ← Volver
            </button>
            <button
              onClick={handleSaveSubtopic}
              className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow"
            >
              Guardar Subtema
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="space-y-4">
      {/* =====================================================================
          CABECERA Y TARJETAS DE ASIGNATURAS (ACCESIBLES Y EDITABLES)
         ===================================================================== */}
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <div>
            <span className="text-[11px] font-extrabold uppercase text-indigo-600">
              📚 Gestión de Asignaturas y Temario • {currentStudent.avatar} {currentStudent.name}
            </span>
            <h2 className="font-black text-base text-slate-900">
              Árbol de Asignaturas ➔ Temas ➔ Subtemas ➔ Descripción
            </h2>
          </div>

          <div className="flex items-center gap-1.5">
            <button
              onClick={() =>
                setEditingSubject({ id: 'NEW', name: '', icon: '📘' })
              }
              className="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold flex items-center gap-1"
            >
              <Plus className="w-3.5 h-3.5" /> Asignatura
            </button>
            <button
              onClick={() =>
                setEditingTopic({
                  id: 'NEW',
                  subject_id:
                    selectedSubjectId === 'ALL'
                      ? studentSubjects[0]?.id || ''
                      : selectedSubjectId,
                  title: '',
                })
              }
              className="px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center gap-1 shadow-sm"
            >
              <Plus className="w-3.5 h-3.5" /> Nuevo Tema
            </button>
          </div>
        </div>

        {/* Tarjetas de Asignaturas con botón ✏️ para editarlas */}
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 pt-1">
          <button
            onClick={() => setSelectedSubjectId('ALL')}
            className={`p-2.5 rounded-xl border text-left transition flex flex-col justify-between ${
              selectedSubjectId === 'ALL'
                ? 'bg-slate-900 text-white border-slate-900 shadow-sm'
                : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
            }`}
          >
            <div className="text-base">🗂️</div>
            <div className="mt-1">
              <div className="font-extrabold text-xs">Todas</div>
              <div className="text-[10px] opacity-75">
                {appData.topics.filter((t) => t.student_id === currentStudent.id).length} temas
              </div>
            </div>
          </button>

          {studentSubjects.map((subj) => {
            const subjTopics = appData.topics.filter(
              (t) => t.student_id === currentStudent.id && t.subject_id === subj.id
            );
            const subjSubtopicsCount = subjTopics.reduce(
              (acc, t) => acc + (t.subtopics?.length || 0),
              0
            );
            const isSelected = selectedSubjectId === subj.id;

            return (
              <div
                key={subj.id}
                onClick={() => setSelectedSubjectId(subj.id)}
                className={`p-2.5 rounded-xl border cursor-pointer transition flex flex-col justify-between relative ${
                  isSelected
                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm ring-2 ring-indigo-300'
                    : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-slate-100'
                }`}
              >
                <div className="flex items-center justify-between gap-1">
                  <span className="text-lg leading-none">{subj.icon}</span>
                  <button
                    type="button"
                    onClick={(e) => {
                      e.stopPropagation();
                      setEditingSubject({ id: subj.id, name: subj.name, icon: subj.icon });
                    }}
                    className={`p-1 rounded-lg text-[10px] font-bold ${
                      isSelected
                        ? 'bg-white/20 text-white hover:bg-white/30'
                        : 'bg-white text-slate-600 hover:bg-slate-200 border border-slate-200'
                    }`}
                    title="Editar nombre e icono de la asignatura"
                  >
                    ✏️
                  </button>
                </div>
                <div className="mt-1.5">
                  <div className="font-extrabold text-xs truncate">{subj.name}</div>
                  <div className={`text-[10px] ${isSelected ? 'text-indigo-100' : 'text-slate-500'}`}>
                    {subjTopics.length} tema(s) · {subjSubtopicsCount} sub.
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* =====================================================================
          ÁRBOL DE 3 NIVELES:
          NIVEL 1 (TEMA PRINCIPAL) -> NIVEL 2 (SUBTEMAS) -> NIVEL 3 (DESCRIPCIÓN Y FECHAS)
         ===================================================================== */}
      {studentTopics.length === 0 ? (
        <div className="bg-white rounded-2xl p-8 text-center border border-slate-200 space-y-2">
          <div className="text-2xl">📂</div>
          <p className="text-sm font-bold text-slate-800">
            No hay temas registrados en esta asignatura todavía
          </p>
          <p className="text-xs text-slate-500">
            Crea un tema con el botón superior o registra lo visto en clase con el Recap.
          </p>
          <button
            onClick={() =>
              setEditingTopic({
                id: 'NEW',
                subject_id:
                  selectedSubjectId === 'ALL'
                    ? studentSubjects[0]?.id || ''
                    : selectedSubjectId,
                title: '',
              })
            }
            className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-sm"
          >
            + Crear Primer Tema Principal
          </button>
        </div>
      ) : (
        <div className="space-y-3">
          {studentTopics.map((topic) => {
            const subj = appData.subjects.find((s) => s.id === topic.subject_id);
            const topicOpen = isTopicOpen(topic.id);
            const topicMinutes = appData.work_logs
              .filter((l) => l.topic_id === topic.id)
              .reduce((a, b) => a + b.minutes, 0);

            return (
              <div
                key={topic.id}
                className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden"
              >
                {/* NIVEL 1 DEL ÁRBOL: CABECERA DEL TEMA PRINCIPAL */}
                <div className="p-3.5 bg-slate-50 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div
                    onClick={() => toggleTopic(topic.id)}
                    className="cursor-pointer flex items-start gap-2 flex-1 min-w-0"
                  >
                    <button
                      type="button"
                      className="mt-0.5 p-1 rounded-lg bg-white border border-slate-200 text-slate-600 shrink-0"
                    >
                      {topicOpen ? (
                        <ChevronDown className="w-4 h-4" />
                      ) : (
                        <ChevronRight className="w-4 h-4" />
                      )}
                    </button>
                    <div className="min-w-0">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className="text-[11px] font-bold px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-800">
                          {subj?.icon} {subj?.name}
                        </span>
                        <span className="text-[11px] text-slate-500 font-semibold">
                          • {topic.subtopics.length} subtema(s)
                        </span>
                        {topicMinutes > 0 && (
                          <span className="text-[11px] text-emerald-700 font-bold">
                            • ⏱️ {formatMinutes(topicMinutes)}
                          </span>
                        )}
                      </div>
                      <h3 className="font-extrabold text-sm sm:text-base text-slate-900 mt-1 break-words">
                        📂 {topic.title}
                      </h3>
                    </div>
                  </div>

                  {/* Botones de edición del Tema Principal (Nivel 1) */}
                  <div className="flex items-center gap-1.5 self-end sm:self-center shrink-0">
                    <button
                      type="button"
                      onClick={() =>
                        setEditingSubtopic({
                          topic_id: topic.id,
                          id: 'NEW',
                          title: '',
                          comprehension: 3,
                          notes: '',
                        })
                      }
                      className="px-2.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center gap-1 shadow-2xs"
                    >
                      <Plus className="w-3.5 h-3.5" /> Subtema
                    </button>
                    <button
                      type="button"
                      onClick={() =>
                        setEditingTopic({
                          id: topic.id,
                          subject_id: topic.subject_id,
                          title: topic.title,
                        })
                      }
                      className="p-1.5 rounded-xl bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 text-xs font-bold"
                      title="Editar Tema Principal"
                    >
                      ✏️
                    </button>
                    <button
                      type="button"
                      onClick={() =>
                        setQuickTimeModal({
                          student_id: currentStudent.id,
                          subject_id: topic.subject_id,
                          topic_id: topic.id,
                          title: topic.title,
                        })
                      }
                      className="px-2 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold"
                      title="Añadir tiempo a este tema"
                    >
                      ⏱️
                    </button>
                    <button
                      type="button"
                      onClick={() => handleDeleteTopic(topic.id)}
                      className="p-1.5 rounded-xl bg-white hover:bg-rose-50 text-rose-600 border border-slate-200 text-xs font-bold"
                      title="Borrar Tema Principal"
                    >
                      🗑️
                    </button>
                  </div>
                </div>

                {/* NIVEL 2 DEL ÁRBOL: LISTA DE SUBTEMAS DENTRO DEL TEMA */}
                {topicOpen && (
                  <div className="divide-y divide-slate-100">
                    {topic.subtopics.length === 0 ? (
                      <div className="p-4 text-center text-xs text-slate-400 italic">
                        Este tema aún no tiene subtemas. Pulsa "+ Subtema" para añadir uno.
                      </div>
                    ) : (
                      topic.subtopics.map((st, stIdx) => {
                        const comp =
                          COMPREHENSION_LEVELS.find((c) => c.id === st.comprehension) ||
                          COMPREHENSION_LEVELS[1];
                        const subOpen = isSubtopicOpen(st.id);

                        // Fechas del calendario en las que se vio o repasó este subtema
                        const subSessions = (appData.class_sessions || []).filter(
                          (s) =>
                            s.subtopic_id === st.id ||
                            (s.topic_id === topic.id && s.subtopic_title === st.title)
                        );
                        const subLogs = (appData.work_logs || []).filter(
                          (l) => l.subtopic_id === st.id
                        );
                        const subMinutes = subLogs.reduce((a, b) => a + b.minutes, 0);

                        return (
                          <div key={st.id} className="bg-white">
                            {/* Fila Nivel 2: Subtema */}
                            <div className="p-3 pl-5 hover:bg-slate-50/80 transition flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                              <div
                                onClick={() => toggleSubtopic(st.id)}
                                className="cursor-pointer flex items-start gap-2 flex-1 min-w-0"
                              >
                                <button
                                  type="button"
                                  className="mt-0.5 p-1 rounded-md bg-slate-100 text-slate-600 shrink-0"
                                  title="Abrir Nivel 3: Descripción y apuntes"
                                >
                                  {subOpen ? (
                                    <ChevronDown className="w-3.5 h-3.5" />
                                  ) : (
                                    <ChevronRight className="w-3.5 h-3.5" />
                                  )}
                                </button>
                                <div className="min-w-0 flex-1">
                                  <div className="flex items-center gap-1.5 flex-wrap">
                                    <span className="text-xs font-extrabold text-slate-900">
                                      {stIdx + 1}. {st.title}
                                    </span>
                                    <span
                                      className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${comp.badgeClass}`}
                                    >
                                      {comp.emoji} {comp.short}
                                    </span>
                                  </div>
                                  <div className="flex items-center gap-2 text-[11px] text-slate-500 mt-0.5 flex-wrap">
                                    <span className="text-indigo-600 font-semibold">
                                      {subOpen
                                        ? '▾ Ocultar descripción'
                                        : st.notes
                                        ? `▸ 📝 Ver descripción: "${st.notes.slice(0, 45)}${st.notes.length > 45 ? '...' : ''}"`
                                        : '▸ 📝 Añadir descripción / apuntes'}
                                    </span>
                                    {subMinutes > 0 && (
                                      <span>• ⏱️ {formatMinutes(subMinutes)}</span>
                                    )}
                                    {st.created_at && (
                                      <span>• Visto: {formatHumanDate(st.created_at)}</span>
                                    )}
                                  </div>
                                </div>
                              </div>

                              {/* Controles rápidos Nivel 2: Comprensión, Editar, +Tiempo, Borrar */}
                              <div className="flex items-center gap-1.5 self-end sm:self-center shrink-0">
                                <select
                                  value={st.comprehension}
                                  onChange={(e) => {
                                    const newComp = Number(e.target.value);
                                    const lvl = COMPREHENSION_LEVELS.find((c) => c.id === newComp);
                                    updateSubtopicFieldInline(topic.id, st.id, {
                                      comprehension: newComp,
                                      next_recall_date: addDaysStr(toDateStr(), lvl?.days || 3),
                                    });
                                    showToast(`Nivel actualizado a ${lvl?.short}`);
                                  }}
                                  className="text-[11px] border border-slate-200 rounded-lg px-2 py-1 bg-slate-50 font-bold text-slate-700"
                                >
                                  {COMPREHENSION_LEVELS.map((c) => (
                                    <option key={c.id} value={c.id}>
                                      {c.emoji} {c.short}
                                    </option>
                                  ))}
                                </select>

                                <button
                                  type="button"
                                  onClick={() =>
                                    setEditingSubtopic({
                                      topic_id: topic.id,
                                      id: st.id,
                                      title: st.title,
                                      comprehension: st.comprehension,
                                      notes: st.notes || '',
                                    })
                                  }
                                  className="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold"
                                  title="Editar Subtema y Descripción"
                                >
                                  ✏️
                                </button>

                                <button
                                  type="button"
                                  onClick={() =>
                                    setQuickTimeModal({
                                      student_id: currentStudent.id,
                                      subject_id: topic.subject_id,
                                      topic_id: topic.id,
                                      subtopic_id: st.id,
                                      title: st.title,
                                    })
                                  }
                                  className="px-2 py-1 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold"
                                  title="Añadir tiempo a este subtema"
                                >
                                  ⏱️
                                </button>

                                <button
                                  type="button"
                                  onClick={() => handleDeleteSubtopic(topic.id, st.id)}
                                  className="p-1.5 rounded-lg bg-slate-100 hover:bg-rose-100 text-rose-600 text-xs font-bold"
                                  title="Borrar Subtema"
                                >
                                  🗑️
                                </button>
                              </div>
                            </div>

                            {/* NIVEL 3 DEL ÁRBOL: DESCRIPCIÓN EDITABLE + HISTORIAL DE FECHAS EN CALENDARIO */}
                            {subOpen && (
                              <div className="ml-8 mr-3 mb-3 p-3.5 rounded-xl bg-amber-50/60 border border-amber-200 space-y-3">
                                <div className="flex items-center justify-between">
                                  <span className="text-[11px] font-extrabold uppercase text-amber-900">
                                    📝 Nivel 3 • Descripción, Fórmulas y Apuntes del Subtema
                                  </span>
                                  <button
                                    type="button"
                                    onClick={() =>
                                      setEditingSubtopic({
                                        topic_id: topic.id,
                                        id: st.id,
                                        title: st.title,
                                        comprehension: st.comprehension,
                                        notes: st.notes || '',
                                      })
                                    }
                                    className="text-[11px] font-bold text-indigo-700 hover:underline"
                                  >
                                    ✏️ Abrir editor completo
                                  </button>
                                </div>

                                {/* Editor directo en línea de la Descripción */}
                                <div className="space-y-1.5">
                                  <textarea
                                    value={st.notes || ''}
                                    onChange={(e) =>
                                      updateSubtopicFieldInline(topic.id, st.id, {
                                        notes: e.target.value,
                                      })
                                    }
                                    rows={3}
                                    placeholder="Escribe aquí la descripción detallada, explicación del profesor, fórmulas o ejemplos que entran en el examen..."
                                    className="w-full rounded-xl border border-amber-300 bg-white p-2.5 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                  />
                                  <div className="flex items-center justify-between text-[10px] text-slate-500">
                                    <span>
                                      💡 Se guarda automáticamente al escribir (y sirve de chuleta en Active Recall).
                                    </span>
                                    <span>
                                      Próximo Recall: <strong>{formatHumanDate(st.next_recall_date)}</strong>
                                    </span>
                                  </div>
                                </div>

                                {/* Fechas del calendario en que se estudió este subtema */}
                                {(subSessions.length > 0 || subLogs.length > 0) && (
                                  <div className="pt-2 border-t border-amber-200/80 space-y-1">
                                    <div className="text-[10px] font-extrabold uppercase text-slate-500">
                                      📅 Fechas asociadas en el calendario:
                                    </div>
                                    <div className="flex flex-wrap gap-1.5">
                                      {subSessions.map((sess) => {
                                        const pObj = PARTICIPATION_LEVELS.find(
                                          (p) => p.id === String(sess.participation)
                                        );
                                        return (
                                          <button
                                            key={sess.id}
                                            type="button"
                                            onClick={() =>
                                              openRecapForStudent &&
                                              openRecapForStudent(
                                                currentStudent.id,
                                                sess.date,
                                                sess.period_idx || 0,
                                                sess.subject_id
                                              )
                                            }
                                            className="px-2 py-1 rounded-lg bg-white border border-slate-200 text-[11px] font-semibold text-slate-700 hover:border-indigo-400 flex items-center gap-1"
                                            title="Toca para editar el Recap de ese día"
                                          >
                                            <span>🗓️ {formatHumanDate(sess.date)}</span>
                                            {pObj && pObj.id !== 'na' && (
                                              <span>• {pObj.emoji} Nota {pObj.id}</span>
                                            )}
                                            <span className="text-indigo-600">✏️</span>
                                          </button>
                                        );
                                      })}
                                      {subLogs.map((lg) => (
                                        <span
                                          key={lg.id}
                                          className="px-2 py-1 rounded-lg bg-indigo-50 border border-indigo-200 text-[11px] font-semibold text-indigo-800"
                                        >
                                          ⏱️ {formatHumanDate(lg.date)}: +{lg.minutes}m
                                        </span>
                                      ))}
                                    </div>
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        );
                      })
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

    </div>
  );
}

// ============================================================================
// VISTA 3: ACTIVE RECALL (CON LISTA CLICABLE DE TARJETAS, TÍTULOS Y DESCRIPCIONES)
// ============================================================================
function ActiveRecallParentView({ appData, currentStudent, setParentSelectedStudent, rateSubtopicRecall }) {
  const todayStr = toDateStr();
  const [filterTab, setFilterTab] = useState('due'); // 'due' | 'weak' | 'all'
  const [selectedCardId, setSelectedCardId] = useState(null);

  const allCards = useMemo(() => {
    return appData.topics
      .filter((t) => t.student_id === currentStudent.id)
      .flatMap((t) => {
        const subj = appData.subjects.find((s) => s.id === t.subject_id);
        return t.subtopics.map((st) => ({
          ...st,
          topic_id: t.id,
          topic_title: t.title,
          subject_id: t.subject_id,
          subject_name: subj?.name || 'Asignatura',
          subject_icon: subj?.icon || '📘',
          isDue: st.next_recall_date <= todayStr,
        }));
      })
      .sort((a, b) => a.comprehension - b.comprehension);
  }, [appData, currentStudent.id, todayStr]);

  const dueCards = allCards.filter((c) => c.isDue);
  const weakCards = allCards.filter((c) => c.comprehension <= 2);
  const visibleList =
    filterTab === 'due' ? (dueCards.length > 0 ? dueCards : allCards) : filterTab === 'weak' ? weakCards : allCards;

  const card = visibleList.find((c) => c.id === selectedCardId) || visibleList[0] || null;

  return (
    <div className="space-y-4">
      <div className="bg-gradient-to-r from-amber-500 to-orange-600 text-white rounded-2xl p-4 shadow flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div>
          <h2 className="text-base font-extrabold">
            ⚡ Active Recall • Preguntando a {currentStudent.avatar} {currentStudent.name}
          </h2>
          <p className="text-xs text-amber-100">
            Pica en cualquier subtema de la lista de abajo para ver su título, tema y descripción.
          </p>
        </div>
        <div className="flex items-center gap-1.5">
          {appData.students.map((stu) => (
            <button
              key={stu.id}
              onClick={() => {
                setParentSelectedStudent(stu.id);
                setSelectedCardId(null);
              }}
              className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                currentStudent.id === stu.id
                  ? 'bg-slate-900 text-white shadow'
                  : 'bg-white/20 text-white hover:bg-white/30'
              }`}
            >
              {stu.avatar} {stu.name}
            </button>
          ))}
        </div>
      </div>

      {/* Pestañas de filtro */}
      <div className="grid grid-cols-3 gap-1.5 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200">
        <button
          onClick={() => setFilterTab('due')}
          className={`py-2 px-2 rounded-xl text-xs font-bold transition ${
            filterTab === 'due' ? 'bg-amber-500 text-slate-950 shadow-sm' : 'text-slate-600'
          }`}
        >
          🔥 Para hoy ({dueCards.length})
        </button>
        <button
          onClick={() => setFilterTab('weak')}
          className={`py-2 px-2 rounded-xl text-xs font-bold transition ${
            filterTab === 'weak' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-600'
          }`}
        >
          📕 Flojos 🔴/🟠 ({weakCards.length})
        </button>
        <button
          onClick={() => setFilterTab('all')}
          className={`py-2 px-2 rounded-xl text-xs font-bold transition ${
            filterTab === 'all' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600'
          }`}
        >
          📚 Todos ({allCards.length})
        </button>
      </div>

      {/* TARJETA DE PREGUNTA ACTIVA ARRIBA */}
      {card ? (
        <div className="bg-white rounded-2xl p-5 shadow border-2 border-amber-400 space-y-4">
          <div className="flex items-center justify-between gap-2 flex-wrap">
            <span className="text-xs font-extrabold px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-800 border border-indigo-200">
              {card.subject_icon} {card.subject_name} • 📂 Tema: {card.topic_title}
            </span>
            <span className="text-xs text-slate-500 font-semibold">
              Próximo repaso: <strong>{formatHumanDate(card.next_recall_date)}</strong>
            </span>
          </div>

          <div>
            <div className="text-[11px] font-bold uppercase text-slate-400">Subtema a preguntar:</div>
            <h3 className="text-lg font-black text-slate-900 mt-0.5">❓ "{card.title}"</h3>
          </div>

          <div className="bg-amber-50 p-3.5 rounded-xl border border-amber-200 text-xs text-slate-800 space-y-1">
            <div className="font-extrabold text-amber-950">
              💡 Descripción / Chuleta para Papá:
            </div>
            <p className="whitespace-pre-wrap">
              {card.notes || 'Pídele que te explique este subtema con sus palabras y ponga un ejemplo.'}
            </p>
          </div>

          <div>
            <div className="text-xs font-bold uppercase text-slate-500 mb-2 text-center">
              ¿Cómo ha respondido {currentStudent.name}?
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
              {[
                { r: 1, emoji: '🔄', label: 'No se acordaba', sub: 'Mañana (1d)', cls: 'bg-red-50 text-red-900 border-red-300' },
                { r: 2, emoji: '😓', label: 'Con ayuda', sub: 'En 2-3 días', cls: 'bg-amber-50 text-amber-900 border-amber-300' },
                { r: 3, emoji: '👍', label: 'Bien', sub: 'En 4-5 días', cls: 'bg-emerald-50 text-emerald-900 border-emerald-300' },
                { r: 4, emoji: '🚀', label: 'Perfecto', sub: 'En 7+ días', cls: 'bg-indigo-50 text-indigo-900 border-indigo-300' },
              ].map((btn) => (
                <button
                  key={btn.r}
                  onClick={() => {
                    rateSubtopicRecall({
                      student_id: currentStudent.id,
                      topic_id: card.topic_id,
                      subtopic_id: card.id,
                      rating: btn.r,
                      minutesSpent: 10,
                    });
                  }}
                  className={`p-3 rounded-xl border text-center transition active:scale-95 ${btn.cls}`}
                >
                  <div className="text-xl">{btn.emoji}</div>
                  <div className="font-bold text-xs mt-0.5">{btn.label}</div>
                  <div className="text-[10px] opacity-75">{btn.sub}</div>
                </button>
              ))}
            </div>
          </div>
        </div>
      ) : (
        <div className="bg-white p-8 rounded-2xl text-center text-xs text-slate-500">
          No hay subtemas en esta vista.
        </div>
      )}

      {/* LISTA COMPLETA Y CLICABLE DE TODOS LOS ACTIVE RECALL (CON TÍTULO, TEMA Y DESCRIPCIÓN) */}
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2.5">
        <div className="text-xs font-extrabold uppercase text-slate-600">
          📋 Lista de Subtemas (Pica en cualquiera para ver su pregunta y descripción):
        </div>
        <div className="space-y-2">
          {visibleList.map((item) => {
            const comp = COMPREHENSION_LEVELS.find((c) => c.id === item.comprehension);
            const isSelected = card?.id === item.id;
            return (
              <div
                key={item.id}
                onClick={() => setSelectedCardId(item.id)}
                className={`p-3 rounded-xl border cursor-pointer transition flex flex-col sm:flex-row sm:items-center justify-between gap-2 ${
                  isSelected
                    ? 'bg-amber-50/80 border-amber-400 ring-2 ring-amber-300'
                    : 'bg-slate-50 border-slate-200 hover:bg-slate-100'
                }`}
              >
                <div className="space-y-0.5 min-w-0">
                  <div className="flex items-center gap-1.5 flex-wrap">
                    <span className="text-[11px] font-bold text-indigo-700">
                      {item.subject_icon} {item.subject_name}
                    </span>
                    <span className="text-[11px] text-slate-500">• 📂 {item.topic_title}</span>
                  </div>
                  <div className="font-extrabold text-xs sm:text-sm text-slate-900">
                    ⚡ {item.title}
                  </div>
                  {item.notes && (
                    <div className="text-[11px] text-slate-600 truncate">
                      📝 {item.notes}
                    </div>
                  )}
                </div>

                <div className="flex items-center gap-2 shrink-0 self-end sm:self-center">
                  <span className="text-[10px] text-slate-500 font-semibold">
                    Recall: {formatHumanDate(item.next_recall_date)}
                  </span>
                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${comp?.badgeClass}`}>
                    {comp?.emoji} {comp?.short}
                  </span>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// VISTA 4: CALENDARIO TIPO TABLA (MENSUAL) + EXÁMENES Y NOTAS ALEMANAS (1+ A 6)
// ============================================================================
const MONTH_NAMES_ES = [
  'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
  'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
];

function ExamsAndGermanGradesView({
  initialViewMode = 'calendar',
  appData,
  activeProfile,
  currentStudent,
  setAppData,
  getExamUrgencyInfo,
  showToast,
  setActiveTab,
  openRecapForStudent,
  rateSubtopicRecall,
}) {
  // Vista activa: 'calendar' (Tabla mensual) | 'list' (Lista y expediente)
  const [viewMode, setViewMode] = useState(initialViewMode);

  useEffect(() => {
    setViewMode(initialViewMode);
  }, [initialViewMode]);

  // En Modo Padre permite ver ambos hijos ('ALL') o filtrar por uno ('stu_1' | 'stu_2')
  const [parentFilter, setParentFilter] = useState('ALL');

  // Mes visible en el calendario (año y mes 0-11)
  const todayDateObj = new Date();
  const todayStr = toDateStr(todayDateObj);
  const [calYear, setCalYear] = useState(todayDateObj.getFullYear());
  const [calMonth, setCalMonth] = useState(todayDateObj.getMonth());

  // Día seleccionado al tocar una casilla de la tabla
  const [selectedDate, setSelectedDate] = useState(todayStr);

  // Modales de Crear Examen y Calificar Nota Alemana
  const [createExamModalDate, setCreateExamModalDate] = useState(null); // string YYYY-MM-DD o null
  const [gradingExamId, setGradingExamId] = useState(null);

  // Filtrado de exámenes y tareas según perfil (Hijo individual o Modo Padre con filtro)
  const visibleStudentIds = useMemo(() => {
    if (activeProfile !== 'parent') return [currentStudent.id];
    if (parentFilter === 'ALL') return appData.students.map((s) => s.id);
    return [parentFilter];
  }, [activeProfile, currentStudent.id, parentFilter, appData.students]);

  const filteredExams = useMemo(() => {
    return appData.exams
      .filter((e) => visibleStudentIds.includes(e.student_id))
      .sort((a, b) => a.exam_date.localeCompare(b.exam_date));
  }, [appData.exams, visibleStudentIds]);

  const filteredTasks = useMemo(() => {
    return (appData.tasks || []).filter((t) => visibleStudentIds.includes(t.student_id));
  }, [appData.tasks, visibleStudentIds]);

  const [dayPopupOpen, setDayPopupOpen] = useState(false);
  const [expandedSubtopicId, setExpandedSubtopicId] = useState(null);

  const filteredSessions = useMemo(() => {
    return (appData.class_sessions || [])
      .filter((s) => visibleStudentIds.includes(s.student_id))
      .sort((a, b) => (a.period_idx || 0) - (b.period_idx || 0));
  }, [appData.class_sessions, visibleStudentIds]);

  const filteredRecalls = useMemo(() => {
    return appData.topics
      .filter((t) => visibleStudentIds.includes(t.student_id))
      .flatMap((t) => {
        const subj = appData.subjects.find((s) => s.id === t.subject_id);
        const stu = appData.students.find((st) => st.id === t.student_id);
        return (t.subtopics || []).map((sub) => ({
          ...sub,
          student_id: t.student_id,
          student_name: stu?.name || '',
          student_avatar: stu?.avatar || '👦',
          topic_id: t.id,
          topic_title: t.title,
          subject_id: t.subject_id,
          subject_name: subj?.name || 'Asignatura',
          subject_icon: subj?.icon || '📘',
        }));
      });
  }, [appData.topics, appData.subjects, appData.students, visibleStudentIds]);

  // Navegación de meses
  const goPrevMonth = () => {
    if (calMonth === 0) {
      setCalMonth(11);
      setCalYear((y) => y - 1);
    } else {
      setCalMonth((m) => m - 1);
    }
  };

  const goNextMonth = () => {
    if (calMonth === 11) {
      setCalMonth(0);
      setCalYear((y) => y + 1);
    } else {
      setCalMonth((m) => m + 1);
    }
  };

  const goToday = () => {
    const now = new Date();
    setCalYear(now.getFullYear());
    setCalMonth(now.getMonth());
    setSelectedDate(toDateStr(now));
  };

  // Construcción de las celdas de la tabla mensual (Lunes = col 0 ... Domingo = col 6)
  const calendarCells = useMemo(() => {
    const firstDayOfMonth = new Date(calYear, calMonth, 1);
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    // getDay(): 0 es Domingo, 1 es Lunes... Convertimos a Lunes=0 .. Domingo=6
    const startOffset = (firstDayOfMonth.getDay() + 6) % 7;

    const cells = [];
    // Días de relleno del mes anterior
    const prevMonthDays = new Date(calYear, calMonth, 0).getDate();
    for (let i = startOffset - 1; i >= 0; i--) {
      const dNum = prevMonthDays - i;
      const dt = new Date(calYear, calMonth - 1, dNum);
      cells.push({
        dateStr: toDateStr(dt),
        dayNum: dNum,
        isCurrentMonth: false,
      });
    }

    // Días del mes actual
    for (let dNum = 1; dNum <= daysInMonth; dNum++) {
      const dt = new Date(calYear, calMonth, dNum);
      cells.push({
        dateStr: toDateStr(dt),
        dayNum: dNum,
        isCurrentMonth: true,
      });
    }

    // Relleno final hasta completar múltiplo de 7 (35 o 42 celdas)
    const remaining = (7 - (cells.length % 7)) % 7;
    for (let i = 1; i <= remaining; i++) {
      const dt = new Date(calYear, calMonth + 1, i);
      cells.push({
        dateStr: toDateStr(dt),
        dayNum: i,
        isCurrentMonth: false,
      });
    }
    return cells;
  }, [calYear, calMonth]);

  // Estilo visual de la píldora de examen según su urgencia o si ya tiene nota
  const getExamPillStyle = (exam) => {
    if (exam.grade_label) {
      return {
        dot: '🏅',
        pillClass: 'bg-emerald-50 border-emerald-400 text-emerald-950',
        dotColor: 'bg-emerald-500',
      };
    }
    const d = diffDaysFromToday(exam.exam_date);
    if (d < 0) {
      return {
        dot: '⏳',
        pillClass: 'bg-slate-100 border-slate-300 text-slate-700',
        dotColor: 'bg-slate-400',
      };
    }
    if (d <= 1) {
      return {
        dot: '🔴',
        pillClass: 'bg-red-50 border-red-400 text-red-950 font-extrabold ring-1 ring-red-400/50',
        dotColor: 'bg-red-600',
      };
    }
    if (d <= 3) {
      return {
        dot: '🟠',
        pillClass: 'bg-orange-50 border-orange-400 text-orange-950 font-bold',
        dotColor: 'bg-orange-500',
      };
    }
    if (d <= 7) {
      return {
        dot: '🟡',
        pillClass: 'bg-amber-50 border-amber-400 text-amber-950 font-semibold',
        dotColor: 'bg-amber-500',
      };
    }
    return {
      dot: '🟢',
      pillClass: 'bg-emerald-50/70 border-emerald-300 text-emerald-900',
      dotColor: 'bg-emerald-500',
    };
  };

  // Cálculo de Nota Media Alemana (Notendurchschnitt) del alumno actual
  const studentExamsForAvg = appData.exams.filter((e) => e.student_id === currentStudent.id);
  const gradedExams = studentExamsForAvg.filter((e) => e.grade_value !== null && e.grade_value !== undefined);
  const overallAverage =
    gradedExams.length > 0
      ? (gradedExams.reduce((acc, e) => acc + Number(e.grade_value), 0) / gradedExams.length)
          .toFixed(2)
          .replace('.', ',')
      : '—';

  // Exámenes, Recaps/clases y deberes del día seleccionado en la tabla
  const selectedDayExams = filteredExams.filter((e) => e.exam_date === selectedDate);
  const selectedDayTasks = filteredTasks.filter((t) => t.due_date === selectedDate);
  const selectedDaySessions = filteredSessions.filter((s) => s.date === selectedDate);
  const selectedDayRecalls = filteredRecalls.filter((r) => r.next_recall_date === selectedDate);

  const handleDeleteSession = (sessId) => {
    setAppData((prev) => ({
      ...prev,
      lastUpdated: Date.now(),
      class_sessions: (prev.class_sessions || []).filter((s) => s.id !== sessId),
    }));
    showToast('🗑️ Registro de clase eliminado');
  };

  const handleDeleteExam = (examId) => {
    setAppData((prev) => ({
      ...prev,
      lastUpdated: Date.now(),
      exams: prev.exams.filter((e) => e.id !== examId),
    }));
    showToast('🗑️ Examen eliminado');
  };

  if (createExamModalDate) {
    return (
      <CreateExamModal
        appData={appData}
        activeProfile={activeProfile}
        currentStudent={currentStudent}
        initialDate={createExamModalDate}
        onClose={() => {
          setCreateExamModalDate(null);
          window.scrollTo(0, 0);
        }}
        onSave={(newExam) => {
          setAppData((prev) => ({
            ...prev,
            lastUpdated: Date.now(),
            exams: [newExam, ...prev.exams],
          }));
          setSelectedDate(newExam.exam_date);
          setCreateExamModalDate(null);
          window.scrollTo(0, 0);
          showToast('🎓 Examen añadido al calendario');
        }}
      />
    );
  }

  if (gradingExamId) {
    return (
      <GermanGradePickerModal
        exam={appData.exams.find((e) => e.id === gradingExamId)}
        onClose={() => {
          setGradingExamId(null);
          window.scrollTo(0, 0);
        }}
        onSave={({ grade_label, grade_value, post_exam_feeling, post_exam_comment }) => {
          setAppData((prev) => ({
            ...prev,
            lastUpdated: Date.now(),
            exams: prev.exams.map((e) =>
              e.id === gradingExamId
                ? {
                    ...e,
                    grade_label,
                    grade_value,
                    post_exam_feeling,
                    post_exam_comment,
                    updated_at: Date.now(),
                  }
                : e
            ),
          }));
          setGradingExamId(null);
          window.scrollTo(0, 0);
          showToast(`🏅 Nota ${grade_label} guardada`);
        }}
      />
    );
  }

  // PÁGINA COMPLETA DEL DÍA SELECCIONADO (SIN CALENDARIO DETRÁS, SCROLL 100% FLUIDO)
  if (dayPopupOpen) {
    return (
      <div className="bg-white w-full rounded-2xl shadow-md border border-slate-200 overflow-hidden">
        <div className="p-4 bg-slate-900 text-white flex items-center justify-between gap-2">
          <div>
            <span className="text-[10px] font-bold uppercase tracking-wider text-amber-400">
              📅 Vista Completa del Día
            </span>
            <h3 className="font-extrabold text-base">
              {getFullDayNameEs(selectedDate)} ({formatHumanDate(selectedDate)})
            </h3>
          </div>
          <button
            type="button"
            onClick={() => {
              setDayPopupOpen(false);
              window.scrollTo(0, 0);
            }}
            className="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-black shadow shrink-0"
          >
            ← Volver al Mes
          </button>
        </div>

        <div className="p-4 space-y-5">
          {/* Acciones rápidas para esta fecha */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <button
              type="button"
              onClick={() => {
                setDayPopupOpen(false);
                openRecapForStudent && openRecapForStudent(currentStudent.id, selectedDate, 0, null);
              }}
              className="py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow"
            >
              <Sparkles className="w-4 h-4" />
              <span>✨ Hacer / Editar Recap de este día</span>
            </button>
            <button
              type="button"
              onClick={() => {
                setDayPopupOpen(false);
                setCreateExamModalDate(selectedDate);
              }}
              className="py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow"
            >
              <Plus className="w-4 h-4" />
              <span>🎓 Añadir Examen en este día</span>
            </button>
          </div>

          {/* 1. ACTIVE RECALL DE ESTE DÍA */}
          <div className="space-y-2.5">
            <div className="text-xs font-extrabold uppercase text-amber-900 bg-amber-100/70 px-3 py-1.5 rounded-lg">
              ⚡ Active Recall programados en esta fecha ({selectedDayRecalls.length})
            </div>
            {selectedDayRecalls.length === 0 ? (
              <p className="text-xs text-slate-400 italic px-1">
                Ningún Active Recall programado para este día.
              </p>
            ) : (
              selectedDayRecalls.map((rc) => {
                const comp = COMPREHENSION_LEVELS.find((c) => c.id === rc.comprehension);
                return (
                  <div key={rc.id} className="p-3.5 rounded-xl bg-amber-50/80 border border-amber-300 space-y-2.5">
                    <div className="flex items-center justify-between gap-2 flex-wrap">
                      <span className="text-xs font-bold text-indigo-700">
                        {rc.student_avatar} {rc.student_name} • {rc.subject_icon} {rc.subject_name} • 📂 {rc.topic_title}
                      </span>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${comp?.badgeClass}`}>
                        {comp?.emoji} {comp?.short}
                      </span>
                    </div>
                    <div className="font-black text-base text-slate-900">
                      ⚡ "{rc.title}"
                    </div>
                    <div className="p-3 rounded-xl bg-white border border-amber-200 text-xs text-slate-800">
                      <div className="font-bold text-amber-900 mb-0.5">📝 Descripción / Explicación:</div>
                      <p className="whitespace-pre-wrap">{rc.notes || 'Sin descripción adicional.'}</p>
                    </div>
                    {rateSubtopicRecall && (
                      <div className="pt-1">
                        <div className="text-[10px] font-bold uppercase text-slate-500 mb-1.5">
                          Calificar repaso ahora mismo:
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
                          {[
                            { r: 1, emoji: '🔄', label: 'No supo (1d)', cls: 'bg-red-50 text-red-900 border-red-300' },
                            { r: 2, emoji: '😓', label: 'Dudas (2-3d)', cls: 'bg-amber-100 text-amber-900 border-amber-300' },
                            { r: 3, emoji: '👍', label: 'Bien (4-5d)', cls: 'bg-emerald-50 text-emerald-900 border-emerald-300' },
                            { r: 4, emoji: '🚀', label: 'Perfecto (7d+)', cls: 'bg-indigo-50 text-indigo-900 border-indigo-300' },
                          ].map((btn) => (
                            <button
                              key={btn.r}
                              type="button"
                              onClick={() =>
                                rateSubtopicRecall({
                                  student_id: rc.student_id,
                                  topic_id: rc.topic_id,
                                  subtopic_id: rc.id,
                                  rating: btn.r,
                                  minutesSpent: 10,
                                })
                              }
                              className={`py-2 px-2 rounded-xl border text-xs font-bold ${btn.cls}`}
                            >
                              {btn.emoji} {btn.label}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })
            )}
          </div>

          {/* 2. EXÁMENES DE ESTE DÍA */}
          <div className="space-y-2.5 pt-2 border-t border-slate-100">
            <div className="text-xs font-extrabold uppercase text-indigo-900 bg-indigo-50 px-3 py-1.5 rounded-lg">
              🎓 Exámenes en esta fecha ({selectedDayExams.length})
            </div>
            {selectedDayExams.length === 0 ? (
              <p className="text-xs text-slate-400 italic px-1">No hay exámenes este día.</p>
            ) : (
              selectedDayExams.map((ex) => {
                const subj = appData.subjects.find((s) => s.id === ex.subject_id);
                const stu = appData.students.find((s) => s.id === ex.student_id);
                const allSubs = appData.topics
                  .filter((t) => t.student_id === ex.student_id)
                  .flatMap((t) => t.subtopics.map((st) => ({ ...st, topicTitle: t.title })));
                const exSubs = allSubs.filter((st) => (ex.subtopic_ids || []).includes(st.id));

                return (
                  <div key={ex.id} className="p-3.5 rounded-xl bg-indigo-50/60 border border-indigo-200 space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-indigo-700">
                        {stu?.avatar} {stu?.name} • {subj?.icon} {subj?.name}
                      </span>
                      <button
                        type="button"
                        onClick={() => {
                          setDayPopupOpen(false);
                          setGradingExamId(ex.id);
                        }}
                        className="px-3 py-1.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs shadow-2xs"
                      >
                        {ex.grade_label ? `Nota: ${ex.grade_label}` : '🏅 Poner Nota (1+ a 6)'}
                      </button>
                    </div>
                    <div className="font-black text-base text-slate-900">{ex.title}</div>
                    {exSubs.length > 0 && (
                      <div className="space-y-1.5 pt-1">
                        <div className="text-[10px] font-bold text-slate-500 uppercase">Temas y subtemas que entran:</div>
                        {exSubs.map((st) => (
                          <div key={st.id} className="p-2.5 rounded-xl bg-white border border-slate-200 text-xs">
                            <div className="font-bold text-slate-800">📂 {st.topicTitle} ➔ 📄 {st.title}</div>
                            {st.notes && <div className="text-[11px] text-slate-600 mt-1">📝 {st.notes}</div>}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })
            )}
          </div>

          {/* 3. RECAPS / CLASES DE ESTE DÍA */}
          <div className="space-y-2.5 pt-2 border-t border-slate-100">
            <div className="text-xs font-extrabold uppercase text-emerald-900 bg-emerald-50 px-3 py-1.5 rounded-lg">
              📝 Clases y Recap registrados en esta fecha ({selectedDaySessions.length})
            </div>
            {selectedDaySessions.length === 0 ? (
              <p className="text-xs text-slate-400 italic px-1">No hay clases registradas este día.</p>
            ) : (
              selectedDaySessions.map((sess) => {
                const subj = appData.subjects.find((s) => s.id === sess.subject_id);
                const stu = appData.students.find((s) => s.id === sess.student_id);
                const pObj = PARTICIPATION_LEVELS.find((p) => p.id === String(sess.participation));
                return (
                  <div key={sess.id} className="p-3.5 rounded-xl bg-emerald-50/50 border border-emerald-200 flex items-center justify-between gap-2">
                    <div className="space-y-1 min-w-0">
                      <div className="text-xs font-bold text-slate-900">
                        {(sess.period_idx || 0) + 1}ª hora • {stu?.avatar} {subj?.icon} {subj?.name}
                      </div>
                      {sess.status === 'normal' ? (
                        <div className="text-xs text-indigo-900 font-semibold">
                          📂 {sess.topic_title} ➔ 📄 {sess.subtopic_title}
                        </div>
                      ) : (
                        <div className="text-xs font-bold text-amber-800">
                          {sess.status === 'vertretung' ? '🔄 Vertretung' : '🚫 Entfall'}
                        </div>
                      )}
                      {sess.note && <div className="text-[11px] text-slate-600 italic">📝 {sess.note}</div>}
                      {pObj && pObj.id !== 'na' && (
                        <div className="text-[11px] font-bold text-emerald-800">
                          Participación: {pObj.emoji} {pObj.label} (Nota {pObj.id})
                        </div>
                      )}
                    </div>
                    <button
                      type="button"
                      onClick={() => {
                        setDayPopupOpen(false);
                        openRecapForStudent &&
                          openRecapForStudent(sess.student_id, sess.date, sess.period_idx || 0, sess.subject_id);
                      }}
                      className="px-3 py-1.5 rounded-xl bg-white border border-indigo-200 text-indigo-700 text-xs font-bold shrink-0"
                    >
                      ✏️ Editar
                    </button>
                  </div>
                );
              })
            )}
          </div>

          {/* 4. DEBERES DE ESTE DÍA */}
          {selectedDayTasks.length > 0 && (
            <div className="space-y-2 pt-2 border-t border-slate-100">
              <div className="text-xs font-extrabold uppercase text-rose-900 bg-rose-50 px-3 py-1.5 rounded-lg">
                📌 Deberes para este día ({selectedDayTasks.length})
              </div>
              {selectedDayTasks.map((tsk) => {
                const subj = appData.subjects.find((s) => s.id === tsk.subject_id);
                return (
                  <div key={tsk.id} className="p-3 rounded-xl bg-rose-50/60 border border-rose-200 text-xs font-bold text-slate-800">
                    📌 {subj?.icon} {subj?.name}: {tsk.title}
                  </div>
                );
              })}
            </div>
          )}
        </div>

        <div className="p-4 border-t border-slate-200 bg-slate-50 flex justify-start">
          <button
            type="button"
            onClick={() => {
              setDayPopupOpen(false);
              window.scrollTo(0, 0);
            }}
            className="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold"
          >
            ← Volver al Calendario Mensual
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="space-y-4">
      {/* CABECERA: NOTENDURCHSCHNITT + CONMUTADOR TABLA VS LISTA */}
      <div className="bg-slate-900 text-white rounded-2xl p-4 shadow-md space-y-3">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-400">
              🇩🇪 Exámenes y Notas (1+ bis 6) • {currentStudent.avatar} {currentStudent.name}
            </span>
            <h2 className="text-base sm:text-lg font-extrabold mt-0.5 flex items-center gap-2">
              <span>Media Global (Notendurchschnitt):</span>
              <span className="px-2.5 py-0.5 rounded-lg bg-amber-500 text-slate-950 font-black">
                Ø {overallAverage}
              </span>
            </h2>
          </div>

          <button
            onClick={() => setCreateExamModalDate(selectedDate || todayStr)}
            className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow active:scale-95 transition shrink-0"
          >
            <Plus className="w-4 h-4" /> Nuevo Examen
          </button>
        </div>

        {/* BARRA DE ALTERNAR VISTA (CALENDARIO TABLA VS LISTA) + FILTRO MODO PADRE */}
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pt-2 border-t border-slate-800">
          <div className="grid grid-cols-2 gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
            <button
              onClick={() => {
                setViewMode('calendar');
                setActiveTab && setActiveTab('calendar');
              }}
              className={`py-1.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                viewMode === 'calendar'
                  ? 'bg-indigo-600 text-white shadow'
                  : 'text-slate-400 hover:text-white'
              }`}
            >
              <Calendar className="w-3.5 h-3.5" />
              <span>🗓️ Calendario (Tabla)</span>
            </button>
            <button
              onClick={() => {
                setViewMode('list');
                setActiveTab && setActiveTab('exams');
              }}
              className={`py-1.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                viewMode === 'list'
                  ? 'bg-indigo-600 text-white shadow'
                  : 'text-slate-400 hover:text-white'
              }`}
            >
              <FileText className="w-3.5 h-3.5" />
              <span>📋 Lista / Notas ({filteredExams.length})</span>
            </button>
          </div>

          {activeProfile === 'parent' && (
            <div className="flex items-center gap-1 bg-slate-950/60 p-1 rounded-xl border border-slate-800">
              <button
                onClick={() => setParentFilter('ALL')}
                className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                  parentFilter === 'ALL'
                    ? 'bg-amber-500 text-slate-950'
                    : 'text-slate-300 hover:bg-slate-800'
                }`}
              >
                👨‍👦‍👦 Ambos
              </button>
              {appData.students.map((stu) => (
                <button
                  key={stu.id}
                  onClick={() => setParentFilter(stu.id)}
                  className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                    parentFilter === stu.id
                      ? 'bg-amber-500 text-slate-950'
                      : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  {stu.avatar} {stu.name}
                </button>
              ))}
            </div>
          )}
        </div>
      </div>

      {viewMode === 'calendar' ? (
        <>
          {/* =================================================================
              TABLA DE CALENDARIO MENSUAL (LUNES A DOMINGO)
             ================================================================= */}
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            {/* Barra de navegación del mes */}
            <div className="p-3 sm:p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between gap-2">
              <div className="flex items-center gap-1.5">
                <button
                  onClick={goPrevMonth}
                  className="p-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold text-xs active:scale-95 transition"
                  title="Mes anterior"
                >
                  ◀
                </button>
                <button
                  onClick={goNextMonth}
                  className="p-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold text-xs active:scale-95 transition"
                  title="Mes siguiente"
                >
                  ▶
                </button>
                <h3 className="font-extrabold text-sm sm:text-base text-slate-900 ml-1">
                  {MONTH_NAMES_ES[calMonth]} {calYear}
                </h3>
              </div>

              <div className="flex items-center gap-2">
                {/* Leyenda rápida de colores de urgencia */}
                <div className="hidden md:flex items-center gap-2 text-[11px] text-slate-500 mr-2">
                  <span>🔴 ≤1d</span>
                  <span>🟠 ≤3d</span>
                  <span>🟡 ≤7d</span>
                  <span>🟢 +7d</span>
                  <span>📌 Deberes</span>
                </div>
                <button
                  onClick={goToday}
                  className="px-3 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold text-xs active:scale-95 transition"
                >
                  Ir a Hoy
                </button>
              </div>
            </div>

            {/* Cabecera de columnas Lunes a Domingo */}
            <div className="grid grid-cols-7 bg-slate-100 border-b border-slate-200 text-center">
              {['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map((dName, idx) => (

  const [examDate, setExamDate] = useState(initialDate || toDateStr());
  const [selectedSubtopics, setSelectedSubtopics] = useState([]);

  useEffect(() => {
    const subs = appData.subjects.filter((s) => s.student_id === studentId);
    setSubjectId(subs[0]?.id || '');
    setSelectedSubtopics([]);
  }, [studentId]);

  const subjectTopics = appData.topics.filter(
    (t) => t.student_id === studentId && t.subject_id === subjectId
  );

  const toggleSubtopic = (subId) => {
    setSelectedSubtopics((prev) =>
      prev.includes(subId) ? prev.filter((id) => id !== subId) : [...prev, subId]

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!title.trim()) {
      alert('Escribe el título del examen (ej. 2. Klassenarbeit Bruchrechnung)');

      .filter((t) => t.subtopics.some((st) => selectedSubtopics.includes(st.id)))

      student_id: studentId,
      subject_id: subjectId,
      title: title.trim(),
      exam_date: examDate,
      topic_ids: topicIds,
      subtopic_ids: selectedSubtopics,
      post_exam_feeling: null,
      post_exam_comment: '',
      grade_label: null,
      grade_value: null,
