// Helper para calcular estadísticas de participación y Vertretung
const computeParticipationStats = (sessions = [], studentId, subjectId = null) => {
  const filtered = (sessions || []).filter(
    (s) => s.student_id === studentId && (subjectId ? s.subject_id === subjectId : true)
  );
  const normalCount = filtered.filter((s) => s.status === 'normal').length;
  const vertretungCount = filtered.filter((s) => s.status === 'vertretung').length;
  const entfallCount = filtered.filter((s) => s.status === 'entfall').length;

  const graded = filtered
    .map((s) => PARTICIPATION_LEVELS.find((p) => p.id === String(s.participation)))
    .filter((p) => p && p.grade !== null);

  let avgGrade = null;
  let avgPct = null;
  let avgLabel = 'Sin datos';
  let avgEmoji = '⚪';

  if (graded.length > 0) {
    const sumGrade = graded.reduce((a, b) => a + b.grade, 0);
    const sumPct = graded.reduce((a, b) => a + b.pct, 0);
    avgGrade = sumGrade / graded.length;
    avgPct = Math.round(sumPct / graded.length);
    if (avgGrade <= 1.5) { avgLabel = 'Muy alta'; avgEmoji = '🌟'; }
    else if (avgGrade <= 2.5) { avgLabel = 'Alta'; avgEmoji = '🙋‍♂️'; }
    else if (avgGrade <= 3.6) { avgLabel = 'Normal'; avgEmoji = '🙂'; }
    else { avgLabel = 'Baja'; avgEmoji = '😶'; }
  }

  // Calcular racha de clases con participación Alta o Muy alta (1 o 2)
  const sortedByDate = [...filtered]
    .filter((s) => s.participation && s.participation !== 'na')
    .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.updated_at || 0) - (a.updated_at || 0));
  let highStreak = 0;
  for (const s of sortedByDate) {
    if (s.participation === '1' || s.participation === '2') highStreak++;
    else break;
  }

  return {
    totalSessions: filtered.length,
    normalCount,
    vertretungCount,
    entfallCount,
    gradedCount: graded.length,
    avgGrade,
    avgGradeStr: avgGrade !== null ? avgGrade.toFixed(1).replace('.', ',') : '—',
    avgPct,
    avgLabel,
    avgEmoji,
    highStreak,
  };
};

const toDateStr = (dateObj = new Date()) => {
  const year = dateObj.getFullYear();
  const month = String(dateObj.getMonth() + 1).padStart(2, '0');
  const day = String(dateObj.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
};

const addDaysStr = (baseDateStr, days) => {
  const [y, m, d] = baseDateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  return toDateStr(dt);
};

const diffDaysFromToday = (targetDateStr) => {
  const todayStr = toDateStr(new Date());
  const [ty, tm, td] = todayStr.split('-').map(Number);
  const [ey, em, ed] = targetDateStr.split('-').map(Number);
  const tDate = new Date(ty, tm - 1, td);
  const eDate = new Date(ey, em - 1, ed);
  return Math.round((eDate - tDate) / (1000 * 60 * 60 * 24));
};

const getWeekdayFromDateStr = (dateStr) => {
  if (!dateStr) return 1;
  const [y, m, d] = dateStr.split('-').map(Number);
  const jsDay = new Date(y, m - 1, d).getDay(); // 0=Dom, 1=Lun..6=Sab
  return jsDay >= 1 && jsDay <= 5 ? jsDay : 1;
};

const getFullDayNameEs = (dateStr) => {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(Number);
  const names = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const dt = new Date(y, m - 1, d);
  return `${names[dt.getDay()]} ${String(d).padStart(2, '0')}.${String(m).padStart(2, '0')}.${y}`;
};

const formatHumanDate = (dateStr) => {
  if (!dateStr) return '';
  const diff = diffDaysFromToday(dateStr);
  if (diff === 0) return 'Hoy';
  if (diff === -1) return 'Ayer';
  if (diff === 1) return 'Mañana';
  const [y, m, d] = dateStr.split('-');
  return `${d}.${m}.${y}`;
};

const formatMinutes = (mins = 0) => {
  if (!mins || mins <= 0) return '0m';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h > 0 && m > 0) return `${h}h ${m}m`;
  if (h > 0) return `${h}h`;
  return `${m}m`;
};

const mergeArraysById = (localArr = [], remoteArr = []) => {
  const map = new Map();
  localArr.forEach((item) => map.set(item.id, item));
  remoteArr.forEach((rem) => {
    const existing = map.get(rem.id);
    if (!existing || (rem.updated_at || 0) >= (existing.updated_at || 0)) {
      map.set(rem.id, rem);
    }
  });
  return Array.from(map.values());
};

const smartMergeTopics = (localTopics = [], remoteTopics = []) => {
  const map = new Map();
  localTopics.forEach((t) => map.set(t.id, { ...t, subtopics: [...(t.subtopics || [])] }));
  remoteTopics.forEach((remT) => {
    const existing = map.get(remT.id);
    if (!existing) {
      map.set(remT.id, remT);
    } else {
      const mergedSubtopics = mergeArraysById(existing.subtopics || [], remT.subtopics || []);
      const newerTopic = (remT.updated_at || 0) >= (existing.updated_at || 0) ? remT : existing;
      map.set(remT.id, {
        ...newerTopic,
        subtopics: mergedSubtopics,
        updated_at: Math.max(existing.updated_at || 0, remT.updated_at || 0),
      });
    }
  });
  return Array.from(map.values());
};

const smartMergeState = (localState, remoteState) => {
  if (!remoteState || !remoteState.students) return localState;
  return {
    lastUpdated: Date.now(),
    students: mergeArraysById(localState.students, remoteState.students),
    subjects: mergeArraysById(localState.subjects, remoteState.subjects),
    schedules: {
      ...localState.schedules,
      ...(remoteState.schedules || {}),
    },
    topics: smartMergeTopics(localState.topics, remoteState.topics),
    work_logs: mergeArraysById(localState.work_logs, remoteState.work_logs),
    class_sessions: mergeArraysById(localState.class_sessions || [], remoteState.class_sessions || []),
    tasks: mergeArraysById(localState.tasks, remoteState.tasks),
    exams: mergeArraysById(localState.exams, remoteState.exams),
  };
};

function App() {
  const [appData, setAppData] = useState(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        const init = createInitialData();
        return {
          ...init,
          ...parsed,
          class_sessions: parsed.class_sessions || init.class_sessions || [],
        };
      }
    } catch (e) {
      console.error(e);
    }
    return createInitialData();
  });

  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    } catch (e) {
      console.error(e);
    }
  }, [appData]);

  const [activeProfile, setActiveProfile] = useState('parent');
  const [parentSelectedStudent, setParentSelectedStudent] = useState('stu_1');
  const [activeTab, setActiveTab] = useState('today');

  const currentStudentId = activeProfile === 'parent' ? parentSelectedStudent : activeProfile;
  const currentStudent = useMemo(
    () => appData.students.find((s) => s.id === currentStudentId) || appData.students[0],
    [appData.students, currentStudentId]
  );

  const [recapWizardOpen, setRecapWizardOpen] = useState(false);
  const [recapStudentId, setRecapStudentId] = useState('stu_1');
  const [recapInitialDate, setRecapInitialDate] = useState(null);
  const [recapInitialPeriod, setRecapInitialPeriod] = useState(0);
  const [recapInitialSubjectId, setRecapInitialSubjectId] = useState(null);
  const [scheduleModalOpen, setScheduleModalOpen] = useState(false);
  const [quickTimeModal, setQuickTimeModal] = useState(null);
  const [editProfileModal, setEditProfileModal] = useState(false);
  const [toastMessage, setToastMessage] = useState(null);

  const showToast = (msg) => {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 3200);
  };

  const openRecapForStudent = (stuId, initDate = null, initPeriod = 0, initSubjId = null) => {
    setRecapStudentId(stuId || currentStudent.id);
    setRecapInitialDate(initDate || toDateStr());
    setRecapInitialPeriod(initPeriod || 0);
    setRecapInitialSubjectId(initSubjId || null);
    setRecapWizardOpen(true);
  };

  const addWorkLog = ({ student_id, subject_id, topic_id, subtopic_id = null, date, minutes, note }) => {
    const newLog = {
      id: uid('log'),
      student_id,
      subject_id,
      topic_id,
      subtopic_id,
      date: date || toDateStr(),
      minutes: Number(minutes) || 15,
      note: note || '',
      updated_at: Date.now(),
    };
    setAppData((prev) => ({
      ...prev,
      lastUpdated: Date.now(),
      work_logs: [newLog, ...prev.work_logs],
    }));
    showToast(`⏱️ +${minutes}m registrados (${formatHumanDate(date || toDateStr())})`);
  };

  const recordClassSessionOnly = ({
    student_id,
    subject_id,
    date,
    period_idx = 0,
    status = 'vertretung',
    participation = 'na',
    note = '',
  }) => {
    const now = Date.now();
    const sessDate = date || toDateStr();
    const newSess = {
      id: `sess_${student_id}_${subject_id}_${sessDate}_${period_idx}`,
      student_id,
      subject_id,
      date: sessDate,
      period_idx,
      status,
      participation,
      topic_title: '',
      subtopic_title: '',
      note: note || (status === 'vertretung' ? 'Vertretung (Sustitución sin temario)' : 'Entfall (Clase cancelada)'),
      updated_at: now,
    };
    setAppData((prev) => ({
      ...prev,
      lastUpdated: now,
      class_sessions: [
        newSess,
        ...(prev.class_sessions || []).filter((s) => s.id !== newSess.id),
      ],
    }));
    showToast(status === 'vertretung' ? '🔄 Hora marcada como Vertretung (tachada)' : '🚫 Hora marcada como Entfall (cancelada)');
  };

  const upsertTopicAndSubtopic = ({
    student_id,
    subject_id,
    topicIdOrNew,
    newTopicTitle,
    subtopicIdOrNew = 'NEW',
    subtopicTitle,
    comprehension,
    participation = '2',
    period_idx = 0,
    minutes,
    notes,
    date,
    session_id = null,
  }) => {
    const sessDate = date || toDateStr();
    const compObj = COMPREHENSION_LEVELS.find((c) => c.id === comprehension) || COMPREHENSION_LEVELS[1];
    const baseForRecall = sessDate > toDateStr() ? toDateStr() : sessDate;
    const nextRecallDate = addDaysStr(baseForRecall, compObj.days);
    const now = Date.now();
    let targetTopicId = topicIdOrNew;
    let targetSubId = subtopicIdOrNew && subtopicIdOrNew !== 'NEW' ? subtopicIdOrNew : uid('subtop');

    setAppData((prev) => {
      let updatedTopics = [...prev.topics];
      if (topicIdOrNew === 'NEW' || !topicIdOrNew) {
        targetTopicId = uid('top');
        const newSubtopic = {
          id: targetSubId,
          title: subtopicTitle.trim(),
          comprehension,
          next_recall_date: nextRecallDate,
          interval_days: compObj.days,
          notes: notes || '',
          created_at: sessDate,
          review_count: 0,
          updated_at: now,
        };
        updatedTopics.unshift({
          id: targetTopicId,
          student_id,
          subject_id,
          title: newTopicTitle.trim(),
          updated_at: now,
          subtopics: [newSubtopic],
        });
      } else {
        updatedTopics = updatedTopics.map((t) => {
          if (t.id !== topicIdOrNew) return t;
          const existsSub = t.subtopics.some((st) => st.id === targetSubId);
          let newSubs;
          if (existsSub) {
            newSubs = t.subtopics.map((st) =>
              st.id !== targetSubId
                ? st
                : {
                    ...st,
                    title: subtopicTitle.trim() || st.title,
                    comprehension,
                    next_recall_date: nextRecallDate,
                    interval_days: compObj.days,
                    notes: notes !== undefined ? notes : st.notes,
                    updated_at: now,
                  }
            );
          } else {
            newSubs = [
              ...t.subtopics,
              {
                id: targetSubId,
                title: subtopicTitle.trim(),
                comprehension,
                next_recall_date: nextRecallDate,
                interval_days: compObj.days,
                notes: notes || '',
                created_at: sessDate,
                review_count: 0,
                updated_at: now,
              },
            ];
          }
          return {
            ...t,
            updated_at: now,
            subtopics: newSubs,
          };
        });
      }

      const resolvedTopicObj = updatedTopics.find((t) => t.id === targetTopicId);
      const resolvedSubObj = resolvedTopicObj?.subtopics.find((st) => st.id === targetSubId);
      const finalSubTitle = resolvedSubObj ? resolvedSubObj.title : subtopicTitle.trim();

      const targetSessId = session_id || `sess_${student_id}_${subject_id}_${sessDate}_${period_idx}`;
      const updatedLogs = [...prev.work_logs];
      if (Number(minutes) > 0) {
        const logId = `log_${targetSessId}`;
        const existingLogIdx = updatedLogs.findIndex((l) => l.id === logId);
        const logEntry = {
          id: logId,
          student_id,
          subject_id,
          topic_id: targetTopicId,
          subtopic_id: targetSubId,
          date: sessDate,
          minutes: Number(minutes),
          note: notes ? `Recap: ${finalSubTitle}` : `Recap: ${finalSubTitle}`,
          updated_at: now,
        };
        if (existingLogIdx >= 0) updatedLogs[existingLogIdx] = logEntry;
        else updatedLogs.unshift(logEntry);
      }

      const newSess = {
        id: targetSessId,
        student_id,
        subject_id,
        date: sessDate,
        period_idx,
        status: 'normal',
        participation: participation || '2',
        topic_id: targetTopicId,
        subtopic_id: targetSubId,
        topic_title: resolvedTopicObj ? resolvedTopicObj.title : (newTopicTitle || ''),
        subtopic_title: finalSubTitle,
        minutes: Number(minutes) || 0,
        note: notes || '',
        updated_at: now,
      };

      return {
        ...prev,
        lastUpdated: now,
        topics: updatedTopics,
        work_logs: updatedLogs,
        class_sessions: [
          newSess,
          ...(prev.class_sessions || []).filter((s) => s.id !== targetSessId),
        ],
      };
    });

    showToast(`✅ Recap del ${formatHumanDate(sessDate)} guardado`);
  };

  const rateSubtopicRecall = ({ student_id, topic_id, subtopic_id, rating, minutesSpent }) => {
    const today = toDateStr();
    const now = Date.now();

    setAppData((prev) => {
      let subjectIdForLog = null;
      const updatedTopics = prev.topics.map((t) => {
        if (t.id !== topic_id) return t;
        subjectIdForLog = t.subject_id;
        return {
          ...t,
          updated_at: now,
          subtopics: t.subtopics.map((st) => {
            if (st.id !== subtopic_id) return st;
            const prevInterval = st.interval_days || 1;
            let nextDays = 1;
            if (rating === 1) nextDays = 1;
            if (rating === 2) nextDays = Math.max(2, Math.round(prevInterval * 1.2));
            if (rating === 3) nextDays = Math.max(4, Math.round(prevInterval * 1.8));
            if (rating === 4) nextDays = Math.max(7, Math.round(prevInterval * 2.5));

            return {
              ...st,
              comprehension: rating,
              interval_days: nextDays,
              next_recall_date: addDaysStr(today, nextDays),
              review_count: (st.review_count || 0) + 1,
              updated_at: now,
            };
          }),
        };
      });

      const updatedLogs = [...prev.work_logs];
      if (Number(minutesSpent) > 0 && subjectIdForLog) {
        updatedLogs.unshift({
          id: uid('log'),
          student_id,
          subject_id: subjectIdForLog,
          topic_id,
          subtopic_id,
          date: today,
          minutes: Number(minutesSpent),
          note: 'Sesión de Active Recall con Papá',
          updated_at: now,
        });
      }

      return {
        ...prev,
        lastUpdated: now,
        topics: updatedTopics,
        work_logs: updatedLogs,
      };
    });

    showToast('⚡ Repaso registrado y próximo intervalo actualizado');
  };

  const getExamUrgencyInfo = (examDateStr) => {
    const daysLeft = diffDaysFromToday(examDateStr);
    if (daysLeft < 0) {
      return { daysLeft, level: 'past', badge: 'Pasado', bannerColor: 'bg-slate-100 border-slate-300 text-slate-700', alertText: `Realizado hace ${Math.abs(daysLeft)} día(s)` };
    }
    if (daysLeft === 0) {
      return { daysLeft, level: 'today', badge: '🔴 ¡HOY ES EL EXAMEN!', bannerColor: 'bg-red-600 text-white border-red-700 animate-pulse', alertText: 'Alerta máxima: Hoy es este examen.' };
    }
    if (daysLeft === 1) {
      return { daysLeft, level: 'tomorrow', badge: '🔴 ¡MAÑANA ES EL EXAMEN!', bannerColor: 'bg-red-500 text-white border-red-600', alertText: 'Alerta máxima: Repaso final hoy.' };
    }
    if (daysLeft <= 3) {
      return { daysLeft, level: '3days', badge: `🟠 Faltan ${daysLeft} días`, bannerColor: 'bg-orange-500 text-white border-orange-600', alertText: 'Prioridad total en Active Recall.' };

    if (daysLeft <= 7) {

    }

    }
    return { daysLeft, level: 'later', badge: `🗓️ En ${daysLeft} días`, bannerColor: 'bg-slate-50 text-slate-700 border-slate-200', alertText: 'Programado en calendario.' };
  };

  return (
    <div className="min-h-screen bg-slate-100 text-slate-900 pb-24 select-none">
      {/* BARRA SUPERIOR MULTI-PERFIL STICKY */}

        <div className="max-w-5xl mx-auto px-3 py-2.5">
          <div className="flex items-center justify-between gap-2 mb-2">
            <div className="flex items-center gap-2">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-emerald-500 flex items-center justify-center font-bold text-lg shadow">
                🎒
              </div>
              <div>
                <h1 className="font-bold text-sm sm:text-base leading-tight tracking-tight flex items-center gap-1.5">
                  SchulFamilie
                  <span className="text-[10px] font-semibold uppercase px-1.5 py-0.5 rounded bg-indigo-500/30 text-indigo-200 border border-indigo-400/30">
                    Local-First
                  </span>
                </h1>
                <p className="text-[11px] text-slate-400 leading-none mt-0.5">
                  Enrique &amp; Fernando • Stundenplan &amp; Recall
                </p>
              </div>
            </div>

            <div className="flex items-center gap-1.5">
              <button
                onClick={() => setScheduleModalOpen(true)}
                className="px-2.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white flex items-center gap-1 shadow-sm active:scale-95 transition"
                title="Configurar Horario Escolar (Stundenplan)"
              >
                <Calendar className="w-3.5 h-3.5" />
                <span>Horario</span>
              </button>
              <button
                onClick={() => setEditProfileModal(true)}
                className="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 active:scale-95 transition"
                title="Ajustes de Cursos y Asignaturas"
              >
                <Settings className="w-4 h-4" />
              </button>
            </div>
          </div>

          {/* SELECTOR DE PERFIL: ENRIQUE / FERNANDO / MODO PADRE */}
          <div className="grid grid-cols-3 gap-1.5 bg-slate-950/70 p-1 rounded-xl border border-slate-800">
            {appData.students.map((stu) => {
              const isSelected = activeProfile === stu.id;
              return (
                <button
                  key={stu.id}
                  onClick={() => {
                    setActiveProfile(stu.id);
                    setParentSelectedStudent(stu.id);
                  }}
                  className={`flex items-center justify-center gap-1.5 py-2 px-2 rounded-lg text-xs font-semibold transition-all active:scale-95 ${
                    isSelected
                      ? 'bg-indigo-600 text-white shadow-md ring-1 ring-indigo-400'
                      : 'text-slate-300 hover:bg-slate-800/70'
                  }`}

                }}
                className={`flex flex-col items-center justify-center py-2 px-1 transition-all active:scale-95 ${
                  isActive ? 'text-indigo-600 font-bold' : 'text-slate-500 hover:text-slate-800 font-medium'
                }`}
              >
                <div
                  className={`p-1.5 rounded-xl transition-all ${
                    isActive
                      ? item.highlight ? 'bg-amber-500 text-white shadow-sm' : 'bg-indigo-100 text-indigo-700'
                      : item.highlight ? 'bg-amber-50 text-amber-700' : ''
                  }`}
                >
                  <Icon className="w-5 h-5" />
                </div>
                <span className="text-[11px] mt-0.5 leading-tight truncate">
                  {item.label}
                </span>
              </button>
            );
          })}
        </div>
      </nav>

      {/* TOAST FLOTANTE */}
      {toastMessage && (
        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-full shadow-2xl border border-slate-700 text-xs sm:text-sm font-bold flex items-center gap-2 animate-bounce">
          <span>{toastMessage}</span>
        </div>
      )}
    </div>
  );
}

// MODAL: CONFIGURADOR DE HORARIO SEMANAL EDITABLE POR ALUMNO
// ============================================================================
function ScheduleConfigModal({ appData, currentStudent, setAppData, onClose, showToast }) {
  const [selectedStuId, setSelectedStuId] = useState(currentStudent.id);
  const [selectedDay, setSelectedDay] = useState(1); // 1 = Lunes .. 5 = Viernes

  const activeStudent = appData.students.find((s) => s.id === selectedStuId) || appData.students[0];
  const studentSubjects = appData.subjects.filter((s) => s.student_id === selectedStuId);
  const dayScheduleIds = (appData.schedules[selectedStuId] && appData.schedules[selectedStuId][selectedDay]) || [];

  const addSubjectToDay = (subjId) => {
    setAppData((prev) => {
      const stuSched = prev.schedules[selectedStuId] || {};
      const currentList = stuSched[selectedDay] || [];
      return {
        ...prev,
        lastUpdated: Date.now(),
        schedules: {
          ...prev.schedules,
          [selectedStuId]: {
            ...stuSched,
            [selectedDay]: [...currentList, subjId],
          },
        },
      };
    });
    showToast('Asignatura añadida al horario');
  };

  const removeSubjectAtIndex = (idx) => {
    setAppData((prev) => {
      const stuSched = prev.schedules[selectedStuId] || {};
      const currentList = stuSched[selectedDay] || [];
      return {
        ...prev,
        lastUpdated: Date.now(),
        schedules: {
          ...prev.schedules,
          [selectedStuId]: {
            ...stuSched,
            [selectedDay]: currentList.filter((_, i) => i !== idx),
          },
        },
      };
    });
    showToast('Asignatura eliminada del día');
  };

  return (
    <div className="bg-white w-full rounded-2xl shadow-md border border-slate-200 overflow-hidden">
      <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
        <div>
          <span className="text-[10px] uppercase font-bold text-indigo-300">
            📅 Stundenplan (Horario Escolar)
          </span>
          <h3 className="font-bold text-base">Configurar Clases de la Semana</h3>
        </div>
        <button
          onClick={onClose}
          className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold flex items-center gap-1"
        >
          ← Volver
        </button>
      </div>

      <div className="p-4 space-y-4">
          {/* SELECTOR DE ALUMNO: ENRIQUE O FERNANDO */}
          <div>
            <label className="block text-xs font-extrabold uppercase text-slate-500 mb-1.5">
              1. Selecciona a qué hijo configuras el horario:
            </label>
            <div className="grid grid-cols-2 gap-2">
              {appData.students.map((stu) => (
                <button
                  key={stu.id}
                  onClick={() => setSelectedStuId(stu.id)}
                  className={`py-2 px-3 rounded-xl text-xs font-bold border flex items-center justify-center gap-1.5 transition ${
                    selectedStuId === stu.id
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow'
                      : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                  }`}
                >
                  <span className="text-base">{stu.avatar}</span>
                  <span>{stu.name}</span>
                  <span className="text-[10px] opacity-75">({stu.gradeLevel.split(' ')[0]})</span>
                </button>
              ))}
            </div>
          </div>

          {/* SELECTOR DE DÍA (LUNES A VIERNES) */}
          <div>
            <label className="block text-xs font-extrabold uppercase text-slate-500 mb-1.5">
              2. Día de la semana:
            </label>
            <div className="grid grid-cols-5 gap-1 bg-slate-100 p-1 rounded-xl">
              {WEEKDAYS.map((d) => (
                <button
                  key={d.key}
                  onClick={() => setSelectedDay(d.key)}
                  className={`py-2 rounded-lg text-xs font-extrabold transition ${
                    selectedDay === d.key
                      ? 'bg-white text-indigo-700 shadow-sm'
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <div>{d.short}</div>
                  <div className="text-[9px] font-normal opacity-70">{d.de.slice(0, 2)}</div>
                </button>
              ))}
            </div>
          </div>

          {/* LISTA DE CLASES CONFIGURADAS ESE DÍA */}
          <div>
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs font-extrabold uppercase text-slate-700">
                Clases del {WEEKDAYS.find((w) => w.key === selectedDay)?.name} ({activeStudent.name}):
              </span>
              <span className="text-[11px] text-slate-400">
                {dayScheduleIds.length} hora(s)
              </span>
            </div>

            {dayScheduleIds.length === 0 ? (
              <div className="text-center py-4 bg-slate-50 border border-dashed border-slate-300 rounded-xl text-xs text-slate-500">
                No hay asignaturas añadidas este día. Pulsa en las asignaturas de abajo para agregarlas.
              </div>
            ) : (
              <div className="space-y-1.5">
                {dayScheduleIds.map((subId, idx) => {
                  const subj = appData.subjects.find((s) => s.id === subId);
                  return (
                    <div
                      key={`${subId}_${idx}`}
                      className="flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-200 text-xs"
                    >
                      <div className="flex items-center gap-2">
                        <span className="w-5 h-5 rounded-full bg-indigo-100 text-indigo-800 font-bold flex items-center justify-center text-[10px]">
                          {idx + 1}
                        </span>
                        <span className="font-bold text-slate-800">
                          {subj?.icon} {subj?.name || 'Asignatura'}
                        </span>
                      </div>
                      <button
                        onClick={() => removeSubjectAtIndex(idx)}
                        className="text-red-500 hover:text-red-700 p-1 text-xs font-bold"
                        title="Quitar esta hora"
                      >
                        ✕
                      </button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* AÑADIR ASIGNATURAS CON UN TOQUE */}
          <div>
            <label className="block text-xs font-extrabold uppercase text-slate-700 mb-1.5">
              ➕ Toca para añadir al {WEEKDAYS.find((w) => w.key === selectedDay)?.name}:
            </label>
            <div className="flex flex-wrap gap-1.5">
              {studentSubjects.map((s) => (
                <button
                  key={s.id}
                  onClick={() => addSubjectToDay(s.id)}
                  className="px-3 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-900 border border-indigo-200 text-xs font-bold flex items-center gap-1 active:scale-95 transition"
                >
                  <span>{s.icon}</span>
                  <span>{s.name}</span>
                  <span className="text-indigo-400 font-black">+</span>
                </button>
              ))}
            </div>
          </div>
        </div>

        <div className="p-4 border-t border-slate-200 bg-slate-50 flex justify-between items-center">
          <span className="text-[11px] text-slate-500">Se guarda automáticamente</span>
          <button
            onClick={() => {
              showToast('📅 Horario actualizado correctamente');
              onClose();
            }}
            className="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shadow"
          >
            ← Volver y Guardar
          </button>
        </div>
    </div>
  );
}

function EditProfilesAndSubjectsModal({ appData, setAppData, onClose, showToast }) {
  const [stu1Name, setStu1Name] = useState(appData.students[0]?.name || 'Enrique');
  const [stu1Grade, setStu1Grade] = useState(appData.students[0]?.gradeLevel || '7. Klasse (Gymnasium)');
  const [stu2Name, setStu2Name] = useState(appData.students[1]?.name || 'Fernando');
  const [stu2Grade, setStu2Grade] = useState(appData.students[1]?.gradeLevel || '5. Klasse (Realschule)');

  const [newSubjStudent, setNewSubjStudent] = useState('stu_1');
  const [newSubjName, setNewSubjName] = useState('');
  const [newSubjIcon, setNewSubjIcon] = useState('📘');

  const saveProfiles = () => {
    setAppData((prev) => ({
      ...prev,
      lastUpdated: Date.now(),
      students: prev.students.map((s, idx) =>
        idx === 0
          ? { ...s, name: stu1Name.trim() || 'Enrique', gradeLevel: stu1Grade, updated_at: Date.now() }
          : { ...s, name: stu2Name.trim() || 'Fernando', gradeLevel: stu2Grade, updated_at: Date.now() }
      ),
    }));
    showToast('👥 Perfiles y cursos actualizados');
    onClose();
  };

  const handleAddSubject = () => {
    if (!newSubjName.trim()) return;
    const newSub = {
      id: uid('sub'),
      student_id: newSubjStudent,
      name: newSubjName.trim(),
      icon: newSubjIcon || '📘',
      color: 'bg-indigo-600',
      updated_at: Date.now(),
    };
    setAppData((prev) => ({
      ...prev,
      lastUpdated: Date.now(),
      subjects: [...prev.subjects, newSub],
    }));
    setNewSubjName('');
    showToast(`📚 Asignatura ${newSub.name} creada`);
  };

  const handleDeleteSubject = (subjId) => {
    setAppData((prev) => ({
      ...prev,
      lastUpdated: Date.now(),
      subjects: prev.subjects.filter((s) => s.id !== subjId),
    }));
    showToast('Asignatura eliminada');
  };

  return (
    <div className="bg-white w-full rounded-2xl shadow-md border border-slate-200 overflow-hidden">

        <div>
          <span className="text-[10px] uppercase font-bold text-amber-400">⚙️ Cursos &amp; Asignaturas</span>

        </div>
        <button
          onClick={onClose}
          className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold"
        >
          ← Volver
        </button>
      </div>

      <div className="p-4 space-y-4">

              👦🏻 Alumno 1 (Nombre y Curso):
            </div>

                type="text"

              />
              <input

                className="rounded-xl border border-slate-300 px-3 py-1.5 text-xs font-semibold"
              />
            </div>
          </div>

          {/* HIJO 2: FERNANDO */}

            <div className="text-xs font-bold text-emerald-700 flex items-center gap-1">
              👦🏼 Alumno 2 (Nombre y Curso):

              <input
                type="text"

              ➕ Añadir Nueva Asignatura (ej. Physik, Chemie, Französisch...):
            </div>
            <div className="grid grid-cols-3 gap-1.5">
              <select
                value={newSubjStudent}
                onChange={(e) => setNewSubjStudent(e.target.value)}
                className="rounded-xl border border-indigo-200 px-2 py-1.5 text-xs font-bold bg-white"
              >
                {appData.students.map((s) => (
                  <option key={s.id} value={s.id}>Para {s.name}</option>
                ))}
              </select>
              <input
                type="text"
                value={newSubjIcon}
                onChange={(e) => setNewSubjIcon(e.target.value)}
                placeholder="Emoji ⚗️"
                className="rounded-xl border border-indigo-200 px-2 py-1.5 text-xs text-center bg-white"
              />
              <input
                type="text"
                value={newSubjName}
                onChange={(e) => setNewSubjName(e.target.value)}
                placeholder="Ej. Physik"
                className="rounded-xl border border-indigo-200 px-2 py-1.5 text-xs bg-white font-semibold"
              />

            <button
              type="button"
              onClick={handleAddSubject}
              className="w-full py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-sm"

              + Crear Asignatura

            <div className="text-xs font-bold text-slate-600 mb-2">
              ✏️ Editar o borrar asignaturas existentes:
            </div>

              {appData.subjects.map((subj) => {
                const owner = appData.students.find((s) => s.id === subj.student_id);
                return (
                  <div key={subj.id} className="flex items-center gap-1.5 p-1.5 rounded-xl bg-slate-50 border border-slate-200 text-xs">
                    <input
                      type="text"
                      value={subj.icon}
                      onChange={(e) => {
                        const val = e.target.value;
                        setAppData((prev) => ({
                          ...prev,
                          lastUpdated: Date.now(),
                          subjects: prev.subjects.map((s) =>
                            s.id === subj.id ? { ...s, icon: val, updated_at: Date.now() } : s
                          ),
                        }));
                      }}
                      className="w-9 text-center rounded-lg border border-slate-300 bg-white py-1 text-xs"
                      title="Editar icono"
                    />
                    <input
                      type="text"
                      value={subj.name}
                      onChange={(e) => {
                        const val = e.target.value;
                        setAppData((prev) => ({
                          ...prev,
                          lastUpdated: Date.now(),
                          subjects: prev.subjects.map((s) =>
                            s.id === subj.id ? { ...s, name: val, updated_at: Date.now() } : s
                          ),
                        }));
                      }}
                      className="flex-1 rounded-lg border border-slate-300 bg-white px-2 py-1 text-xs font-bold text-slate-800"
                      title="Editar nombre de la asignatura"
                    />
                    <span className="text-[10px] text-slate-400 shrink-0">{owner?.name}</span>
                    <button
                      type="button"
                      onClick={() => handleDeleteSubject(subj.id)}
                      className="text-red-500 hover:text-red-700 px-1.5 font-bold"
                      title="Eliminar asignatura"
                    >
                      🗑️
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        <div className="p-4 border-t border-slate-200 bg-slate-50 flex items-center justify-between gap-2">
          <button
            type="button"
            onClick={async () => {
              if ("serviceWorker" in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                for (const r of regs) await r.unregister();
              }
              if ("caches" in window) {
                const keys = await caches.keys();
                for (const k of keys) await caches.delete(k);
              }
              window.location.reload(true);
            }}
            className="px-3 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 text-[11px] font-bold"
            title="Descarga los últimos cambios visuales manteniendo todos tus datos guardados"
          >
            🔄 Refrescar App (sin borrar datos)
          </button>
          <div className="flex items-center gap-2">
            <button onClick={onClose} className="px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-bold">← Volver</button>
            <button onClick={saveProfiles} className="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow">Guardar Cambios</button>
          </div>
        </div>
    </div>
  );
}

// ============================================================================
// VISTA 1: HOY / RECAP DIARIO Y SUPERVISOR PADRE (CON INSPECTOR CLICABLE DETALLADO)
// ============================================================================
function TodayAndParentDashboard({
  appData,
  activeProfile,
  currentStudent,
  setParentSelectedStudent,
  openRecapForStudent,
  setScheduleModalOpen,
  setActiveTab,
  setQuickTimeModal,
  getExamUrgencyInfo,
  setAppData,
  showToast,
  rateSubtopicRecall,
}) {
  const todayStr = toDateStr();
  const yesterdayStr = addDaysStr(todayStr, -1);
  const jsDay = new Date().getDay();
  const activeWeekday = jsDay >= 1 && jsDay <= 5 ? jsDay : 1;
  const [selectedDayKey, setSelectedDayKey] = useState(activeWeekday);

  // Modal inspector cuando picas en cualquier indicador (Recall, Flojos, Horas, Participación)
  const [inspectorModal, setInspectorModal] = useState(null); // { type: 'recall'|'weak'|'hours'|'participation', studentId }

  const studentScheduleIds =
    (appData.schedules[currentStudent.id] && appData.schedules[currentStudent.id][selectedDayKey]) || [];
  const todaySubjects = studentScheduleIds
    .map((id) => appData.subjects.find((s) => s.id === id))
    .filter(Boolean);

  const upcomingExams = appData.exams
    .filter((ex) => ex.student_id === currentStudent.id && diffDaysFromToday(ex.exam_date) >= 0)
    .sort((a, b) => a.exam_date.localeCompare(b.exam_date));

  const getStudentSubtopicsEnriched = (stuId) => {
    return appData.topics
      .filter((t) => t.student_id === stuId)
      .flatMap((t) => {
        const subj = appData.subjects.find((s) => s.id === t.subject_id);
        return t.subtopics.map((st) => ({
          ...st,
          topic_id: t.id,
          topic_title: t.title,
          subject_id: t.subject_id,
          subject_name: subj?.name || 'Asignatura',
          subject_icon: subj?.icon || '📘',
        }));
      });
  };

  const getStudentQuickStats = (stuId) => {
    const todayMins = appData.work_logs
      .filter((l) => l.student_id === stuId && l.date === todayStr)
      .reduce((a, b) => a + b.minutes, 0);
    const yesterdayMins = appData.work_logs
      .filter((l) => l.student_id === stuId && l.date === yesterdayStr)
      .reduce((a, b) => a + b.minutes, 0);
    const allSubs = getStudentSubtopicsEnriched(stuId);
    const dueRecallList = allSubs.filter((st) => st.next_recall_date <= todayStr);
    const weakList = allSubs.filter((st) => st.comprehension <= 2);
    const nextExam = appData.exams
      .filter((e) => e.student_id === stuId && diffDaysFromToday(e.exam_date) >= 0)
      .sort((a, b) => a.exam_date.localeCompare(b.exam_date))[0];
    const partStats = computeParticipationStats(appData.class_sessions || [], stuId);
    return {
      todayMins,
      yesterdayMins,
      dueRecall: dueRecallList.length,
      dueRecallList,
      weakCount: weakList.length,
      weakList,
      nextExam,
      partStats,
    };
  };

  const studentTodaySessions = (appData.class_sessions || []).filter(
    (s) => s.student_id === currentStudent.id && s.date === todayStr
  );

  const curStats = getStudentQuickStats(currentStudent.id);

  if (inspectorModal) {
    return (
      <QuickDetailInspectorModal
        appData={appData}
        inspector={inspectorModal}
        onClose={() => {
          setInspectorModal(null);
          window.scrollTo(0, 0);
        }}
        rateSubtopicRecall={rateSubtopicRecall}
        openRecapForStudent={openRecapForStudent}
        setActiveTab={setActiveTab}
      />
    );
  }

  return (
    <div className="space-y-4">
      {/* MODO PADRE: COMPARATIVA ENRIQUE VS FERNANDO (CAJAS CLICABLES PARA VER DETALLE) */}
      {activeProfile === 'parent' && (
        <div className="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 text-white rounded-2xl p-4 shadow-md border border-slate-700">
          <div className="flex items-center justify-between mb-3">
            <div>
              <span className="text-[11px] uppercase tracking-wider font-bold text-amber-400 flex items-center gap-1">
                <Users className="w-3.5 h-3.5" /> Panel Familiar del Padre (Pica en cualquier dato para ver qué es)
              </span>
              <h2 className="text-base sm:text-lg font-bold">
                Seguimiento Hoy ({formatHumanDate(todayStr)})
              </h2>
            </div>
            <button
              onClick={() => setActiveTab('recall')}
              className="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs flex items-center gap-1 shadow"
            >
              <Brain className="w-4 h-4" /> Ir a Recall
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {appData.students.map((stu) => {
              const st = getStudentQuickStats(stu.id);
              const isFocused = currentStudent.id === stu.id;
              return (
                <div
                  key={stu.id}
                  onClick={() => setParentSelectedStudent(stu.id)}
                  className={`cursor-pointer rounded-xl p-3 transition border ${
                    isFocused
                      ? 'bg-white/15 border-amber-400 ring-1 ring-amber-400/50'
                      : 'bg-white/5 border-white/10 hover:bg-white/10'
                  }`}
                >
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">{stu.avatar}</span>
                      <div>
                        <h3 className="font-bold text-sm leading-tight">{stu.name}</h3>
                        <p className="text-[11px] text-slate-300">{stu.gradeLevel}</p>
                      </div>
                    </div>
                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        openRecapForStudent(stu.id, todayStr, 0, null);
                      }}
                      className="px-2.5 py-1 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-white text-[11px] font-semibold flex items-center gap-1"
                    >
                      <Sparkles className="w-3 h-3" /> Recap
                    </button>
                  </div>

                  {/* 4 CAJAS CLICABLES CON TÍTULO Y DETALLE */}
                  <div className="grid grid-cols-4 gap-1 text-center my-2">
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        setParentSelectedStudent(stu.id);
                        setInspectorModal({ type: 'hours', studentId: stu.id });
                      }}
                      className="bg-slate-900/70 hover:bg-slate-900 rounded-lg p-1.5 border border-white/10 transition active:scale-95"
                    >
                      <div className="text-xs font-bold text-emerald-400">{formatMinutes(st.todayMins)}</div>
                      <div className="text-[9px] text-slate-300 underline">Hoy  🔍</div>
                    </button>

                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        setParentSelectedStudent(stu.id);
                        setInspectorModal({ type: 'recall', studentId: stu.id });
                      }}
                      className="bg-slate-900/70 hover:bg-slate-900 rounded-lg p-1.5 border border-white/10 transition active:scale-95"
                    >
                      <div className="text-xs font-bold text-amber-400">⚡ {st.dueRecall}</div>
                      <div className="text-[9px] text-slate-300 underline">Recall 🔍</div>
                    </button>

                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        setParentSelectedStudent(stu.id);
                        setInspectorModal({ type: 'weak', studentId: stu.id });
                      }}
                      className="bg-slate-900/70 hover:bg-slate-900 rounded-lg p-1.5 border border-white/10 transition active:scale-95"
                    >
                      <div className="text-xs font-bold text-rose-400">🔴 {st.weakCount}</div>
                      <div className="text-[9px] text-slate-300 underline">Flojos 🔍</div>
                    </button>

                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        setParentSelectedStudent(stu.id);
                        setInspectorModal({ type: 'participation', studentId: stu.id });
                      }}
                      className="bg-slate-900/70 hover:bg-slate-900 rounded-lg p-1.5 border border-white/10 transition active:scale-95"
                    >
                      <div className="text-xs font-bold text-sky-300">
                        {st.partStats.avgEmoji} Ø {st.partStats.avgGradeStr}
                      </div>
                      <div className="text-[9px] text-slate-300 underline">Particip. 🔍</div>
                    </button>
                  </div>

                  <div className="flex items-center justify-between gap-1 text-[11px]">
                    {st.nextExam ? (
                      <button
                        type="button"
                        onClick={(e) => {
                          e.stopPropagation();
                          setParentSelectedStudent(stu.id);
                          setActiveTab('calendar');
                        }}
                        className="flex-1 bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/30 text-amber-200 px-2 py-1 rounded-lg flex items-center justify-between truncate text-left"
                      >
                        <span className="truncate">🎓 {st.nextExam.title}</span>
                        <span className="font-bold ml-1 shrink-0">en {diffDaysFromToday(st.nextExam.exam_date)}d →</span>
                      </button>
                    ) : (
                      <div className="text-slate-400 italic">Sin exámenes próximos</div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ACCESO DIRECTO A LOS ACTIVE RECALL DE HOY (CON TÍTULOS VISIBLES Y CLICABLES) */}
      {curStats.dueRecallList.length > 0 && (
        <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl p-3.5 shadow-sm space-y-2">
          <div className="flex items-center justify-between">
            <span className="text-xs font-extrabold text-amber-950 flex items-center gap-1.5">
              ⚡ Active Recall pendientes para hoy ({curStats.dueRecallList.length}) • {currentStudent.name}
            </span>
            <button
              onClick={() => setActiveTab('recall')}
              className="text-xs font-bold text-amber-900 underline"
            >
              Abrir modo preguntador →
            </button>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            {curStats.dueRecallList.map((item) => {
              const comp = COMPREHENSION_LEVELS.find((c) => c.id === item.comprehension);
              return (
                <div
                  key={item.id}
                  onClick={() => setInspectorModal({ type: 'single_recall', studentId: currentStudent.id, item })}
                  className="p-2.5 rounded-xl bg-white border border-amber-300 hover:border-indigo-500 cursor-pointer transition flex items-center justify-between gap-2 shadow-2xs"
                >
                  <div className="min-w-0">
                    <div className="text-[10px] font-bold text-indigo-600 truncate">
                      {item.subject_icon} {item.subject_name} • 📂 {item.topic_title}
                    </div>
                    <div className="text-xs font-extrabold text-slate-900 truncate mt-0.5">
                      ⚡ {item.title}
                    </div>
                    {item.notes && (
                      <div className="text-[10px] text-slate-500 truncate mt-0.5">
                        📝 {item.notes}
                      </div>
                    )}
                  </div>
                  <div className="flex items-center gap-1 shrink-0">
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${comp?.badgeClass}`}>
                      {comp?.emoji}
                    </span>
                    <ChevronRight className="w-4 h-4 text-slate-400" />
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* RUTINA DE TARDE: RECAP GUIADO SEGÚN EL HORARIO */}
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-indigo-100">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
          <div>
            <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 text-xs font-bold mb-1">
              <Sparkles className="w-3.5 h-3.5" /> Recap Diario • {currentStudent.avatar} {currentStudent.name}
            </div>
            <h2 className="text-base sm:text-lg font-extrabold text-slate-900">
              ¿Qué habéis visto hoy en el colegio?
            </h2>
            <p className="text-xs text-slate-500">
              Registra temario, tu <strong>participación en clase (1 a 5)</strong> o tacha si hubo <strong>Vertretung / Entfall</strong>.
            </p>
          </div>

          <button
            onClick={() => openRecapForStudent(currentStudent.id, todayStr, 0, null)}
            className="w-full sm:w-auto px-4 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow flex items-center justify-center gap-2 active:scale-95 transition"
          >
            <Sparkles className="w-4 h-4" />
            <span>✨ Hacer Recap de Hoy</span>
          </button>
        </div>

        {/* SELECTOR DE DÍA Y CLASES DEL HORARIO */}
        <div className="mt-3">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-bold text-slate-600 flex items-center gap-1">
              <Calendar className="w-3.5 h-3.5 text-indigo-600" />
              Clases de {currentStudent.name} ({WEEKDAYS.find((w) => w.key === selectedDayKey)?.name}):
            </span>
            <button
              onClick={() => setScheduleModalOpen(true)}
              className="text-xs text-indigo-600 hover:underline font-bold flex items-center gap-0.5"
            >
              Editar Horario ✏️
            </button>
          </div>

          <div className="grid grid-cols-5 gap-1 mb-3 bg-slate-100 p-1 rounded-xl">
            {WEEKDAYS.map((day) => (
              <button
                key={day.key}
                onClick={() => setSelectedDayKey(day.key)}
                className={`py-1.5 rounded-lg text-xs font-bold transition ${
                  selectedDayKey === day.key ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'
                }`}
              >
                {day.short}
              </button>
            ))}
          </div>

          {todaySubjects.length === 0 ? (
            <div className="text-center py-4 bg-slate-50 rounded-xl border border-dashed border-slate-200">
              <p className="text-xs text-slate-500 mb-2">No hay asignaturas en este día.</p>
              <button
                onClick={() => setScheduleModalOpen(true)}
                className="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold"
              >
                Configurar Horario (Stundenplan)
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
              {todaySubjects.map((subj, idx) => {
                const session =
                  studentTodaySessions.find((s) => s.period_idx === idx && s.subject_id === subj.id) ||
                  studentTodaySessions.find((s) => s.subject_id === subj.id);

                const isVertretung = session?.status === 'vertretung';
                const isEntfall = session?.status === 'entfall';
                const isStruckOut = isVertretung || isEntfall;
                const partObj = session
                  ? PARTICIPATION_LEVELS.find((p) => p.id === String(session.participation))
                  : null;

                return (
                  <div
                    key={`${subj.id}_${idx}`}
                    onClick={() => openRecapForStudent(currentStudent.id, todayStr, idx, subj.id)}
                    className={`p-3 rounded-xl border cursor-pointer transition flex flex-col justify-between gap-2 ${
                      isStruckOut
                        ? 'bg-slate-100/90 border-dashed border-slate-300 opacity-80'
                        : session
                        ? 'bg-emerald-50/60 border-emerald-300'
                        : 'bg-slate-50/70 border-slate-200 hover:border-indigo-300'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-1">
                      <div className="flex items-center gap-1.5 min-w-0">
                        <span className="text-base shrink-0">{subj.icon}</span>
                        <span
                          className={`font-bold text-xs truncate ${
                            isStruckOut ? 'line-through text-slate-500' : 'text-slate-800'
                          }`}
                        >
                          {subj.name}
                        </span>
                      </div>
                      <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-200 text-slate-600 shrink-0">
                        {idx + 1}ª hora
                      </span>
                    </div>

                    {session ? (
                      <div className="space-y-1">
                        {isVertretung && (
                          <div className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-amber-100 text-amber-900 border border-amber-300 text-[10px] font-extrabold">
                            🔄 Vertretung (Tachada · Sin temario)
                          </div>
                        )}
                        {isEntfall && (
                          <div className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-slate-200 text-slate-700 border border-slate-300 text-[10px] font-extrabold">
                            🚫 Entfall (Clase cancelada)
                          </div>
                        )}
                        {session.status === 'normal' && (
                          <div className="text-[11px] text-emerald-900 font-semibold truncate">
                            ✅ {session.topic_title ? `${session.topic_title} ➔ ` : ''}
                            {session.subtopic_title || 'Recap completado'}
                          </div>
                        )}
                        {session.note && (
                          <div className="text-[10px] text-slate-600 italic truncate">
                            📝 {session.note}
                          </div>
                        )}
                        {partObj && partObj.id !== 'na' && (
                          <div className="flex items-center justify-between text-[10px] pt-1 border-t border-slate-200/60">
                            <span className="text-slate-500">Participación:</span>
                            <span className={`px-1.5 py-0.2 rounded font-bold border ${partObj.badgeClass}`}>
                              {partObj.emoji} {partObj.label} (Nota {partObj.grade})
                            </span>
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="text-[11px] text-indigo-600 font-semibold flex items-center justify-between pt-1 border-t border-slate-200/60">
                        <span>Pendiente de Recap</span>
                        <span>Registrar ✏️</span>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      {/* RADAR DE EXÁMENES */}
      {upcomingExams.length > 0 && (
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2">
          <div className="flex items-center justify-between">
            <h3 className="font-bold text-sm text-slate-800 flex items-center gap-1.5">
              <AlertCircle className="w-4 h-4 text-amber-500" />
              Radar de Exámenes ({currentStudent.name})
            </h3>
            <button onClick={() => setActiveTab('calendar')} className="text-xs font-bold text-indigo-600 hover:underline">
              Ver en Calendario →
            </button>
          </div>
          {upcomingExams.map((ex) => {
            const urgency = getExamUrgencyInfo(ex.exam_date);
            const subj = appData.subjects.find((s) => s.id === ex.subject_id);
            return (
              <div
                key={ex.id}
                onClick={() => setActiveTab('calendar')}
                className={`p-3 rounded-xl border cursor-pointer flex items-center justify-between gap-2 ${urgency.bannerColor}`}
              >
                <div>
                  <div className="font-bold text-xs uppercase opacity-90">{urgency.badge} • {formatHumanDate(ex.exam_date)}</div>
                  <div className="font-extrabold text-sm">{subj?.icon} {subj?.name}: {ex.title}</div>
                </div>
                <button
                  type="button"
                  onClick={(e) => {
                    e.stopPropagation();
                    setActiveTab('recall');
                  }}
                  className="px-2.5 py-1.5 rounded-lg bg-slate-900 text-white text-xs font-bold shrink-0"
                >
                  Repasar
                </button>
              </div>
            );
          })}
        </div>
      )}

    </div>
  );
}

// ============================================================================
// MODAL INSPECTOR DETALLADO (MUESTRA TÍTULO, TEMA, SUBTEMA Y DESCRIPCIÓN AL PICAR)
// ============================================================================
function QuickDetailInspectorModal({
  appData,
  inspector,
  onClose,
  rateSubtopicRecall,
  openRecapForStudent,
  setActiveTab,
}) {
  const stu = appData.students.find((s) => s.id === inspector.studentId) || appData.students[0];
  const todayStr = toDateStr();

  const allSubs = appData.topics
    .filter((t) => t.student_id === stu.id)
    .flatMap((t) => {
      const subj = appData.subjects.find((s) => s.id === t.subject_id);
      return t.subtopics.map((st) => ({
        ...st,
        topic_id: t.id,
        topic_title: t.title,
        subject_id: t.subject_id,
        subject_name: subj?.name || 'Asignatura',
        subject_icon: subj?.icon || '📘',
      }));
    });

  const [selectedSub, setSelectedSub] = useState(
    inspector.type === 'single_recall' ? inspector.item : null
  );

  let title = '';
  let list = [];
  if (inspector.type === 'recall' || inspector.type === 'single_recall') {
    title = `⚡ Active Recall pendientes (${stu.name})`;
    list = allSubs.filter((st) => st.next_recall_date <= todayStr);
  } else if (inspector.type === 'weak') {
    title = `🔴/🟠 Subtemas con dudas o flojos (${stu.name})`;
    list = allSubs.filter((st) => st.comprehension <= 2);
  } else if (inspector.type === 'hours') {
    title = `⏱️ Bloques de estudio registrados (${stu.name})`;
    list = (appData.work_logs || []).filter((l) => l.student_id === stu.id).slice(0, 15);
  } else if (inspector.type === 'participation') {
    title = `🙋‍♂️ Historial de Clases y Participación (${stu.name})`;
    list = (appData.class_sessions || []).filter((s) => s.student_id === stu.id).slice(0, 15);
  }

  return (
    <div className="bg-white w-full rounded-2xl shadow-md border border-slate-200 overflow-hidden">
      <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
        <div>
          <span className="text-[10px] font-bold uppercase text-amber-400">
            🔍 Vista Completa • {stu.avatar} {stu.name}
          </span>
          <h3 className="font-bold text-base">{title}</h3>
        </div>
        <button
          onClick={onClose}
          className="px-3.5 py-2 rounded-xl bg-amber-500 text-slate-950 text-xs font-black shadow"
        >
          ← Volver a Hoy
        </button>
      </div>

      <div className="p-4 space-y-3">
          {selectedSub ? (
            <div className="p-4 rounded-2xl bg-amber-50/70 border-2 border-amber-400 space-y-3">
              <div className="flex items-center justify-between">
                <span className="text-xs font-extrabold text-indigo-700">
                  {selectedSub.subject_icon} {selectedSub.subject_name} • 📂 {selectedSub.topic_title}
                </span>
                <button
                  onClick={() => setSelectedSub(null)}
                  className="text-xs font-bold text-slate-500 underline"
                >
                  ← Ver todos
                </button>
              </div>
              <h4 className="font-black text-base text-slate-900">
                ⚡ {selectedSub.title}
              </h4>
              <div className="p-3 rounded-xl bg-white border border-amber-200 text-xs text-slate-800">
                <div className="font-bold text-amber-900 mb-1">📝 Descripción / Explicación / Apuntes:</div>
                <p className="whitespace-pre-wrap">
                  {selectedSub.notes || 'Sin descripción adicional registrada todavía.'}
                </p>
              </div>

              {rateSubtopicRecall && (
                <div>
                  <div className="text-[11px] font-extrabold uppercase text-slate-500 mb-1.5 text-center">
                    Calificar repaso de Active Recall ahora mismo:
                  </div>
                  <div className="grid grid-cols-4 gap-1.5">
                    {[
                      { r: 1, emoji: '🔄', label: 'No supo', sub: '1d', cls: 'bg-red-50 text-red-900 border-red-300' },
                      { r: 2, emoji: '😓', label: 'Dudas', sub: '2-3d', cls: 'bg-amber-50 text-amber-900 border-amber-300' },
                      { r: 3, emoji: '👍', label: 'Bien', sub: '4-5d', cls: 'bg-emerald-50 text-emerald-900 border-emerald-300' },
                      { r: 4, emoji: '🚀', label: 'Perfecto', sub: '7d+', cls: 'bg-indigo-50 text-indigo-900 border-indigo-300' },
                    ].map((btn) => (
                      <button
                        key={btn.r}
                        onClick={() => {
                          rateSubtopicRecall({
                            student_id: stu.id,
                            topic_id: selectedSub.topic_id,
                            subtopic_id: selectedSub.id,
                            rating: btn.r,
                            minutesSpent: 10,
                          });
                          setSelectedSub(null);
                        }}
                        className={`p-2 rounded-xl border text-center font-bold text-xs ${btn.cls}`}
                      >
                        <div className="text-base">{btn.emoji}</div>
                        <div>{btn.label}</div>
                        <div className="text-[9px] opacity-75">{btn.sub}</div>
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          ) : (
            <>
              {(inspector.type === 'recall' || inspector.type === 'single_recall' || inspector.type === 'weak') && (
                list.length === 0 ? (
                  <p className="text-xs text-slate-500 text-center py-6">
                    🎉 No hay subtemas pendientes en esta categoría.
                  </p>
                ) : (
                  <div className="space-y-2">
                    {list.map((st) => {
                      const comp = COMPREHENSION_LEVELS.find((c) => c.id === st.comprehension);
                      return (
                        <div
                          key={st.id}
                          onClick={() => setSelectedSub(st)}
                          className="p-3 rounded-xl border border-slate-200 hover:border-indigo-400 bg-slate-50 cursor-pointer transition space-y-1"
                        >
                          <div className="flex items-center justify-between gap-2">
                            <span className="text-[11px] font-bold text-indigo-600">
                              {st.subject_icon} {st.subject_name} • 📂 {st.topic_title}
                            </span>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${comp?.badgeClass}`}>
                              {comp?.emoji} {comp?.short}
                            </span>
                          </div>
                          <div className="font-extrabold text-sm text-slate-900">
                            📄 {st.title}
                          </div>
                          {st.notes ? (
                            <p className="text-xs text-slate-600 bg-white p-2 rounded-lg border border-slate-200/80">
                              📝 {st.notes}
                            </p>
                          ) : (
                            <p className="text-[11px] text-slate-400 italic">Sin descripción adicional</p>
                          )}
                          <div className="text-[10px] text-indigo-600 font-bold pt-0.5">
                            👆 Pica aquí para abrir y calificar este Active Recall
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )
              )}

              {inspector.type === 'hours' && (
                list.length === 0 ? (
                  <p className="text-xs text-slate-500 text-center py-6">Sin bloques de tiempo aún.</p>
                ) : (
                  <div className="space-y-2">
                    {list.map((lg) => {
                      const subj = appData.subjects.find((s) => s.id === lg.subject_id);
                      const top = appData.topics.find((t) => t.id === lg.topic_id);
                      const sub = top?.subtopics.find((st) => st.id === lg.subtopic_id);
                      return (
                        <div key={lg.id} className="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs">
                          <div>
                            <div className="font-bold text-slate-900">
                              {subj?.icon} {subj?.name} • {top?.title || 'Estudio'}
                            </div>
                            {sub && <div className="text-slate-600">📄 {sub.title}</div>}
                            {lg.note && <div className="text-slate-500 italic text-[11px]">{lg.note}</div>}
                          </div>
                          <div className="text-right shrink-0 ml-2">
                            <div className="font-black text-indigo-700">+{lg.minutes}m</div>
                            <div className="text-[10px] text-slate-500">{formatHumanDate(lg.date)}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )
              )}

              {inspector.type === 'participation' && (
                list.length === 0 ? (
                  <p className="text-xs text-slate-500 text-center py-6">Sin sesiones de clase aún.</p>
                ) : (
                  <div className="space-y-2">
                    {list.map((sess) => {
                      const subj = appData.subjects.find((s) => s.id === sess.subject_id);
                      const pObj = PARTICIPATION_LEVELS.find((p) => p.id === String(sess.participation));
                      return (
                        <div
                          key={sess.id}
                          onClick={() => {
                            onClose();
                            openRecapForStudent &&
                              openRecapForStudent(sess.student_id, sess.date, sess.period_idx || 0, sess.subject_id);
                          }}
                          className="p-3 rounded-xl bg-slate-50 border border-slate-200 hover:border-indigo-400 cursor-pointer flex items-center justify-between text-xs"
                        >
                          <div>
                            <div className="font-bold text-slate-900">
                              {formatHumanDate(sess.date)} • {subj?.icon} {subj?.name}
                            </div>
                            {sess.status === 'normal' ? (
                              <div className="text-slate-700">
                                📂 {sess.topic_title} ➔ 📄 {sess.subtopic_title}
                              </div>
                            ) : (
                              <div className="text-amber-800 font-bold uppercase text-[11px]">
                                {sess.status === 'vertretung' ? '🔄 Vertretung' : '🚫 Entfall'}
                              </div>
                            )}
                            {sess.note && <div className="text-slate-500 italic text-[11px]">📝 {sess.note}</div>}
                          </div>
                          {pObj && (
                            <span className={`px-2 py-1 rounded-lg border font-bold text-[11px] shrink-0 ${pObj.badgeClass}`}>
                              {pObj.emoji} {pObj.label}
                            </span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )
              )}
            </>
          )}
        </div>

        <div className="p-4 border-t border-slate-200 bg-slate-50 flex justify-start">
          <button onClick={onClose} className="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold">
            ← Volver a Hoy
          </button>
        </div>
    </div>
  );
}

// ============================================================================
// VISTA 2: GESTIÓN DE ASIGNATURAS Y ÁRBOL DE 3 NIVELES (TEMA -> SUBTEMA -> DESCRIPCIÓN)
// ============================================================================
function TopicsAndTasksView({
  appData,
  currentStudent,
  setAppData,
  upsertTopicAndSubtopic,
  setQuickTimeModal,
  showToast,
  openRecapForStudent,
}) {
  const studentSubjects = appData.subjects.filter((s) => s.student_id === currentStudent.id);
  const [selectedSubjectId, setSelectedSubjectId] = useState('ALL');

  // Control de nodos abiertos del árbol: Nivel 1 (Temas) y Nivel 2 (Subtemas -> Nivel 3 Descripción)
  const [openTopics, setOpenTopics] = useState({});
  const [openSubtopics, setOpenSubtopics] = useState({});

  // Estados de edición en línea / modales
  const [editingSubject, setEditingSubject] = useState(null); // { id, name, icon } o { id: 'NEW', name: '', icon: '📘' }
  const [editingTopic, setEditingTopic] = useState(null); // { id, subject_id, title } o { id: 'NEW', subject_id, title: '' }
  const [editingSubtopic, setEditingSubtopic] = useState(null); // { topic_id, id, title, comprehension, notes }

  const studentTopics = appData.topics
    .filter((t) => t.student_id === currentStudent.id)
    .filter((t) => selectedSubjectId === 'ALL' || t.subject_id === selectedSubjectId);

  const isTopicOpen = (topicId) => openTopics[topicId] !== false; // Abierto por defecto
  const toggleTopic = (topicId) =>
    setOpenTopics((prev) => ({ ...prev, [topicId]: !isTopicOpen(topicId) }));

  const isSubtopicOpen = (subId) => !!openSubtopics[subId];
  const toggleSubtopic = (subId) =>
    setOpenSubtopics((prev) => ({ ...prev, [subId]: !prev[subId] }));

  // Guardar Asignatura (Nueva o Editada)
  const handleSaveSubject = () => {
    if (!editingSubject || !editingSubject.name.trim()) return;
    const now = Date.now();
    if (editingSubject.id === 'NEW') {
      const newSub = {
        id: uid('sub'),
        student_id: currentStudent.id,
        name: editingSubject.name.trim(),
        icon: editingSubject.icon || '📘',
        color: 'bg-indigo-600',
        updated_at: now,
      };
      setAppData((prev) => ({
        ...prev,
        lastUpdated: now,
        subjects: [...prev.subjects, newSub],
      }));
      setSelectedSubjectId(newSub.id);
      showToast(`📚 Asignatura "${newSub.name}" creada`);
    } else {
      setAppData((prev) => ({
        ...prev,
        lastUpdated: now,
        subjects: prev.subjects.map((s) =>
          s.id === editingSubject.id
            ? { ...s, name: editingSubject.name.trim(), icon: editingSubject.icon || '📘', updated_at: now }
            : s
        ),
      }));
      showToast('✏️ Asignatura actualizada');
    }
    setEditingSubject(null);
  };

  // Guardar Tema Principal (Nuevo o Editado)
  const handleSaveTopic = () => {
    if (!editingTopic || !editingTopic.title.trim()) return;
    const now = Date.now();
    const targetSubjId = editingTopic.subject_id || studentSubjects[0]?.id;
    if (editingTopic.id === 'NEW') {
      const newTop = {
        id: uid('top'),
        student_id: currentStudent.id,
        subject_id: targetSubjId,
        title: editingTopic.title.trim(),
        updated_at: now,
        subtopics: [],
      };
      setAppData((prev) => ({
        ...prev,
        lastUpdated: now,
        topics: [newTop, ...prev.topics],
      }));
      showToast('📂 Tema Principal creado');
    } else {
      setAppData((prev) => ({
        ...prev,
        lastUpdated: now,
        topics: prev.topics.map((t) =>
          t.id === editingTopic.id
            ? {
                ...t,
                title: editingTopic.title.trim(),
                subject_id: targetSubjId,
                updated_at: now,
              }
            : t
        ),
      }));
      showToast('✏️ Tema Principal actualizado');
    }
    setEditingTopic(null);
  };

  const handleDeleteTopic = (topicId) => {
    setAppData((prev) => ({
      ...prev,
      lastUpdated: Date.now(),
      topics: prev.topics.filter((t) => t.id !== topicId),
    }));
    showToast('🗑️ Tema eliminado');
  };

  // Guardar Subtema y Descripción (Nuevo o Editado)
  const handleSaveSubtopic = () => {
    if (!editingSubtopic || !editingSubtopic.title.trim()) return;
    const now = Date.now();
    const compObj =
      COMPREHENSION_LEVELS.find((c) => c.id === Number(editingSubtopic.comprehension)) ||
      COMPREHENSION_LEVELS[2];

    setAppData((prev) => ({
      ...prev,
      lastUpdated: now,
      topics: prev.topics.map((t) => {
        if (t.id !== editingSubtopic.topic_id) return t;
        if (editingSubtopic.id === 'NEW') {
          const newSub = {
            id: uid('subtop'),
            title: editingSubtopic.title.trim(),
            comprehension: Number(editingSubtopic.comprehension) || 3,
            next_recall_date: addDaysStr(toDateStr(), compObj.days),
            interval_days: compObj.days,
            notes: editingSubtopic.notes || '',
            created_at: toDateStr(),
            review_count: 0,
            updated_at: now,
          };
          return {
            ...t,
            updated_at: now,
            subtopics: [...t.subtopics, newSub],
          };
        } else {
          return {
            ...t,
            updated_at: now,
            subtopics: t.subtopics.map((st) =>
              st.id !== editingSubtopic.id
                ? st
                : {
                    ...st,
                    title: editingSubtopic.title.trim(),
                    comprehension: Number(editingSubtopic.comprehension) || st.comprehension,
                    notes: editingSubtopic.notes,
                    updated_at: now,
                  }
            ),
          };
        }
      }),
    }));
    showToast('✅ Subtema y descripción guardados');
    setEditingSubtopic(null);
  };

  const handleDeleteSubtopic = (topicId, subtopicId) => {
    setAppData((prev) => ({
      ...prev,
      lastUpdated: Date.now(),
      topics: prev.topics.map((t) =>
        t.id !== topicId
          ? t
          : {
              ...t,
              updated_at: Date.now(),
              subtopics: t.subtopics.filter((st) => st.id !== subtopicId),
            }
      ),
    }));
    showToast('🗑️ Subtema eliminado');
  };

  const updateSubtopicFieldInline = (topicId, subtopicId, patch) => {
    const now = Date.now();
    setAppData((prev) => ({
      ...prev,
      lastUpdated: now,
      topics: prev.topics.map((t) =>
        t.id !== topicId
          ? t
          : {
              ...t,
              updated_at: now,
              subtopics: t.subtopics.map((st) =>
                st.id !== subtopicId ? st : { ...st, ...patch, updated_at: now }
              ),
            }
      ),
    }));
  };

  if (editingSubject) {
    return (
      <div className="bg-white w-full rounded-2xl shadow-md border border-slate-200 overflow-hidden">
        <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
          <h3 className="font-bold text-base">
            {editingSubject.id === 'NEW' ? '➕ Nueva Asignatura' : '✏️ Editar Asignatura'}
          </h3>
          <button
            onClick={() => setEditingSubject(null)}
            className="px-3 py-1.5 rounded-xl bg-slate-800 text-white text-xs font-bold"
          >
            ← Volver a Temas
          </button>
        </div>
        <div className="p-4 space-y-4">
          <div className="grid grid-cols-4 gap-2">
