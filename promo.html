<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SchulFamilie — Play Store Motion Trailer (1920×1080 • 60fps)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #141413;
      color: #faf9f5;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    canvas {
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.85);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 gap-4">

  <!-- Barra de controles -->
  <div class="w-full max-w-5xl flex flex-col sm:flex-row items-center justify-between gap-3 bg-neutral-900 border border-neutral-800 rounded-2xl p-4 shadow-xl">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-[#FF5A36] flex items-center justify-center font-black text-white text-lg shadow">
        SF
      </div>
      <div>
        <h1 class="font-extrabold text-base sm:text-lg text-white leading-tight">
          SchulFamilie — Play Store Motion Trailer (1080p • 60 FPS)
        </h1>
        <p class="text-xs text-neutral-400">
          Estilo Motion Graphics humano • Zoom dinámico, tipeo en vivo, tarjetas 3D y transiciones whip-pan
        </p>
      </div>
    </div>

    <div class="flex items-center gap-2 w-full sm:w-auto">
      <button
        id="btn-restart"
        class="px-3.5 py-2.5 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-200 text-xs font-bold border border-neutral-700 transition"
      >
        ↺ Reiniciar
      </button>
      <button
        id="btn-export"
        class="flex-1 sm:flex-initial px-5 py-2.5 rounded-xl bg-[#FF5A36] hover:bg-[#ff6e4f] text-white text-xs sm:text-sm font-extrabold shadow-lg transition flex items-center justify-center gap-2"
      >
        <span>⬇️ Descargar Vídeo (.mp4 / .webm)</span>
      </button>
    </div>
  </div>

  <!-- Estado de grabación -->
  <div id="export-status" class="hidden w-full max-w-5xl bg-neutral-900 border border-[#FF5A36]/50 rounded-2xl p-4 space-y-2">
    <div class="flex items-center justify-between text-xs font-bold text-orange-200">
      <span>Renderizando animación a 60 FPS reales (1920×1080)... No cambies de pestaña.</span>
      <span id="export-pct">0%</span>
    </div>
    <div class="w-full h-2.5 bg-neutral-950 rounded-full overflow-hidden">
      <div id="export-bar" class="h-full bg-[#FF5A36] transition-all duration-100" style="width: 0%"></div>
    </div>
  </div>

  <!-- Lienzo 1920x1080 -->
  <div class="w-full max-w-5xl">
    <canvas id="promoCanvas" width="1920" height="1080" class="w-full h-auto bg-[#FBF8F3]"></canvas>
  </div>

  <!-- Línea de tiempo interactiva -->
  <div class="w-full max-w-5xl grid grid-cols-3 sm:grid-cols-6 gap-2 text-center text-[11px]">
    <button onclick="jumpTo(0)" class="p-2 rounded-xl bg-neutral-900 border border-neutral-800 hover:border-[#FF5A36] transition">
      <div class="font-bold text-[#FF5A36]">1. Chat-Intro</div>
      <div class="text-neutral-400">0s – 4.5s</div>
    </button>
    <button onclick="jumpTo(4.5)" class="p-2 rounded-xl bg-neutral-900 border border-neutral-800 hover:border-[#FF5A36] transition">
      <div class="font-bold text-amber-400">2. Live-Scan & Zoom</div>
      <div class="text-neutral-400">4.5s – 9.8s</div>
    </button>
    <button onclick="jumpTo(9.8)" class="p-2 rounded-xl bg-neutral-900 border border-neutral-800 hover:border-[#FF5A36] transition">
      <div class="font-bold text-emerald-400">3. QR & Cloud Sync</div>
      <div class="text-neutral-400">9.8s – 14.5s</div>
    </button>
    <button onclick="jumpTo(14.5)" class="p-2 rounded-xl bg-neutral-900 border border-neutral-800 hover:border-[#FF5A36] transition">
      <div class="font-bold text-sky-400">4. 3D Flip-Card</div>
      <div class="text-neutral-400">14.5s – 19.8s</div>
    </button>
    <button onclick="jumpTo(19.8)" class="p-2 rounded-xl bg-neutral-900 border border-neutral-800 hover:border-[#FF5A36] transition">
      <div class="font-bold text-rose-400">5. Kalender Zoom</div>
      <div class="text-neutral-400">19.8s – 24.5s</div>
    </button>
    <button onclick="jumpTo(24.5)" class="p-2 rounded-xl bg-neutral-900 border border-neutral-800 hover:border-[#FF5A36] transition">
      <div class="font-bold text-white">6. Finale</div>
      <div class="text-neutral-400">24.5s – 28.5s</div>
    </button>
  </div>

  <script>
    const canvas = document.getElementById('promoCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1920;
    const H = 1080;
    const TOTAL_DURATION = 28.5;
    const FONT = "'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif";

    let startTime = performance.now();
    let isExporting = false;

    window.jumpTo = (sec) => {
      if (isExporting) return;
      startTime = performance.now() - sec * 1000;
    };

    document.getElementById('btn-restart').addEventListener('click', () => {
      if (isExporting) return;
      startTime = performance.now();
    });

    // =========================================================================
    // FÍSICAS SPRING & EASING (ESTILO AFTER EFFECTS)
    // =========================================================================
    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * clamp(t);
    const easeOutQuart = (t) => 1 - Math.pow(1 - clamp(t), 4);
    const easeInOutCubic = (t) => {
      const x = clamp(t);
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    };
    // Muelle elástico real (spring overshoot)
    const spring = (t, tension = 0.3) => {
      const x = clamp(t);
      if (x === 0 || x === 1) return x;
      return Math.pow(2, -10 * x) * Math.sin((x - tension / 4) * (2 * Math.PI) / tension) + 1;
    };
    const easeOutBack = (t) => {
      const x = clamp(t);
      const c1 = 1.85;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    };

    // =========================================================================
    // PRIMITIVAS DE DISEÑO EDITORIAL & VECTORIAL (CERO EMOJIS DE SISTEMA)
    // =========================================================================
    function rRect(x, y, w, h, r, fill, stroke, sw = 2) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.stroke(); }
    }

    function txt(str, x, y, {
      size = 44, weight = '800', color = '#191918', align = 'left', alpha = 1, italic = false
    } = {}) {
      ctx.save();
      ctx.globalAlpha *= clamp(alpha);
      ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${FONT}`;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';
      ctx.fillText(str, x, y);
      ctx.restore();
    }

    // Dibuja un subrayado / círculo hecho a mano (efecto rotulador orgánico con progreso)
    function drawHandMarkerLine(x1, y1, x2, y2, progress, color = '#FF5A36', width = 10) {
      const p = clamp(progress);
      if (p <= 0) return;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      const cx = lerp(x1, (x1 + x2) / 2, p);
      const cy = lerp(y1, (y1 + y2) / 2 - 12, p);
      const ex = lerp(x1, x2, p);
      const ey = lerp(y1, y2, p);
      ctx.quadraticCurveTo(cx, cy, ex, ey);
      ctx.stroke();
      ctx.restore();
    }

    // Onda táctil de dedo (Touch Ripple + Cursor animado)
    function drawTouchCursor(x, y, clickProgress = 0) {
      ctx.save();
      if (clickProgress > 0 && clickProgress < 1) {
        const rp = easeOutQuart(clickProgress);
        ctx.beginPath();
        ctx.arc(x, y, 22 + rp * 58, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 90, 54, ${1 - rp})`;
        ctx.lineWidth = 5;
        ctx.stroke();
      }
      const pressScale = clickProgress > 0 && clickProgress < 0.4 ? 0.82 : 1;
      ctx.translate(x, y);
      ctx.scale(pressScale, pressScale);
      ctx.shadowColor = 'rgba(0,0,0,0.28)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 6;
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 90, 54, 0.9)';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      ctx.restore();
    }

    // Iconos vectoriales limpios (Check, Lock, Lightning, Camera, Star)
    function drawCheckIcon(cx, cy, r, bg = '#15803d', fg = '#ffffff') {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.strokeStyle = fg;
      ctx.lineWidth = r * 0.24;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.42, cy + r * 0.04);
      ctx.lineTo(cx - r * 0.1, cy + r * 0.36);
      ctx.lineTo(cx + r * 0.45, cy - r * 0.3);
      ctx.stroke();
      ctx.restore();
    }

    function drawLockIcon(cx, cy, scale = 1, color = '#191918') {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      rRect(-18, -4, 36, 28, 7, color, null);
      ctx.beginPath();
      ctx.arc(0, -6, 11, Math.PI, 0, false);
      ctx.lineWidth = 5;
      ctx.strokeStyle = color;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 10, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.restore();
    }

    function drawBoltIcon(cx, cy, scale = 1, color = '#FF5A36') {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(4, -22);
      ctx.lineTo(-14, 4);
      ctx.lineTo(-1, 4);
      ctx.lineTo(-6, 22);
      ctx.lineTo(14, -4);
      ctx.lineTo(1, -4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Papel cálido con cuadrícula escolar sutil de fondo
    function drawWarmPaperBg(t, bgHex = '#FBF8F3', gridAlpha = 0.045) {
      ctx.fillStyle = bgHex;
      ctx.fillRect(0, 0, W, H);

      // Cuadrícula tipo "Kariertes Mathe-Heft" en movimiento suave
      ctx.save();
      ctx.strokeStyle = `rgba(25, 25, 24, ${gridAlpha})`;
      ctx.lineWidth = 1.5;
      const step = 64;
      const offsetX = (t * 22) % step;
      const offsetY = (t * 14) % step;
      for (let x = -step + offsetX; x < W + step; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = -step + offsetY; y < H + step; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // =========================================================================
    // ESCENA 1 (0s - 4.5s): CHAT REAL DE TARDE -> EL PROBLEMA COTIDIANO
    // =========================================================================
    function scene1(t) {
      drawWarmPaperBg(t, '#FBF8F3', 0.05);

      // Reloj / Contexto arriba
      const p0 = easeOutQuart(t / 0.5);
      ctx.save();
      ctx.translate(W / 2, 115 - (1 - p0) * 30);
      rRect(-190, -26, 380, 52, 26, '#191918', null);
      txt('DIENSTAG • 17:15 UHR ZU HAUSE', 0, 1, { size: 20, weight: '800', color: '#FBF8F3', align: 'center', alpha: p0 });
      ctx.restore();

      // Burbuja 1 (Papá pregunta)
      if (t > 0.35) {
        const b1 = easeOutBack((t - 0.35) / 0.55);
        ctx.save();
        ctx.translate(310, 275);
        ctx.scale(b1, b1);
        ctx.shadowColor = 'rgba(0,0,0,0.08)';
        ctx.shadowBlur = 24;
        ctx.shadowOffsetY = 10;
        rRect(0, -60, 780, 120, [32, 32, 32, 8], '#ffffff', '#E5E0D5', 3);
        ctx.shadowBlur = 0;
        txt('PAPA', 38, -26, { size: 17, weight: '800', color: '#FF5A36' });
        txt('„Und, was habt ihr heute in Mathe gemacht?“', 38, 18, { size: 33, weight: '800', color: '#191918' });
        ctx.restore();
      }

      // Burbuja 2 (Respuesta típica del hijo)
      if (t > 1.25) {
        const b2 = easeOutBack((t - 1.25) / 0.55);
        ctx.save();
        ctx.translate(1610, 445);
        ctx.scale(b2, b2);
        ctx.shadowColor = 'rgba(0,0,0,0.08)';
        ctx.shadowBlur = 24;
        ctx.shadowOffsetY = 10;
        rRect(-520, -60, 520, 120, [32, 32, 8, 32], '#191918', null);
        ctx.shadowBlur = 0;
        txt('SOHN (7. KLASSE)', -480, -26, { size: 17, weight: '800', color: '#FDBA74' });
        txt('„Keine Ahnung... Brüche halt.“', -480, 18, { size: 33, weight: '700', color: '#ffffff' });
        ctx.restore();
      }

      // Giro dinámico a los 2.4s: Impacto tipográfico grande con rotulador en vivo
      if (t > 2.35) {
        const k = easeOutQuart((t - 2.35) / 0.5);
        ctx.save();
        ctx.translate(W / 2, 740 + (1 - k) * 50);
        txt('Schluss mit dem Rätselraten am Abend.', 0, -45, {
          size: 72, weight: '800', color: '#191918', align: 'center', alpha: k
        });
        drawHandMarkerLine(-640, -2, 640, -2, (t - 2.65) / 0.45, '#FF5A36', 14);
        txt('So behaltet ihr gemeinsam den Überblick – in 3 Minuten.', 0, 52, {
          size: 38, weight: '700', color: '#57534E', align: 'center', alpha: k
        });
        ctx.restore();
      }
    }

    // =========================================================================
    // ESCENA 2 (4.5s - 9.8s): ZOOM DINÁMICO DE CÁMARA + TIPEO EN VIVO + VERTRETUNG
    // =========================================================================
    function scene2(t) {
      drawWarmPaperBg(t + 10, '#F4EFE6', 0.05);

      // Cámara virtual: empieza en plano general (1.0) y hace zoom in hacia la tarjeta interactiva
      const zoomIn = t > 1.6 && t < 4.4 ? easeInOutCubic((t - 1.6) / 0.8) : t >= 4.4 ? 1 - easeInOutCubic((t - 4.4) / 0.6) : 0;
      const camScale = lerp(1.0, 1.24, zoomIn);
      const camX = lerp(0, -220, zoomIn);
      const camY = lerp(0, -60, zoomIn);

      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.scale(camScale, camScale);
      ctx.translate(-W / 2 + camX, -H / 2 + camY);

      // Columna izquierda: Tipografía cinética
      const enter = easeOutQuart(t / 0.55);
      rRect(110, 170, 290, 48, 24, '#FF5A36', null);
      txt('SCHRITT 1 • NACH DER SCHULE', 255, 195, { size: 18, weight: '800', color: '#ffffff', align: 'center' });

      txt('3-Minuten Recap', 110, 295, { size: 76, weight: '800', color: '#191918', alpha: enter });
      txt('oder Foto vom Heft.', 110, 385, { size: 72, weight: '800', color: '#FF5A36', italic: true, alpha: enter });

      txt('Thema, Mitarbeit (Note 1–5) & Vertretungen', 110, 490, { size: 32, weight: '700', color: '#44403C', alpha: enter });
      txt('direkt nach dem Unterricht festhalten.', 110, 540, { size: 32, weight: '700', color: '#44403C', alpha: enter });

      // Tarjeta interactiva grande a la derecha (UI Viva)
      const cardX = 960;
      const cardY = 120 + (1 - enter) * 80;
      const cardW = 840;
      const cardH = 840;

      ctx.shadowColor = 'rgba(25, 25, 24, 0.16)';
      ctx.shadowBlur = 45;
      ctx.shadowOffsetY = 20;
      rRect(cardX, cardY, cardW, cardH, 36, '#ffffff', '#E5E0D5', 3);
      ctx.shadowBlur = 0;

      // Cabecera de la tarjeta
      rRect(cardX, cardY, cardW, 110, [36, 36, 0, 0], '#191918', null);
      txt('STUNDENPLAN HEUTE • DIENSTAG', cardX + 42, cardY + 42, { size: 17, weight: '800', color: '#FDBA74' });
      txt('1. Stunde: Mathematik (7. Klasse)', cardX + 42, cardY + 78, { size: 28, weight: '800', color: '#ffffff' });

      // Campo de texto con efecto de escritura en vivo (Live Typing)
      rRect(cardX + 38, cardY + 140, cardW - 76, 175, 22, '#FBF8F3', '#D6D3D1', 2);
      txt('THEMA & UNTERTHEMA (KI-ERKANNT)', cardX + 64, cardY + 174, { size: 16, weight: '800', color: '#78716C' });
      txt('Bruchrechnung →', cardX + 64, cardY + 216, { size: 26, weight: '800', color: '#191918' });

      const fullTyped = 'Brüche dividieren mit dem Kehrwert';
      const charCount = Math.floor(clamp((t - 0.6) / 1.4) * fullTyped.length);
      const currentTyped = fullTyped.slice(0, charCount);
      txt(currentTyped + (t % 0.5 < 0.25 && t < 2.2 ? '|' : ''), cardX + 64, cardY + 266, {
        size: 30, weight: '800', color: '#FF5A36'
      });

      // Selector de Mündliche Mitarbeit (1 a 5) con clic animado
      txt('MÜNDLICHE MITARBEIT IN DER STUNDE:', cardX + 42, cardY + 358, { size: 18, weight: '800', color: '#57534E' });
      const clickedNote1 = t > 2.3;
      const notes = [
        { n: '1', lbl: 'Sehr gut', pct: '100%' },
        { n: '2', lbl: 'Gut', pct: '80%' },
        { n: '3', lbl: 'Normal', pct: '60%' },
        { n: '5', lbl: 'Wenig', pct: '20%' },
      ];
      notes.forEach((item, idx) => {
        const bx = cardX + 38 + idx * 195;
        const by = cardY + 386;
        const isSel = idx === 0 && clickedNote1;
        const pop = isSel ? spring((t - 2.3) / 0.5) : 1;
        ctx.save();
        ctx.translate(bx + 88, by + 64);
        ctx.scale(isSel ? 0.92 + 0.08 * pop : 1, isSel ? 0.92 + 0.08 * pop : 1);
        rRect(-88, -64, 176, 128, 22, isSel ? '#15803D' : '#FBF8F3', isSel ? '#15803D' : '#D6D3D1', 2.5);
        txt(`Note ${item.n}`, 0, -22, { size: 28, weight: '800', color: isSel ? '#ffffff' : '#191918', align: 'center' });
        txt(item.lbl, 0, 16, { size: 20, weight: '700', color: isSel ? '#DCFCE7' : '#57534E', align: 'center' });
        txt(item.pct, 0, 44, { size: 15, weight: '800', color: isSel ? '#86EFAC' : '#A8A29E', align: 'center' });
        ctx.restore();
      });

      // Fila 2ª hora: Tachado en vivo de Vertretung!
      const vClicked = t > 3.3;
      rRect(cardX + 38, cardY + 550, cardW - 76, 130, 22, vClicked ? '#FEF3C7' : '#FBF8F3', vClicked ? '#F59E0B' : '#D6D3D1', 2.5);
      txt('2. Stunde: Deutsch', cardX + 68, cardY + 595, {
        size: 26, weight: '800', color: vClicked ? '#92400E' : '#191918'
      });
      // Línea de tachado que se dibuja sola sobre "2. Stunde: Deutsch"
      drawHandMarkerLine(cardX + 64, cardY + 595, cardX + 345, cardY + 595, (t - 3.35) / 0.35, '#D97706', 6);
      txt(vClicked ? 'VERTRETUNG — Keine neuen Themen heute' : 'Als Vertretung streichen', cardX + 68, cardY + 640, {
        size: 20, weight: '700', color: '#B45309'
      });

      // Botón inferior
      rRect(cardX + 38, cardY + 716, cardW - 76, 84, 22, '#191918', null);
      txt('Recap speichern & an Papa senden →', cardX + cardW / 2, cardY + 758, {
        size: 24, weight: '800', color: '#ffffff', align: 'center'
      });

      // Cursor táctil moviéndose con suavidad humana entre Note 1 y Vertretung
      if (t > 1.7 && t < 4.3) {
        const moveP = easeInOutCubic((t - 2.6) / 0.6);
        const cx = lerp(cardX + 126, cardX + 520, moveP);
        const cy = lerp(cardY + 450, cardY + 615, moveP);
        const click1 = t >= 2.25 && t <= 2.65 ? (t - 2.25) / 0.4 : 0;
        const click2 = t >= 3.25 && t <= 3.65 ? (t - 3.25) / 0.4 : 0;
        drawTouchCursor(cx, cy, click1 || click2);
      }

      ctx.restore();
    }

    // =========================================================================
    // ESCENA 3 (9.8s - 14.5s): SINCRONIZACIÓN INSTANTÁNEA (NUBE CIEGA E2EE)
    // =========================================================================
    function scene3(t) {
      drawWarmPaperBg(t + 20, '#191918', 0.06);

      const enter = easeOutQuart(t / 0.55);
      // Título editorial sobre fondo carbón cálido
      txt('Automatisch auf deinem Handy.', W / 2, 145, {
        size: 68, weight: '800', color: '#FBF8F3', align: 'center', alpha: enter
      });
      txt('Ende-zu-Ende verschlüsselt. Kein Server liest mit.', W / 2, 225, {
        size: 32, weight: '600', color: '#A8A29E', align: 'center', alpha: enter
      });

      // Tarjeta izquierda (Hijo)
      const lx = 150 - (1 - enter) * 80;
      rRect(lx, 330, 500, 560, 34, '#262624', '#44403C', 2.5);
      rRect(lx + 34, 368, 180, 40, 20, '#FF5A36', null);
      txt('SCHÜLER-APP', lx + 124, 389, { size: 16, weight: '800', color: '#ffffff', align: 'center' });
      txt('Recap erledigt', lx + 34, 455, { size: 36, weight: '800', color: '#ffffff' });
      rRect(lx + 34, 505, 432, 140, 20, '#191918', '#3F3F46', 2);
      txt('Mathematik • Brüche', lx + 58, 548, { size: 24, weight: '800', color: '#FBF8F3' });
      txt('Mitarbeit: Note 1 (Sehr gut)', lx + 58, 592, { size: 20, weight: '700', color: '#4ADE80' });
      txt('Deutsch: Vertretung', lx + 58, 624, { size: 18, weight: '600', color: '#FBBF24' });

      // Tubo de onda orgánica central + Escudo E2EE
      ctx.save();
      ctx.strokeStyle = '#44403C';
      ctx.lineWidth = 6;
      ctx.setLineDash([14, 14]);
      ctx.lineDashOffset = -t * 140;
      ctx.beginPath();
      ctx.moveTo(650, 610);
      ctx.lineTo(1270, 610);
      ctx.stroke();
      ctx.restore();

      // Cápsulas viajando a alta velocidad
      for (let i = 0; i < 3; i++) {
        const p = (t * 0.75 + i * 0.33) % 1;
        const px = lerp(660, 1250, p);
        const py = 610 + Math.sin(p * Math.PI * 2) * 28;
        rRect(px - 34, py - 22, 68, 44, 22, '#FF5A36', '#ffffff', 2);
        drawLockIcon(px, py - 2, 0.7, '#ffffff');
      }

      // Medallón central E2EE
      const pulse = 1 + Math.sin(t * 6) * 0.04;
      ctx.save();
      ctx.translate(W / 2, 610);
      ctx.scale(pulse, pulse);
      rRect(-155, -155, 310, 310, 155, '#FBF8F3', '#FF5A36', 8);
      drawLockIcon(0, -36, 1.6, '#191918');
      txt('BLINDE CLOUD', 0, 42, { size: 24, weight: '800', color: '#191918', align: 'center' });
      txt('100 % DSGVO', 0, 78, { size: 19, weight: '800', color: '#15803D', align: 'center' });
      ctx.restore();

      // Tarjeta derecha (Móvil de Papá recibiendo la notificación en vivo)
      const rx = 1270 + (1 - enter) * 80;
      rRect(rx, 330, 500, 560, 34, '#FBF8F3', '#E5E0D5', 3);
      rRect(rx + 34, 368, 180, 40, 20, '#191918', null);
      txt('ELTERN-MODUS', rx + 124, 389, { size: 16, weight: '800', color: '#FBF8F3', align: 'center' });
      txt('Sofort im Blick', rx + 34, 455, { size: 36, weight: '800', color: '#191918' });

      // Notificación que salta con muelle elástico
      if (t > 1.1) {
        const np = spring((t - 1.1) / 0.7);
        ctx.save();
        ctx.translate(rx + 250, 595);
        ctx.scale(np, np);
        ctx.shadowColor = 'rgba(0,0,0,0.14)';
        ctx.shadowBlur = 30;
        rRect(-216, -90, 432, 180, 24, '#ffffff', '#15803D', 3);
        ctx.shadowBlur = 0;
        drawCheckIcon(-168, -32, 24, '#15803D', '#ffffff');
        txt('Gerade synchronisiert!', -124, -44, { size: 22, weight: '800', color: '#15803D' });
        txt('Heute: +45 Min. gelernt', -124, -10, { size: 20, weight: '700', color: '#191918' });
        rRect(-190, 26, 380, 44, 12, '#FEF3C7', null);
        txt('2 Fragen für heute Abend bereit →', 0, 49, { size: 18, weight: '800', color: '#92400E', align: 'center' });
        ctx.restore();
      }
    }

    // =========================================================================
    // ESCENA 4 (14.5s - 19.8s): ACTIVE RECALL CON TARJETA QUE GIRA EN 3D (FLIP)
    // =========================================================================
    function scene4(t) {
      drawWarmPaperBg(t + 30, '#FBF8F3', 0.05);

      const enter = easeOutQuart(t / 0.5);
      // Izquierda: Texto directo y humano
      rRect(110, 175, 310, 48, 24, '#191918', null);
      txt('ABENDS AUF DEM SOFA', 265, 200, { size: 18, weight: '800', color: '#FBF8F3', align: 'center' });

      txt('5 Minuten abfragen', 110, 305, { size: 72, weight: '800', color: '#191918', alpha: enter });
      txt('statt 2 Stunden Streit.', 110, 395, { size: 70, weight: '800', color: '#15803D', italic: true, alpha: enter });

      txt('Du musst kein Mathe-Lehrer sein:', 110, 505, { size: 32, weight: '700', color: '#44403C', alpha: enter });
      txt('Frage & Musterlösung stehen schon bereit.', 110, 555, { size: 32, weight: '700', color: '#44403C', alpha: enter });

      // Contador de racha animado
      const streak = t > 3.6 ? 6 : 5;
      const streakPop = t > 3.6 ? spring((t - 3.6) / 0.5) : 1;
      ctx.save();
      ctx.translate(310, 690);
      ctx.scale(streakPop, streakPop);
      rRect(-200, -48, 400, 96, 24, '#ffffff', '#E5E0D5', 3);
      drawBoltIcon(-145, 0, 1.1, '#FF5A36');
      txt(`Lern-Serie: ${streak} Tage in Folge!`, -105, 2, { size: 25, weight: '800', color: '#191918' });
      ctx.restore();

      // Derecha: Tarjeta Flashcard con GIRO 3D REAL a los t=1.6s
      const flipProgress = clamp((t - 1.4) / 0.75);
      const angle = flipProgress * Math.PI;
      const scaleX = Math.cos(angle);
      const showingBack = flipProgress >= 0.5;

      ctx.save();
      ctx.translate(1360, 530);
      ctx.scale(Math.abs(scaleX), 1);

      ctx.shadowColor = 'rgba(25, 25, 24, 0.18)';
      ctx.shadowBlur = 50;
      ctx.shadowOffsetY = 22;

      if (!showingBack) {
        // CARA A: LA PREGUNTA PARA HACERLE AL HIJO
        rRect(-430, -340, 860, 680, 38, '#ffffff', '#191918', 4);
        ctx.shadowBlur = 0;
        rRect(-370, -280, 320, 46, 23, '#F4EFE6', null);
        txt('MATHEMATIK • BRÜCHE', -210, -256, { size: 17, weight: '800', color: '#191918', align: 'center' });

        txt('Frage an dein Kind:', -370, -140, { size: 26, weight: '700', color: '#78716C' });
        txt('„Wie dividiert man', -370, -60, { size: 54, weight: '800', color: '#191918' });
        txt('einen Bruch durch', -370, 10, { size: 54, weight: '800', color: '#191918' });
        txt('einen zweiten Bruch?“', -370, 80, { size: 54, weight: '800', color: '#FF5A36' });

        rRect(-370, 190, 740, 86, 22, '#191918', null);
        txt('Antwort & Spickzettel umdrehen ↻', 0, 233, { size: 24, weight: '800', color: '#ffffff', align: 'center' });
      } else {
        // CARA B: LA CHULETA PARA EL PADRE + BOTONES DE CALIFICACIÓN
        rRect(-430, -340, 860, 680, 38, '#ffffff', '#15803D', 4);
        ctx.shadowBlur = 0;
        rRect(-370, -285, 360, 46, 23, '#DCFCE7', null);
        txt('SPICKZETTEL FÜR ELTERN', -190, -261, { size: 17, weight: '800', color: '#15803D', align: 'center' });

        txt('Musterlösung:', -370, -185, { size: 22, weight: '700', color: '#78716C' });
        txt('Man multipliziert den ersten Bruch', -370, -125, { size: 36, weight: '800', color: '#191918' });
        txt('mit dem Kehrwert des zweiten Bruchs.', -370, -72, { size: 36, weight: '800', color: '#15803D' });

        rRect(-370, -15, 740, 84, 18, '#FBF8F3', '#D6D3D1', 2);
        txt('Beispiel:   2/3  :  4/5   =   2/3  ×  5/4', 0, 27, { size: 28, weight: '800', color: '#191918', align: 'center' });

        txt('WIE HAT DEIN KIND GEANTWORTET?', 0, 125, { size: 17, weight: '800', color: '#78716C', align: 'center' });
        const opts = [
          { lbl: 'Unsicher (Morgen)', active: false },
          { lbl: 'Mit Hilfe (3 Tage)', active: false },
          { lbl: 'Perfekt erklärt! (+7 Tage)', active: t > 3.4 },
        ];
        opts.forEach((o, idx) => {
          const bx = -370 + idx * 252;
          const w = idx === 2 ? 236 : 236;
          const isHit = o.active;
          rRect(bx, 160, w, 110, 22, isHit ? '#15803D' : '#F4EFE6', isHit ? '#15803D' : '#D6D3D1', 2.5);
          txt(o.lbl, bx + w / 2, 215, { size: 18, weight: '800', color: isHit ? '#ffffff' : '#191918', align: 'center' });
        });
      }
      ctx.restore();

      // Dedo haciendo clic en "Perfekt erklärt!"
      if (t > 2.8 && t < 4.4) {
        const cp = t > 3.35 ? (t - 3.35) / 0.45 : 0;
        drawTouchCursor(1615, 745, cp);
      }
    }

    // =========================================================================
    // ESCENA 5 (19.8s - 24.5s): CALENDARIO VISUAL + CONTADOR DE NOTA MEDIA EN VIVO
    // =========================================================================
    function scene5(t) {
      drawWarmPaperBg(t + 40, '#F4EFE6', 0.05);

      const enter = easeOutQuart(t / 0.55);

      // Izquierda: Nota media animándose en vivo (de 2,4 baja a 1,6)
      rRect(110, 150, 320, 48, 24, '#FF5A36', null);
      txt('PRÜFUNGSKALENDER & NOTEN', 270, 175, { size: 18, weight: '800', color: '#ffffff', align: 'center' });

      txt('Keine Überraschungen', 110, 275, { size: 64, weight: '800', color: '#191918', alpha: enter });
      txt('vor Klassenarbeiten.', 110, 355, { size: 64, weight: '800', color: '#FF5A36', alpha: enter });

      // Tarjeta gigante de Notendurchschnitt con contador dinámico
      const avgVal = lerp(2.4, 1.6, easeInOutCubic((t - 0.5) / 2.2));
      const avgStr = avgVal.toFixed(1).replace('.', ',');

      ctx.shadowColor = 'rgba(0,0,0,0.1)';
      ctx.shadowBlur = 35;
      rRect(110, 440, 620, 420, 34, '#ffffff', '#E5E0D5', 3);
      ctx.shadowBlur = 0;

      txt('AKTUELLER NOTENDURCHSCHNITT', 155, 505, { size: 19, weight: '800', color: '#78716C' });
      txt(`Ø ${avgStr}`, 155, 620, { size: 120, weight: '800', color: '#15803D' });
      drawBadgePill('Deutsches System (1+ bis 6)', 155, 735, '#DCFCE7', '#15803D');
      txt('Mündliche Mitarbeit: Ø 1,4 (Sehr gut)', 155, 815, { size: 22, weight: '800', color: '#191918' });

      // Derecha: Calendario mensual con días que saltan con muelle (spring)
      const cx = 810;
      const cy = 150;
      const cw = 990;
      const ch = 710;

      ctx.shadowColor = 'rgba(0,0,0,0.12)';
      ctx.shadowBlur = 40;
      rRect(cx, cy, cw, ch, 34, '#ffffff', '#E5E0D5', 3);
      ctx.shadowBlur = 0;

      rRect(cx, cy, cw, 95, [34, 34, 0, 0], '#191918', null);
      txt('NOVEMBER • KLASSENARBEITEN & RECAPS', cx + 38, cy + 48, { size: 24, weight: '800', color: '#ffffff' });

      const cols = ['MO', 'DI', 'MI', 'DO', 'FR'];
      const cellW = (cw - 60) / 5;
      const cellH = 170;

      cols.forEach((d, i) => {
        txt(d, cx + 30 + i * cellW + cellW / 2, cy + 128, { size: 17, weight: '800', color: '#78716C', align: 'center' });
      });

      const events = [
        { r: 0, c: 1, day: 5, tag: 'Bio Test: 1+', bg: '#DCFCE7', fg: '#15803D', delay: 0.3 },
        { r: 0, c: 3, day: 7, tag: '3 Recaps ✓', bg: '#F4EFE6', fg: '#191918', delay: 0.5 },
        { r: 1, c: 0, day: 11, tag: 'Deutsch: 2+', bg: '#DCFCE7', fg: '#15803D', delay: 0.7 },
        { r: 1, c: 2, day: 13, tag: 'Vertretung', bg: '#FEF3C7', fg: '#B45309', delay: 0.9 },
        { r: 2, c: 4, day: 22, tag: 'Mathe Arbeit!', bg: '#FEE2E2', fg: '#B91C1C', delay: 1.2, highlight: true },
      ];

      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 5; c++) {
          const bx = cx + 30 + c * cellW;
          const by = cy + 155 + r * cellH;
          const dNum = r * 7 + c + 4;
          rRect(bx + 6, by + 6, cellW - 12, cellH - 12, 18, '#FBF8F3', '#E7E5E4', 2);
          txt(String(dNum), bx + 24, by + 32, { size: 20, weight: '800', color: '#57534E' });
        }
      }

      events.forEach((ev) => {
        if (t > ev.delay) {
          const sp = spring((t - ev.delay) / 0.6);
          const bx = cx + 30 + ev.c * cellW;
          const by = cy + 155 + ev.r * cellH;
          ctx.save();
          ctx.translate(bx + cellW / 2, by + 98);
          ctx.scale(sp, sp);
          rRect(-cellW / 2 + 16, -32, cellW - 32, 64, 14, ev.bg, ev.fg, ev.highlight ? 3 : 2);
          txt(ev.tag, 0, 1, { size: 19, weight: '800', color: ev.fg, align: 'center' });
          ctx.restore();
        }
      });
    }

    function drawBadgePill(text, x, y, bg, fg) {
      ctx.save();
      ctx.font = `800 20px ${FONT}`;
      const w = ctx.measureText(text).width + 36;
      rRect(x, y - 22, w, 44, 22, bg, null);
      txt(text, x + w / 2, y, { size: 20, weight: '800', color: fg, align: 'center' });
      ctx.restore();
    }

    // =========================================================================
    // ESCENA 6 (24.5s - 28.5s): CIERRE EDITORIAL CÁLIDO Y HUMANO
    // =========================================================================
    function scene6(t) {
      drawWarmPaperBg(t + 50, '#191918', 0.06);

      const p1 = spring(t / 0.8);
      const p2 = easeOutQuart((t - 0.4) / 0.6);

      ctx.save();
      ctx.translate(W / 2, 260);
      ctx.scale(p1, p1);
      rRect(-90, -90, 180, 180, 44, '#FF5A36', null);
      txt('SF', 0, 4, { size: 82, weight: '800', color: '#ffffff', align: 'center' });
      ctx.restore();

      txt('SchulFamilie', W / 2, 440, { size: 92, weight: '800', color: '#FBF8F3', align: 'center', alpha: p2 });
      txt('Weniger Streit um die Schule. Mehr echte Zeit zusammen.', W / 2, 540, {
        size: 40, weight: '700', color: '#FDBA74', align: 'center', alpha: p2
      });
      drawHandMarkerLine(W / 2 - 480, 575, W / 2 + 480, 575, (t - 0.8) / 0.5, '#FF5A36', 8);

      // Botón Google Play limpio
      if (t > 0.6) {
        const bp = spring((t - 0.6) / 0.7);
        ctx.save();
        ctx.translate(W / 2, 735);
        ctx.scale(bp, bp);
        rRect(-270, -62, 540, 124, 30, '#FBF8F3', '#FF5A36', 4);
        txt('JETZT ENTDECKEN AUF', 0, -22, { size: 18, weight: '800', color: '#57534E', align: 'center' });
        txt('Google Play', 0, 22, { size: 46, weight: '800', color: '#191918', align: 'center' });
        ctx.restore();

        txt('Stundenplan  •  KI-Recap  •  Active Recall  •  100 % Privat (E2EE)', W / 2, 900, {
          size: 24, weight: '700', color: '#A8A29E', align: 'center', alpha: p2
        });
      }
    }

    // Cortinilla de transición rápida estilo editor de vídeo (Whip-Wipe)
    function drawWhipTransition(progress) {
      if (progress <= 0 || progress >= 1) return;
      const p = easeInOutCubic(progress);
      const x = lerp(-W, W, p);
      ctx.save();
      ctx.fillStyle = '#FF5A36';
      ctx.fillRect(x, 0, W * 0.85, H);
      ctx.fillStyle = '#191918';
      ctx.fillRect(x - W * 0.25, 0, W * 0.35, H);
      ctx.restore();
    }

    // =========================================================================
    // MOTOR DE RENDERIZADO A 60 FPS
    // =========================================================================
    const CUTS = [4.5, 9.8, 14.5, 19.8, 24.5];

    function renderFrameAt(elapsedSec) {
      const t = elapsedSec % TOTAL_DURATION;

      if (t < 4.5) scene1(t);
      else if (t < 9.8) scene2(t - 4.5);
      else if (t < 14.5) scene3(t - 9.8);
      else if (t < 19.8) scene4(t - 14.5);
      else if (t < 24.5) scene5(t - 19.8);
      else scene6(t - 24.5);

      // Transiciones whip-pan en cada corte
      for (const cut of CUTS) {
        if (Math.abs(t - cut) < 0.22) {
          const wp = (t - (cut - 0.22)) / 0.44;
          drawWhipTransition(wp);
        }
      }

      if (!isExporting) {
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.fillRect(0, H - 8, W, 8);
        ctx.fillStyle = '#FF5A36';
        ctx.fillRect(0, H - 8, (t / TOTAL_DURATION) * W, 8);
      }
    }

    function loop(now) {
      if (!isExporting) {
        const elapsed = (now - startTime) / 1000;
        renderFrameAt(elapsed);
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // =========================================================================
    // EXPORTADOR A VÍDEO FULL HD
    // =========================================================================
    document.getElementById('btn-export').addEventListener('click', () => {
      if (isExporting) return;
      isExporting = true;

      const statusBox = document.getElementById('export-status');
      const pctEl = document.getElementById('export-pct');
      const barEl = document.getElementById('export-bar');
      const exportBtn = document.getElementById('btn-export');
      statusBox.classList.remove('hidden');
      exportBtn.disabled = true;
      exportBtn.classList.add('opacity-50');

      const stream = canvas.captureStream(60);
      const mimeTypes = [
        'video/mp4;codecs=avc1.42E01E',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm'
      ];
      let chosenMime = '';
      for (const m of mimeTypes) {
        if (MediaRecorder.isTypeSupported(m)) {
          chosenMime = m;
          break;
        }
      }
      const ext = chosenMime.includes('mp4') ? 'mp4' : 'webm';
      const recorder = new MediaRecorder(stream, {
        mimeType: chosenMime || undefined,
        videoBitsPerSecond: 14000000
      });

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: chosenMime || 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SchulFamilie_Trailer_DE_1080p.${ext}`;
        a.click();
        URL.revokeObjectURL(url);

        isExporting = false;
        statusBox.classList.add('hidden');
        exportBtn.disabled = false;
        exportBtn.classList.remove('opacity-50');
        startTime = performance.now();
      };

      recorder.start();
      const recStart = performance.now();

      function recordStep(now) {
        const elapsed = (now - recStart) / 1000;
        const pct = Math.min(100, Math.round((elapsed / TOTAL_DURATION) * 100));
        pctEl.textContent = pct + '%';
        barEl.style.width = pct + '%';

        if (elapsed >= TOTAL_DURATION) {
          renderFrameAt(TOTAL_DURATION - 0.01);
          setTimeout(() => recorder.stop(), 150);
          return;
        }
        renderFrameAt(elapsed);
        requestAnimationFrame(recordStep);
      }
      requestAnimationFrame(recordStep);
    });
  </script>
